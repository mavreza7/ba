<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horse Racing 3D — V12 FINAL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#8dbbca;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

canvas{
    display:block;
}

/* =========================
   TOP TITLE
========================= */

#titleBox{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    padding:14px 20px;
    border-radius:18px;
    background:rgba(30,45,38,.72);
    backdrop-filter:blur(10px);
    text-align:center;
    color:white;
    z-index:20;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

#titleBox h1{
    font-size:20px;
    letter-spacing:3px;
    font-weight:800;
}

#titleBox p{
    margin-top:5px;
    font-size:11px;
    opacity:.7;
    letter-spacing:1px;
}

/* =========================
   POSITION PANEL
========================= */

#positionPanel{
    position:fixed;
    top:20px;
    right:18px;
    width:225px;
    padding:14px;
    border-radius:18px;
    background:rgba(30,45,38,.72);
    backdrop-filter:blur(10px);
    color:white;
    z-index:20;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

#positionPanel h2{
    font-size:15px;
    letter-spacing:1px;
    margin-bottom:10px;
}

.positionRow{
    display:grid;
    grid-template-columns:24px 1fr 45px;
    align-items:center;
    gap:4px;
    height:30px;
    padding:0 8px;
    border-radius:8px;
    font-size:12px;
    margin-bottom:3px;
}

.positionRow:first-of-type{
    background:rgba(255,255,255,.12);
}

.rank{
    opacity:.7;
    font-weight:bold;
}

.horseName{
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.distance{
    text-align:right;
    opacity:.65;
    font-size:11px;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:linear-gradient(
        180deg,
        #87b9d0 0%,
        #a9d6e5 48%,
        #8fc884 100%
    );
    color:white;
    z-index:100;
    transition:opacity .5s ease;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}

.loaderTitle{
    font-size:24px;
    font-weight:800;
    letter-spacing:4px;
    margin-bottom:20px;
}

.loaderBar{
    width:280px;
    height:8px;
    border-radius:20px;
    background:rgba(255,255,255,.25);
    overflow:hidden;
}

#loaderProgress{
    width:0%;
    height:100%;
    background:white;
    border-radius:20px;
    transition:width .2s ease;
}

#loadingText{
    margin-top:12px;
    font-size:12px;
    opacity:.8;
}

/* =========================
   FINISH MESSAGE
========================= */

#finishMessage{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.8);
    padding:24px 45px;
    border-radius:20px;
    background:rgba(25,35,30,.88);
    backdrop-filter:blur(12px);
    color:white;
    text-align:center;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:.4s ease;
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

#finishMessage.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

#finishMessage .winnerTitle{
    font-size:13px;
    opacity:.7;
    letter-spacing:2px;
}

#finishMessage .winnerName{
    margin-top:8px;
    font-size:30px;
    font-weight:900;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #titleBox{
        top:10px;
        width:250px;
        padding:10px;
    }

    #titleBox h1{
        font-size:15px;
    }

    #positionPanel{
        top:10px;
        right:8px;
        width:180px;
        padding:9px;
    }

    #positionPanel h2{
        font-size:12px;
    }

    .positionRow{
        height:25px;
        font-size:10px;
    }

    .distance{
        font-size:9px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div class="loaderTitle">HORSE RACING</div>

    <div class="loaderBar">
        <div id="loaderProgress"></div>
    </div>

    <div id="loadingText">
        Menyiapkan arena...
    </div>
</div>

<div id="titleBox">
    <h1>🏇 HORSE RACING</h1>
    <p>RACING</p>
</div>

<div id="positionPanel">
    <h2>🏆 LIVE POSITION</h2>
    <div id="positions"></div>
</div>

<div id="finishMessage">
    <div class="winnerTitle">🏆 WINNER</div>
    <div class="winnerName" id="winnerName">---</div>
</div>

<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { FBXLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js";


/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9bc8d8);

scene.fog = new THREE.Fog(
    0x9bc8d8,
    150,
    430
);


const camera = new THREE.PerspectiveCamera(
    48,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);


const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.7)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight = new THREE.HemisphereLight(
    0xffffff,
    0x5b7150,
    2.1
);

scene.add(ambientLight);


const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    40,
    100,
    40
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -150;
sun.shadow.camera.right = 150;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* =========================================================
   WORLD
========================================================= */

const WORLD_LENGTH = 260;


/* =========================================================
   SKY
========================================================= */

const skyGeometry =
    new THREE.SphereGeometry(
        500,
        32,
        16
    );

const skyMaterial =
    new THREE.MeshBasicMaterial({
        color:0x9bc8d8,
        side:THREE.BackSide
    });

const sky =
    new THREE.Mesh(
        skyGeometry,
        skyMaterial
    );

scene.add(sky);


/* =========================================================
   GRASS
========================================================= */

const grassGeometry =
    new THREE.PlaneGeometry(
        500,
        300
    );

const grassMaterial =
    new THREE.MeshStandardMaterial({
        color:0x8fca82,
        roughness:1
    });

const grass =
    new THREE.Mesh(
        grassGeometry,
        grassMaterial
    );

grass.rotation.x = -Math.PI / 2;

grass.position.y = -0.15;

grass.receiveShadow = true;

scene.add(grass);


/* =========================================================
   TRACK
========================================================= */

const trackGeometry =
    new THREE.PlaneGeometry(
        WORLD_LENGTH,
        25
    );

const trackMaterial =
    new THREE.MeshStandardMaterial({
        color:0xc99c78,
        roughness:.95
    });

const track =
    new THREE.Mesh(
        trackGeometry,
        trackMaterial
    );

track.rotation.x = -Math.PI / 2;

track.position.y = 0;

track.receiveShadow = true;

scene.add(track);


/* =========================================================
   TRACK LINES
========================================================= */

function createTrackLine(z){

    const geometry =
        new THREE.PlaneGeometry(
            WORLD_LENGTH,
            .12
        );

    const material =
        new THREE.MeshBasicMaterial({
            color:0xdcb596
        });

    const line =
        new THREE.Mesh(
            geometry,
            material
        );

    line.rotation.x = -Math.PI / 2;

    line.position.set(
        0,
        .025,
        z
    );

    scene.add(line);
}


createTrackLine(-5);
createTrackLine(0);
createTrackLine(5);


/* =========================================================
   FENCES
========================================================= */

function createFence(z){

    const group = new THREE.Group();

    const railMaterial =
        new THREE.MeshStandardMaterial({
            color:0xf3f3f0,
            roughness:.8
        });

    for(
        let x=-WORLD_LENGTH/2;
        x<=WORLD_LENGTH/2;
        x+=8
    ){

        const postGeometry =
            new THREE.CylinderGeometry(
                .07,
                .07,
                1.4,
                8
            );

        const post =
            new THREE.Mesh(
                postGeometry,
                railMaterial
            );

        post.position.set(
            x,
            .7,
            z
        );

        post.castShadow = true;

        group.add(post);
    }


    for(
        let y of [0.55,1.05]
    ){

        const railGeometry =
            new THREE.BoxGeometry(
                WORLD_LENGTH,
                .07,
                .07
            );

        const rail =
            new THREE.Mesh(
                railGeometry,
                railMaterial
            );

        rail.position.set(
            0,
            y,
            z
        );

        group.add(rail);
    }

    scene.add(group);
}

createFence(-14);
createFence(14);


/* =========================================================
   TREES
   ========================================================= */

const treeFiles = [

    "Birch_2.fbx",
    "Birch_6.fbx",
    "Pine_1.fbx",
    "Pine_3.fbx",
    "Tree_1.fbx",
    "Tree_3.fbx",
    "Tree_5.fbx",
    "Tree_7.fbx"

];

const treeLoader = new FBXLoader();

const treeModels = [];

const treeColors = [
    0x4f8b4f,
    0x68a85b,
    0x79b86a,
    0x5e9852,
    0x8ac878,
    0x4b824b,
    0x6fae62,
    0x91c878
];


/* =========================================================
   MATERIAL RANDOMIZER
========================================================= */

function randomizeTreeMaterials(object){

    object.traverse(child => {

        if(!child.isMesh) return;

        child.castShadow = true;
        child.receiveShadow = true;

        if(
            child.material &&
            child.material.clone
        ){

            const material =
                child.material.clone();

            const color =
                treeColors[
                    Math.floor(
                        Math.random() *
                        treeColors.length
                    )
                ];

            /*
             * Hanya mengubah material jika memungkinkan.
             * Ini mencegah pohon menjadi satu warna semua.
             */

            if(material.color){

                const original =
                    material.color.clone();

                /*
                 * Campuran warna agar
                 * tekstur asli tetap lebih natural.
                 */

                material.color.lerp(
                    new THREE.Color(color),
                    .45
                );

                /*
                 * Hindari pohon terlalu gelap.
                 */

                if(
                    material.color.r < .12 &&
                    material.color.g < .12
                ){
                    material.color.copy(original);
                }
            }

            child.material = material;
        }
    });
}


/* =========================================================
   TREE RANDOM POSITIONS
========================================================= */

function randomTreePosition(){

    /*
     * Pohon hanya boleh berada
     * DI LUAR arena.
     *
     * Arena:
     * Z = -12.5 sampai +12.5
     *
     * Pohon:
     * Z = +/- 18 sampai +/- 34
     */

    const side =
        Math.random() < .5
        ? -1
        : 1;

    const x =
        THREE.MathUtils.randFloat(
            -WORLD_LENGTH/2 + 5,
            WORLD_LENGTH/2 - 5
        );

    const z =
        side *
        THREE.MathUtils.randFloat(
            18,
            34
        );

    return {x,z};
}


/* =========================================================
   CREATE TREE
========================================================= */

function addTree(model,index){

    const tree =
        model.clone(true);

    randomizeTreeMaterials(tree);

    const pos =
        randomTreePosition();

    tree.position.set(
        pos.x,
        0,
        pos.z
    );

    /*
     * Ukuran dibuat kecil supaya
     * tidak menutupi arena.
     */

    const scale =
        THREE.MathUtils.randFloat(
            .035,
            .065
        );

    tree.scale.setScalar(scale);

    tree.rotation.y =
        Math.random() *
        Math.PI *
        2;

    scene.add(tree);
}


/* =========================================================
   TREE LOADING
========================================================= */

async function loadTrees(){

    let loaded = 0;

    for(
        const file of treeFiles
    ){

        try{

            const model =
                await new Promise(
                    (resolve,reject)=>{

                        treeLoader.load(
                            `./assets/trees/${file}`,

                            object=>{
                                resolve(object);
                            },

                            xhr=>{

                                /*
                                 * Jangan membuat progress
                                 * stuck di 45%.
                                 */

                                const fileProgress =
                                    xhr.total
                                    ? xhr.loaded / xhr.total
                                    : 0;

                                const progress =
                                    (
                                        loaded +
                                        fileProgress
                                    ) /
                                    treeFiles.length;

                                updateLoading(
                                    progress
                                );
                            },

                            error=>{
                                reject(error);
                            }
                        );

                    }
                );

            treeModels.push(model);

            /*
             * Setiap aset FBX dipakai
             * beberapa kali.
             */

            for(
                let i=0;
                i<3;
                i++
            ){

                addTree(
                    model,
                    i
                );
            }

        }catch(error){

            console.warn(
                "Gagal memuat:",
                file,
                error
            );
        }

        loaded++;

        updateLoading(
            loaded / treeFiles.length
        );
    }
}


/* =========================================================
   LOADING UI
========================================================= */

function updateLoading(progress){

    const percent =
        Math.min(
            100,
            Math.round(progress * 100)
        );

    document
        .getElementById(
            "loaderProgress"
        )
        .style.width =
            percent + "%";

    document
        .getElementById(
            "loadingText"
        )
        .textContent =
            `Memuat aset pohon... ${percent}%`;
}


/* =========================================================
   HORSE DATA
========================================================= */

const horseData = [

    {
        name:"Shadow",
        color:0x171717
    },

    {
        name:"Golden Flash",
        color:0xd19a29
    },

    {
        name:"Blaze",
        color:0x8d2e17
    },

    {
        name:"Lightning",
        color:0x7d8388
    },

    {
        name:"Thunder",
        color:0x493529
    },

    {
        name:"Black Storm",
        color:0x17191c
    },

    {
        name:"Wild Runner",
        color:0x663018
    },

    {
        name:"Red Fury",
        color:0x9e321a
    }

];


/* =========================================================
   HORSE CREATION
========================================================= */

function createHorse(data){

    const group =
        new THREE.Group();

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color:data.color,
            roughness:.85
        });


    /*
     * BODY
     */

    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .45,
                1.15,
                5,
                8
            ),
            bodyMaterial
        );

    body.rotation.z =
        Math.PI / 2;

    body.position.y =
        1.15;

    body.castShadow = true;

    group.add(body);


    /*
     * HEAD
     */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .35,
                8,
                6
            ),
            bodyMaterial
        );

    head.scale.set(
        1.25,
        .85,
        .8
    );

    head.position.set(
        .85,
        1.55,
        0
    );

    head.castShadow = true;

    group.add(head);


    /*
     * NECK
     */

    const neck =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25,
                .38,
                .9,
                8
            ),
            bodyMaterial
        );

    neck.rotation.z =
        -0.55;

    neck.position.set(
        .55,
        1.55,
        0
    );

    neck.castShadow = true;

    group.add(neck);


    /*
     * LEGS
     */

    const legPositions = [

        [.45,.65,.28],
        [.45,.65,-.28],
        [-.45,.65,.28],
        [-.45,.65,-.28]

    ];

    legPositions.forEach(
        (pos,index)=>{

            const leg =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .09,
                        .12,
                        .9,
                        7
                    ),
                    bodyMaterial
                );

            leg.position.set(
                pos[0],
                pos[1],
                pos[2]
            );

            leg.castShadow = true;

            group.add(leg);
        }
    );


    /*
     * TAIL
     */

    const tail =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .22,
                .85,
                7
            ),
            bodyMaterial
        );

    tail.rotation.z =
        -1.0;

    tail.position.set(
        -.85,
        1.3,
        0
    );

    tail.castShadow = true;

    group.add(tail);


    /*
     * EARS
     */

    for(
        const z of [-.16,.16]
    ){

        const ear =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    .10,
                    .3,
                    6
                ),
                bodyMaterial
            );

        ear.position.set(
            .95,
            1.85,
            z
        );

        ear.rotation.x =
            z > 0 ? -.2 : .2;

        group.add(ear);
    }


    /*
     * EYE
     */

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color:0x111111
        });

    const eye =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .045,
                6,
                6
            ),
            eyeMaterial
        );

    eye.position.set(
        1.1,
        1.64,
        -.27
    );

    group.add(eye);


    /*
     * SCALE
     */

    group.scale.setScalar(.9);

    return group;
}


/* =========================================================
   HORSES
========================================================= */

const horses = [];

horseData.forEach(
    (data,index)=>{

        const horse =
            createHorse(data);

        /*
         * Start position
         */

        horse.position.x =
            -WORLD_LENGTH/2 + 8;

        /*
         * Setiap kuda punya lane.
         */

        horse.position.z =
            -8.5 +
            index * 2.35;

        horse.position.y =
            .05;

        scene.add(horse);

        horses.push({

            object:horse,

            name:data.name,

            lane:index,

            speed:
                THREE.MathUtils.randFloat(
                    8.8,
                    11.7
                ),

            progress:0,

            finished:false,

            finishTime:0
        });
    }
);


/* =========================================================
   FINISH LINE
========================================================= */

const finishX =
    WORLD_LENGTH/2 - 8;


/* Finish banner */

const finishGroup =
    new THREE.Group();

const poleMaterial =
    new THREE.MeshStandardMaterial({
        color:0xffffff
    });


function createFinishPole(z){

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .09,
                .09,
                5,
                10
            ),
            poleMaterial
        );

    pole.position.set(
        finishX,
        2.5,
        z
    );

    pole.castShadow = true;

    finishGroup.add(pole);
}

createFinishPole(-14);
createFinishPole(14);


/*
 * Banner
 */

const banner =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .18,
            3.2,
            28
        ),
        new THREE.MeshStandardMaterial({
            color:0xe8e8e8
        })
    );

banner.position.set(
    finishX,
    4,
    0
);

finishGroup.add(banner);


/*
 * Checkered finish strip
 */

const finishStrip =
    new THREE.Group();

for(
    let z=-12.5;
    z<12.5;
    z+=2
){

    const square =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .7,
                .035,
                2
            ),
            new THREE.MeshStandardMaterial({
                color:
                    Math.round(z/2)%2===0
                    ? 0xffffff
                    : 0x202020
            })
        );

    square.position.set(
        finishX,
        .045,
        z
    );

    finishStrip.add(square);
}

finishGroup.add(finishStrip);

scene.add(finishGroup);


/* =========================================================
   CAMERA
========================================================= */

camera.position.set(
    -55,
    36,
    54
);

camera.lookAt(
    0,
    0,
    0
);


/* =========================================================
   RACE STATE
========================================================= */

let raceStarted = false;
let raceFinished = false;

let raceStartTime = 0;


/* =========================================================
   START RACE
========================================================= */

function startRace(){

    raceStarted = true;

    raceStartTime =
        performance.now();

    horses.forEach(
        horse=>{

            horse.speed =
                THREE.MathUtils.randFloat(
                    8.5,
                    12
                );

            horse.finished = false;

            horse.finishTime = 0;

        }
    );
}


/* =========================================================
   UPDATE HORSES
========================================================= */

function updateHorses(delta){

    if(!raceStarted || raceFinished)
        return;

    horses.forEach(
        horse=>{

            if(horse.finished)
                return;

            /*
             * Sedikit variasi speed
             * agar balapan lebih natural.
             */

            const variation =
                Math.sin(
                    performance.now() *
                    .0015 +
                    horse.lane
                ) * .35;

            const speed =
                horse.speed +
                variation;

            horse.object.position.x +=
                speed * delta;

            /*
             * Gerakan kaki sederhana
             */

            horse.object.rotation.z =
                Math.sin(
                    performance.now() *
                    .015 +
                    horse.lane
                ) * .035;


            /*
             * Finish
             */

            if(
                horse.object.position.x >=
                finishX
            ){

                horse.object.position.x =
                    finishX;

                horse.finished = true;

                horse.finishTime =
                    performance.now();

                checkWinner();
            }
        }
    );

    updatePositions();
}


/* =========================================================
   WINNER
========================================================= */

function checkWinner(){

    if(raceFinished)
        return;

    const finishedHorse =
        horses.find(
            horse=>horse.finished
        );

    if(!finishedHorse)
        return;

    raceFinished = true;

    document
        .getElementById(
            "winnerName"
        )
        .textContent =
            finishedHorse.name;

    document
        .getElementById(
            "finishMessage"
        )
        .classList
        .add("show");
}


/* =========================================================
   LIVE POSITION
========================================================= */

function updatePositions(){

    const sorted =
        [...horses].sort(
            (a,b)=>
                b.object.position.x -
                a.object.position.x
        );

    const container =
        document.getElementById(
            "positions"
        );

    container.innerHTML = "";

    sorted.forEach(
        (horse,index)=>{

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "positionRow";

            const distance =
                Math.max(
                    0,
                    finishX -
                    horse.object.position.x
                );

            row.innerHTML = `

                <div class="rank">
                    ${index + 1}
                </div>

                <div class="horseName">
                    ${horse.name}
                </div>

                <div class="distance">
                    ${Math.round(distance)}m
                </div>

            `;

            container.appendChild(row);
        }
    );
}


/* =========================================================
   CAMERA FOLLOW
========================================================= */

function updateCamera(){

    if(!horses.length)
        return;

    const leader =
        [...horses].sort(
            (a,b)=>
                b.object.position.x -
                a.object.position.x
        )[0];

    const targetX =
        THREE.MathUtils.lerp(
            -30,
            leader.object.position.x + 18,
            .35
        );

    camera.position.x =
        THREE.MathUtils.lerp(
            camera.position.x,
            targetX,
            .025
        );

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            31,
            .025
        );

    camera.position.z =
        THREE.MathUtils.lerp(
            camera.position.z,
            48,
            .025
        );

    camera.lookAt(
        leader.object.position.x + 10,
        0,
        0
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   CLOCK
========================================================= */

const clock =
    new THREE.Clock();


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    updateHorses(delta);

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIALIZATION
========================================================= */

async function init(){

    updateLoading(0);

    /*
     * Load semua 8 FBX.
     */

    await loadTrees();

    updateLoading(1);

    /*
     * Tunggu sebentar supaya
     * transisi loading halus.
     */

    setTimeout(
        ()=>{

            document
                .getElementById(
                    "loading"
                )
                .classList
                .add("hidden");

            startRace();

        },
        500
    );

    updatePositions();

    animate();
}

init();

</script>

</html>
