<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>Horse Racing 3D — V9</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#071009;
}

canvas{
    display:block;
}

/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:
        radial-gradient(
            circle at center,
            #294b34 0%,
            #071009 75%
        );
    transition:.5s;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loading-title{
    font-size:clamp(32px,6vw,64px);
    font-weight:900;
    letter-spacing:6px;
}

.loading-subtitle{
    margin-top:12px;
    color:rgba(255,255,255,.65);
}

.loading-bar{
    width:min(350px,75vw);
    height:7px;
    margin-top:25px;
    overflow:hidden;
    border-radius:20px;
    background:rgba(255,255,255,.12);
}

#loading-progress{
    width:0%;
    height:100%;
    background:white;
    transition:.2s;
}

.loading-percent{
    margin-top:10px;
    font-size:12px;
    color:rgba(255,255,255,.5);
}

/* =====================================================
   SETUP MENU
===================================================== */

#setupPanel{
    position:fixed;
    inset:0;
    z-index:700;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(
            circle at center,
            rgba(48,91,60,.5),
            rgba(3,8,5,.96)
        );
    backdrop-filter:blur(10px);
}

.setup-box{
    width:min(850px,95vw);
    max-height:90vh;
    overflow:auto;
    padding:28px;
    color:white;
    border:1px solid rgba(255,255,255,.14);
    border-radius:26px;
    background:
        linear-gradient(
            145deg,
            rgba(25,42,29,.96),
            rgba(5,12,7,.98)
        );
    box-shadow:0 30px 100px rgba(0,0,0,.65);
}

.setup-title{
    text-align:center;
    font-size:30px;
    font-weight:1000;
    letter-spacing:3px;
}

.setup-subtitle{
    text-align:center;
    margin-top:6px;
    color:rgba(255,255,255,.5);
    font-size:12px;
}

.horse-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:24px;
}

.horse-card{
    display:grid;
    grid-template-columns:55px 1fr;
    gap:12px;
    align-items:center;
    padding:13px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.055);
}

.horse-color{
    width:48px;
    height:48px;
    border-radius:14px;
    border:3px solid rgba(255,255,255,.5);
    box-shadow:
        inset 0 0 15px rgba(0,0,0,.3),
        0 5px 15px rgba(0,0,0,.2);
}

.horse-info{
    min-width:0;
}

.horse-number{
    font-size:10px;
    color:rgba(255,255,255,.45);
    font-weight:bold;
}

.horse-input{
    width:100%;
    margin-top:5px;
    padding:9px 11px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:9px;
    outline:none;
    color:white;
    background:rgba(0,0,0,.25);
}

.horse-input:focus{
    border-color:rgba(255,255,255,.4);
}

.horse-speed-preview{
    margin-top:5px;
    font-size:9px;

}

#startRaceButton{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:13px;

    font-size:14px;
    font-weight:900;
    color:#101510;
    background:white;
    transition:.2s;
}

#startRaceButton:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(255,255,255,.12);
}

/* =====================================================
   COUNTDOWN
===================================================== */

#countdown{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    color:white;
    font-size:clamp(90px,20vw,220px);

}

#countdown.show{

}

/* =====================================================
   TOP HUD
===================================================== */

#topHud{

.race-title{

.race-status{

}

/* =====================================================

===================================================== */

#leaderboard{

}

}

.lb-row{

    align-items:center;
    justify-content:space-between;

}

.lb-row.leading{
    color:white;
    background:rgba(255,255,255,.13);
}

.lb-left{
    display:flex;
    align-items:center;
    gap:7px;
}

.lb-number{
    width:18px;
    text-align:center;
    font-weight:bold;
}

.lb-player{
    font-weight:600;
    max-width:120px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.lb-distance{
    color:rgba(255,255,255,.5);
}

/* =====================================================
   START PANEL
===================================================== */

#startPanel{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:100;
    padding:12px 20px;
    color:white;
    font-size:12px;
    border-radius:50px;

    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    transition:.4s;
}

#startPanel.hidden{
    opacity:0;
    transform:translateX(-50%) translateY(20px);
}

/* =====================================================
   FINISH
===================================================== */

#finishPanel{
    position:fixed;
    inset:0;
    z-index:800;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);
    transition:.5s;
}

#finishPanel.show{
    opacity:1;
    visibility:visible;
}

.finish-box{
    width:min(450px,90vw);
    max-height:90vh;

    padding:30px;
    color:white;
    text-align:center;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.15);
    background:
        linear-gradient(
            145deg,

            rgba(5,12,7,.97)
        );
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.finish-trophy{
    font-size:55px;
}

.finish-title{
    margin-top:8px;
    font-size:28px;
    font-weight:1000;
}

.finish-subtitle{
    margin-top:6px;
    font-size:12px;
    color:rgba(255,255,255,.5);
}

.final-list{
    margin-top:20px;

}

.final-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:5px;

    background:rgba(255,255,255,.06);

}

.final-row.first{
    background:rgba(255,255,255,.15);
}

.final-color{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    margin-right:7px;
}

#againButton{
    width:100%;
    margin-top:22px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:white;
    color:#101510;
    font-weight:900;
    cursor:pointer;
}

/* =====================================================
   EFFECT
===================================================== */

#cinematicVignette{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.24) 100%
        );
    box-shadow:inset 0 0 90px rgba(0,0,0,.22);
}

#raceFlash{
    position:fixed;
    inset:0;
    z-index:25;
    pointer-events:none;
    opacity:0;
    background:rgba(255,255,255,.28);
    transition:opacity .12s ease;
}

#raceVignette{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    box-shadow:inset 0 0 140px rgba(0,0,0,.35);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    #topHud{

    }

    .setup-title{
        font-size:22px;
    }

    }
}

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    clone as cloneSkeleton
} from "three/addons/utils/SkeletonUtils.js";


/* =====================================================
   CONFIG
===================================================== */

const HORSE_FILE =
    "./quaternius_cc0-white-horse-1081(1).glb";

const HORSE_COUNT = 8;

const LANE_SPACING = 2.6;

const START_Z = 20;

const FINISH_Z = -280;


/* =====================================================
   COLORS
===================================================== */

const HORSE_COLORS = [
    0x8B4513,
    0x111111,
    0xF5F5F5,
    0x654321,
    0xC68642,
    0x4A3728,
    0x7B2D26,
    0xD6C2A1
];

const DEFAULT_NAMES = [
    "Thunder",
    "Shadow",
    "Snow",
    "Brownie",
    "Blaze",
    "Cocoa",
    "Red Storm",
    "Golden"
];


/* =====================================================
   GLOBAL
===================================================== */

let scene;
let camera;
let renderer;
let clock;

let horses = [];

let raceStarted = false;
let raceFinished = false;
let countdownRunning = false;

let finishOrder = [];

let dustMesh;
let dustParticles = [];

let cameraTarget = new THREE.Vector3();
let cameraLook = new THREE.Vector3();

let cameraShake = 0;


/* =====================================================
   DOM
===================================================== */

const loading =
    document.getElementById("loading");

const progress =
    document.getElementById("loading-progress");

const loadingPercent =
    document.querySelector(".loading-percent");

const setupPanel =
    document.getElementById("setupPanel");

const horseGrid =
    document.getElementById("horseGrid");

const startRaceButton =
    document.getElementById("startRaceButton");

const countdown =
    document.getElementById("countdown");

const raceStatus =
    document.getElementById("raceStatus");

const leaderRows =
    document.getElementById("leaderRows");

const startPanel =
    document.getElementById("startPanel");

const finishPanel =
    document.getElementById("finishPanel");

const finalList =
    document.getElementById("finalList");

const againButton =
    document.getElementById("againButton");

const raceFlash =
    document.getElementById("raceFlash");


/* =====================================================
   PLAYER DATA
===================================================== */

const horseData = [];

for(let i=0;i<HORSE_COUNT;i++){

    horseData.push({

        player:`Player ${i+1}`,

        name:DEFAULT_NAMES[i],

        color:HORSE_COLORS[i],

        speed:0

    });

}


/* =====================================================
   INIT
===================================================== */

function init(){

    clock =
        new THREE.Clock();

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x8bc7e8);


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            55,
            window.innerWidth /
            window.innerHeight,
            .1,
            1000
        );

    camera.position.set(
        0,
        13,
        32
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.1;

    document.body.appendChild(
        renderer.domElement
    );


    createLights();

    createWorld();

    createDustSystem();

    loadHorse();


    window.addEventListener(
        "resize",
        onResize
    );


    startRaceButton.addEventListener(
        "click",
        startRaceFromMenu
    );


    againButton.addEventListener(
        "click",
        restartRace
    );


    animate();

}


/* =====================================================
   LIGHTS
===================================================== */

function createLights(){

    const hemi =
        new THREE.HemisphereLight(
            0xffffff,
            0x36553a,
            2.5
        );

    scene.add(hemi);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3.5
        );

    sun.position.set(
        -40,
        60,
        30
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;

    sun.shadow.mapSize.height = 2048;

    sun.shadow.camera.left = -100;

    sun.shadow.camera.right = 100;

    sun.shadow.camera.top = 100;

    sun.shadow.camera.bottom = -100;

    scene.add(sun);

}


/* =====================================================
   WORLD
===================================================== */

function createWorld(){

    const grass =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                650
            ),

            new THREE.MeshStandardMaterial({

                color:0x4c9f50,

                roughness:1

            })

        );

    grass.rotation.x =
        -Math.PI / 2;

    grass.receiveShadow = true;

    scene.add(grass);


    const track =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                25,
                650
            ),

            new THREE.MeshStandardMaterial({

                color:0x956c51,

                roughness:.95

            })

        );

    track.rotation.x =
        -Math.PI / 2;

    track.position.y = .02;

    track.receiveShadow = true;

    scene.add(track);


    for(
        let i=-4;
        i<=4;
        i++
    ){

        const line =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    .035,
                    650
                ),

                new THREE.MeshBasicMaterial({

                    color:0xffffff,

                    transparent:true,

                    opacity:.25

                })

            );

        line.rotation.x =
            -Math.PI / 2;

        line.position.set(
            i * LANE_SPACING,
            .045,
            0
        );

        scene.add(line);

    }


    createFence(-14);

    createFence(14);

    createStartLine();

    createFinishLine();

    createFinishArch();

    createTrees();

    createMountains();

}


/* =====================================================
   FENCE
===================================================== */

function createFence(x){

    for(
        let z=-320;
        z<=50;
        z+=5
    ){

        const post =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .18,
                    1.35,
                    .18
                ),

                new THREE.MeshStandardMaterial({

                    color:0xffffff

                })

            );

        post.position.set(
            x,
            .68,
            z
        );

        post.castShadow = true;

        scene.add(post);


        const rail =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .12,
                    .12,
                    5
                ),

                new THREE.MeshStandardMaterial({

                    color:0xffffff

                })

            );

        rail.position.set(
            x,
            .95,
            z + 2.5
        );

        scene.add(rail);

    }

}


/* =====================================================
   START LINE
===================================================== */

function createStartLine(){

    const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                25,
                .06,
                1
            ),

            new THREE.MeshStandardMaterial({

                color:0xffffff

            })

        );

    line.position.set(
        0,
        .06,
        START_Z
    );

    scene.add(line);

}


/* =====================================================
   FINISH LINE
===================================================== */

function createFinishLine(){

    const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                25,
                .07,
                1.4
            ),

            new THREE.MeshStandardMaterial({

                color:0xffffff

            })

        );

    line.position.set(
        0,
        .07,
        FINISH_Z
    );

    scene.add(line);

}


/* =====================================================
   FINISH ARCH
===================================================== */

function createFinishArch(){

    const material =
        new THREE.MeshStandardMaterial({

            color:0xffffff

        });


    const left =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .4,
                7,
                .4
            ),

            material

        );

    left.position.set(
        -10,
        3.5,
        FINISH_Z
    );

    scene.add(left);


    const right =
        left.clone();

    right.position.x = 10;

    scene.add(right);


    const top =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                20,
                .45,
                .45
            ),

            material

        );

    top.position.set(
        0,
        7,
        FINISH_Z
    );

    scene.add(top);

}


/* =====================================================
   TREES
===================================================== */

function createTrees(){

    for(
        let i=0;
        i<80;
        i++
    ){

        const side =
            Math.random() < .5
            ? -1
            : 1;

        const x =
            side *
            (
                18 +
                Math.random() * 25
            );

        const z =
            -320 +
            Math.random() * 380;

        createTree(x,z);

    }

}


/* =====================================================
   TREE
===================================================== */

function createTree(x,z){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .22,
                .35,
                2.8,
                8
            ),

            new THREE.MeshStandardMaterial({

                color:0x60452e

            })

        );

    trunk.position.set(
        x,
        1.4,
        z
    );

    trunk.castShadow = true;

    scene.add(trunk);


    const crown =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.7,
                10,
                10
            ),

            new THREE.MeshStandardMaterial({

                color:0x22652f

            })

        );

    crown.position.set(
        x,
        3.4,
        z
    );

    crown.castShadow = true;

    scene.add(crown);

}


/* =====================================================
   MOUNTAINS
===================================================== */

function createMountains(){

    for(
        let i=0;
        i<14;
        i++
    ){

        const mountain =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    10 + Math.random()*10,
                    18 + Math.random()*12,
                    4
                ),

                new THREE.MeshStandardMaterial({

                    color:0x668568,

                    roughness:1

                })

            );

        mountain.position.set(
            -120 + i*18,
            8,
            -280
        );

        mountain.rotation.y =
            Math.random();

        scene.add(mountain);

    }

}


/* =====================================================
   DUST
===================================================== */

function createDustSystem(){

    const geometry =
        new THREE.SphereGeometry(
            .16,
            6,
            6
        );

    const material =
        new THREE.MeshBasicMaterial({

            color:0xd8b58a,

            transparent:true,

            opacity:.5,

            depthWrite:false

        });

    dustMesh =
        new THREE.InstancedMesh(
            geometry,
            material,
            140
        );

    dustMesh.instanceMatrix.setUsage(
        THREE.DynamicDrawUsage
    );

    scene.add(dustMesh);


    const dummy =
        new THREE.Object3D();


    for(let i=0;i<140;i++){

        dustParticles.push({

            active:false,

            x:0,

            y:-100,

            z:0,

            vx:0,

            vy:0,

            vz:0,

            life:0,

            maxLife:1,

            scale:1

        });

        dummy.position.set(
            0,
            -100,
            0
        );

        dummy.scale.setScalar(0);

        dummy.updateMatrix();

        dustMesh.setMatrixAt(
            i,
            dummy.matrix
        );

    }

    dustMesh.instanceMatrix.needsUpdate = true;

}


/* =====================================================
   SPAWN DUST
===================================================== */

function spawnDust(horse){

    const p =
        dustParticles.find(
            x => !x.active
        );

    if(!p)return;

    p.active = true;

    p.x =
        horse.model.position.x +
        (Math.random()-.5)*.55;

    p.y =
        .08 +
        Math.random()*.2;

    p.z =
        horse.model.position.z +
        1 +
        Math.random()*.7;

    p.vx =
        (Math.random()-.5)*.9;

    p.vy =
        .25 +
        Math.random()*.55;

    p.vz =
        .8 +
        Math.random()*1.5;

    p.life = 0;

    p.maxLife =
        .45 +
        Math.random()*.55;

    p.scale =
        .55 +
        Math.random()*.8;

}


/* =====================================================
   UPDATE DUST
===================================================== */

function updateDust(delta){

    if(!dustMesh)return;

    const d =
        new THREE.Object3D();

    for(
        let i=0;
        i<dustParticles.length;
        i++
    ){

        const p =
            dustParticles[i];


        if(p.active){

            p.life += delta;

            p.x += p.vx * delta;

            p.y += p.vy * delta;

            p.z += p.vz * delta;

            p.vy -=
                1.15 * delta;

            if(
                p.life >= p.maxLife
            ){

                p.active = false;

            }

        }


        if(p.active){

            const t =
                p.life /
                p.maxLife;

            d.position.set(
                p.x,
                p.y,
                p.z
            );

            d.scale.setScalar(
                Math.max(
                    .001,
                    p.scale * (1-t)
                )
            );

        }
        else{

            d.position.set(
                0,
                -100,
                0
            );

            d.scale.setScalar(0);

        }


        d.updateMatrix();

        dustMesh.setMatrixAt(
            i,
            d.matrix
        );

    }

    dustMesh.instanceMatrix.needsUpdate = true;

}


/* =====================================================
   LOAD HORSE
===================================================== */

function loadHorse(){

    const loader =
        new GLTFLoader();


    loader.load(

        HORSE_FILE,


        function(gltf){

            progress.style.width =
                "100%";

            loadingPercent.textContent =
                "100%";


            createHorses(gltf);


            setTimeout(
                function(){

                    loading.classList.add(
                        "hide"
                    );

                },

            );

        },


        function(xhr){

                const percent =
                    (
                        xhr.loaded /
                        xhr.total
                    ) * 100;

                progress.style.width =
                    percent + "%";

                loadingPercent.textContent =
                    Math.round(percent) + "%";

            }

        },


        function(error){

            console.error(
                "GLB LOAD ERROR",

            );

            ).textContent =

            loadingPercent.textContent =

        }

    );

}


/* =====================================================
   CREATE HORSES
===================================================== */

function createHorses(gltf){

    horses = [];


    let gallop =
        gltf.animations.find(
            animation =>
                animation.name
                    .toLowerCase()
                    .trim() === "gallop"
        );


    if(!gallop){

        gallop =
            gltf.animations.find(
                animation =>
                    animation.name
                        .toLowerCase()
                        .includes("gallop")
            );

    }


    for(
        let i=0;
        i<HORSE_COUNT;
        i++
    ){

        const horse =
            cloneSkeleton(
                gltf.scene
            );


        scene.add(horse);


        horse.scale.set(
            1,
            1,
            1
        );


        horse.updateMatrixWorld(true);


        let box =
            new THREE.Box3();

        box.setFromObject(horse);


        const size =
            new THREE.Vector3();

        box.getSize(size);


        const TARGET_HEIGHT =
            3.55;


        if(size.y > .001){

            const scale =
                TARGET_HEIGHT /
                size.y;

            horse.scale.set(
                scale,
                scale,
                scale
            );

        }


        horse.updateMatrixWorld(true);


        box =
            new THREE.Box3();

        box.setFromObject(horse);


        const x =
            (
                i - 3.5
            ) *
            LANE_SPACING;


        const y =
            -box.min.y;


        horse.position.set(
            x,
            y,
            START_Z
        );


        horse.rotation.y =
            Math.PI;


        /* =================================================
           WARNA KUDA
        ================================================= */

        applyHorseColor(
            horse,
            HORSE_COLORS[i]
        );


        horse.traverse(
            object => {

                if(object.isMesh){

                    object.castShadow = true;

                    object.receiveShadow = true;

                    object.frustumCulled = false;

                }

            }
        );


        const mixer =
            new THREE.AnimationMixer(
                horse
            );


        let action = null;


        if(gallop){

            action =
                mixer.clipAction(
                    gallop
                );

            action.setLoop(
                THREE.LoopRepeat,
                Infinity
            );

            action.setEffectiveWeight(1);

            action.setEffectiveTimeScale(1);

        }


        horses.push({

            id:i,

            player:`Player ${i+1}`,

            name:DEFAULT_NAMES[i],

            color:HORSE_COLORS[i],

            model:horse,

            mixer:mixer,

            action:action,

            baseSpeed:0,

            currentSpeed:0,

            distance:0,

            baseX:x,

            baseY:y,

            bobPhase:
                Math.random() *
                Math.PI * 2,

            dustTimer:
                Math.random()*.08,

            finished:false,

            finishTime:null,

            variation:
                Math.random() *
                Math.PI * 2

        });

    }


    updateLeaderboard();

}


/* =====================================================
   APPLY HORSE COLOR
===================================================== */

function applyHorseColor(model,color){

    model.traverse(
        object => {

            if(!object.isMesh)
                return;


            if(
                Array.isArray(
                    object.material
                )
            ){

                object.material =
                    object.material.map(
                        material => {

                            const m =
                                material.clone();

                            if(
                                m.color
                            ){

                                m.color.setHex(
                                    color
                                );

                            }

                            return m;

                        }
                    );

            }
            else if(object.material){

                object.material =
                    object.material.clone();

                if(
                    object.material.color
                ){

                    object.material.color.setHex(
                        color
                    );

                }

            }

        }
    );

}


/* =====================================================
   SETUP MENU
===================================================== */

function showSetupMenu(){

    horseGrid.innerHTML = "";


    horses.forEach(
        (horse,index) => {

                );

                );

                );

/* =====================================================
   RANDOM SPEED
===================================================== */

function randomizeSpeeds(){

    /*
       Setiap kuda mendapatkan speed
       random yang berbeda.

       Range dibuat cukup lebar supaya
       posisi pemenang benar-benar bisa
       berubah setiap race.
    */

    horses.forEach(
        horse => {

            horse.baseSpeed =
                THREE.MathUtils.randFloat(
                    8.0,
                    11.2
                );

            horse.currentSpeed =
                horse.baseSpeed;

        }
    );


    /*
       Acak lagi apabila selisih terlalu kecil.
       Tujuannya supaya race tidak terasa
       seperti urutan yang sama.
    */

    horses.sort(
        () =>
            Math.random() - .5
    );

}


/* =====================================================
   START FROM MENU
===================================================== */

function startRaceFromMenu(){

    horses.forEach(
        (horse,index) => {

            const input =
                document.getElementById(
                    `horseName${index}`
                );

            const name =
                input.value.trim();


            horse.name =
                name ||
                `Horse ${index+1}`;

            horse.player =
                horse.name;

        }
    );


    randomizeSpeeds();


    setupPanel.style.display =
        "none";


    resetRacePositions();


    updateLeaderboard();


    setTimeout(
        startCountdown,
        300
    );

}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown(){

    if(countdownRunning)
        return;


    countdownRunning = true;

    raceStarted = false;

    raceFinished = false;

    finishOrder = [];


    raceStatus.textContent =
        "GET READY";


    let number = 3;


    countdown.classList.add(
        "show"
    );

    countdown.textContent =
        number;


    const timer =
        setInterval(
            function(){

                number--;


                if(number > 0){

                    countdown.textContent =
                        number;

                }
                else{

                    countdown.textContent =
                        "GO!";


                    raceFlash.style.opacity =
                        "1";


                    setTimeout(
                        function(){

                            raceFlash.style.opacity =
                                "0";

                        },
                        120
                    );


                    raceStarted = true;

                    countdownRunning = false;


                    raceStatus.textContent =
                        "RACING";


                    startPanel.classList.add(
                        "hidden"
                    );


                    horses.forEach(
                        horse => {

                            if(horse.action){

                                horse.action
                                    .reset()
                                    .play();

                            }

                        }
                    );


                    setTimeout(
                        function(){

                            countdown.classList.remove(
                                "show"
                            );

                        },
                        700
                    );


                    clearInterval(timer);

                }

            },
            1000
        );

}


/* =====================================================
   UPDATE HORSES
===================================================== */

function updateHorses(
    delta,
    elapsed
){

    if(
        !raceStarted ||
        raceFinished
    )
        return;


    horses.forEach(
        horse => {

            if(horse.mixer)
                horse.mixer.update(delta);


            if(horse.finished)
                return;


            /*
               RANDOM SPEED VARIATION
            */

            const variation =
                Math.sin(
                    elapsed*.72 +
                    horse.variation
                ) * .28;


            const micro =
                Math.sin(
                    elapsed*1.7 +
                    horse.variation*1.9
                ) * .10;


            const surge =
                Math.sin(
                    elapsed*.21 +
                    horse.variation*2.4
                ) * .14;


            horse.currentSpeed =
                horse.baseSpeed +
                variation +
                micro +
                surge;


            const movement =
                horse.currentSpeed *
                delta;


            horse.model.position.z -=
                movement;


            horse.distance +=
                movement;


            /*
               GALLOP BOB
            */

            const phase =
                elapsed *
                (
                    7.2 +
                    horse.currentSpeed*.12
                ) +
                horse.bobPhase;


            const gallopBob =
                Math.sin(phase) * .045;


            const lateral =
                Math.sin(
                    phase*.5
                ) * .025;


            horse.model.position.y =
                horse.baseY +
                gallopBob;


            horse.model.position.x =
                horse.baseX +
                lateral;


            horse.model.rotation.z =
                Math.sin(
                    phase*.5
                ) * .008;


            horse.model.rotation.x =
                Math.sin(phase) * .006;


            if(horse.action){

                horse.action.setEffectiveTimeScale(

                    THREE.MathUtils.clamp(

                        .84 +
                        horse.currentSpeed /
                        10 * .31,

                        .84,

                        1.3

                    )

                );

            }


            /*
               DUST
            */

            horse.dustTimer -=
                delta;


            const dustInterval =
                THREE.MathUtils.clamp(

                    .095 -
                    (
                        horse.currentSpeed -
                        9
                    ) * .008,

                    .045,

                    .095

                );


            if(
                horse.dustTimer <= 0
            ){

                spawnDust(horse);

                if(
                    Math.random() > .32
                )
                    spawnDust(horse);


                horse.dustTimer =
                    dustInterval +
                    Math.random()*.045;

            }


            /*
               FINISH
            */

            if(
                horse.model.position.z <=
                FINISH_Z
            ){

                horse.finished = true;

                horse.finishTime =
                    elapsed;

                finishOrder.push(
                    horse
                );


                if(horse.action){

                    horse.action.stop();

                }

            }

        }
    );


    updateDust(delta);

    updateLeaderboard();


    if(
        finishOrder.length ===
        HORSE_COUNT
    ){

        finishRace();

    }

}


/* =====================================================
   LEADERBOARD
===================================================== */

function updateLeaderboard(){

    if(horses.length === 0)
        return;


    const sorted =
        [...horses].sort(
            (a,b) =>
                a.model.position.z -
                b.model.position.z
        );


    leaderRows.innerHTML = "";


    sorted.forEach(
        (horse,index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "lb-row";


            if(index === 0){

                row.classList.add(
                    "leading"
                );

            }


            row.innerHTML = `

                <div class="lb-left">

                    <div class="lb-number">
                        ${index+1}
                    </div>

                    <div class="lb-player">
                        ${horse.name}
                    </div>

                </div>

                <div class="lb-distance">
                    ${Math.round(
                        horse.distance
                    )}m
                </div>

            `;


            leaderRows.appendChild(row);

        }
    );

}


/* =====================================================
   FINISH
===================================================== */

function finishRace(){

    raceFinished = true;

    raceStarted = false;


    raceStatus.textContent =
        "FINISH";


    finalList.innerHTML = "";


    finishOrder.forEach(
        (horse,index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "final-row";


            if(index === 0){

                row.classList.add(
                    "first"
                );

            }


            const color =
                "#" +
                horse.color
                    .toString(16)
                    .padStart(6,"0");


            row.innerHTML = `

                <span>

                    <span
                        class="final-color"
                        style="
                            background:${color}
                        "
                    ></span>

                    ${index+1}.
                    ${horse.name}

                </span>

                <span>

                    ${
                        index === 0
                        ? "🏆"
                        : ""
                    }

                </span>

            `;


            finalList.appendChild(row);

        }
    );


    setTimeout(
        function(){

            finishPanel.classList.add(
                "show"
            );

        },
        1000
    );

}


/* =====================================================
   RESET
===================================================== */

function resetRacePositions(){

    horses.forEach(
        (horse,index) => {

            const x =
                (
                    index -
                    3.5
                ) *
                LANE_SPACING;


            horse.model.position.set(

                x,

                horse.baseY,

                START_Z

            );


            horse.baseX = x;

            horse.distance = 0;

            horse.finished = false;

            horse.finishTime = null;

            horse.currentSpeed =
                horse.baseSpeed;

            horse.dustTimer = .02;


            if(horse.action){

                horse.action.stop();

            }

        }
    );


    finishOrder = [];

    raceStarted = false;

    raceFinished = false;

    countdownRunning = false;


    updateLeaderboard();

}


/* =====================================================
   RACE AGAIN
===================================================== */

function restartRace(){

    finishPanel.classList.remove(
        "show"
    );


    /*
       PENTING:
       SPEED DIACAK ULANG
       SETIAP RACE.
    */

    randomizeSpeeds();


    resetRacePositions();


    raceStatus.textContent =
        "GET READY";


    startPanel.classList.remove(
        "hidden"
    );


    updateLeaderboard();


    setTimeout(
        startCountdown,
        400
    );

}


/* =====================================================
   CAMERA — SIDE TOP CINEMATIC
===================================================== */

function updateCamera(){

    if(horses.length === 0)
        return;


    let averageX = 0;

    let averageZ = 0;

    let leaderZ = Infinity;


    horses.forEach(
        horse => {

            averageX +=
                horse.model.position.x;

            averageZ +=
                horse.model.position.z;

            leaderZ =
                Math.min(
                    leaderZ,
                    horse.model.position.z
                );

        }
    );


    averageX /=
        horses.length;


    averageZ /=
        horses.length;


    const progress =
        THREE.MathUtils.clamp(

            (
                START_Z -
                averageZ
            ) /
            (
                START_Z -
                FINISH_Z
            ),

            0,
            1

        );


    /*
       KAMERA DARI SAMPING ATAS
    */

    const sideDistance =
        THREE.MathUtils.lerp(
            25,
            19,
            progress
        );


    const height =
        THREE.MathUtils.lerp(
            14,
            11,
            progress
        );


    const forward =
        THREE.MathUtils.lerp(
            9,
            7,
            progress
        );


    const side =
        THREE.MathUtils.lerp(
            16,
            13,
            progress
        );


    const sway =
        Math.sin(
            clock.elapsedTime*.25
        ) * .5;


    cameraTarget.set(

        averageX +
        side +
        sway,

        height,

        averageZ +
        sideDistance +
        forward

    );


    camera.position.lerp(
        cameraTarget,
        .055
    );


    cameraLook.set(

        averageX,

        1.7,

        averageZ -
        5

    );


    camera.lookAt(
        cameraLook
    );


    cameraShake =
        THREE.MathUtils.lerp(

            cameraShake,

            raceStarted
                ? .025
                : 0,

            .06

        );


    camera.position.x +=
        Math.sin(
            clock.elapsedTime*18
        ) *
        cameraShake;


    camera.position.y +=
        Math.cos(
            clock.elapsedTime*15
        ) *
        cameraShake*.5;


    const targetFov =
        THREE.MathUtils.lerp(
            52,
            59,
            progress
        );


    camera.fov +=
        (
            targetFov -
            camera.fov
        ) * .035;


    camera.updateProjectionMatrix();

}


/* =====================================================
   RESIZE
===================================================== */

function onResize(){

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    const elapsed =
        clock.elapsedTime;


    updateHorses(
        delta,
        elapsed
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   START
===================================================== */

init();

</script>
