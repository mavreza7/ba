<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Horse Racing 3D</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#071009;

}


canvas{

    display:block;

}


/* =====================================================
   LOADING
===================================================== */

#loading{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:white;

    background:
        radial-gradient(
            circle at center,
            #294b34 0%,
            #071009 75%
        );

    transition:
        opacity .5s ease,
        visibility .5s ease;

}


#loading.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;

}


.loading-title{

    font-size:
        clamp(
            32px,
            6vw,
            64px
        );

    font-weight:900;

    letter-spacing:6px;

}


.loading-subtitle{

    margin-top:12px;

    color:
        rgba(
            255,
            255,
            255,
            .65
        );

}


.loading-bar{

    width:
        min(
            350px,
            75vw
        );

    height:7px;

    margin-top:25px;

    overflow:hidden;

    border-radius:20px;

    background:
        rgba(
            255,
            255,
            255,
            .12
        );

}


#loading-progress{

    width:0%;

    height:100%;

    background:white;

    transition:
        width .2s ease;

}


.loading-percent{

    margin-top:10px;

    font-size:12px;

    color:
        rgba(
            255,
            255,
            255,
            .5
        );

}


/* =====================================================
   COUNTDOWN
===================================================== */

#countdown{

    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    align-items:center;

    justify-content:center;

    pointer-events:none;

    opacity:0;

    color:white;

    font-size:
        clamp(
            90px,
            20vw,
            220px
        );

    font-weight:1000;

    text-shadow:
        0 10px 50px
        rgba(
            0,
            0,
            0,
            .8
        );

}


#countdown.show{

    opacity:1;

}


/* =====================================================
   TOP HUD
===================================================== */

#topHud{

    position:fixed;

    top:18px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:100;

    min-width:320px;

    padding:
        13px 22px;

    color:white;

    text-align:center;

    border-radius:16px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .15
        );

    background:
        rgba(
            0,
            0,
            0,
            .38
        );

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 15px 40px
        rgba(
            0,
            0,
            0,
            .25
        );

}


.race-title{

    font-size:16px;

    font-weight:900;

    letter-spacing:3px;

}


.race-status{

    margin-top:5px;

    font-size:11px;

    color:
        rgba(
            255,
            255,
            255,
            .6
        );

}


/* =====================================================
   LEADERBOARD
===================================================== */

#leaderboard{

    position:fixed;

    top:18px;

    right:18px;

    z-index:100;

    width:220px;

    padding:14px;

    color:white;

    border-radius:16px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .12
        );

    background:
        rgba(
            0,
            0,
            0,
            .4
        );

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 15px 40px
        rgba(
            0,
            0,
            0,
            .25
        );

}


.lb-title{

    margin-bottom:10px;

    font-size:12px;

    font-weight:900;

    letter-spacing:1px;

}


.lb-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        7px;

    margin-top:3px;

    border-radius:7px;

    font-size:11px;

    color:
        rgba(
            255,
            255,
            255,
            .7
        );

}


.lb-row.leading{

    color:white;

    background:
        rgba(
            255,
            255,
            255,
            .13
        );

}


.lb-left{

    display:flex;

    align-items:center;

    gap:7px;

}


.lb-number{

    width:18px;

    text-align:center;

    font-weight:bold;

}


.lb-player{

    font-weight:600;

}


.lb-distance{

    color:
        rgba(
            255,
            255,
            255,
            .5
        );

}


/* =====================================================
   START
===================================================== */

#startPanel{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:
        translateX(-50%);

    z-index:100;

    padding:
        12px 20px;

    color:white;

    font-size:12px;

    border-radius:50px;

    background:
        rgba(
            0,
            0,
            0,
            .42
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .12
        );

    backdrop-filter:
        blur(12px);

    transition:.4s;

}


#startPanel.hidden{

    opacity:0;

    transform:
        translateX(-50%)
        translateY(20px);

}


/* =====================================================
   FINISH PANEL
===================================================== */

#finishPanel{

    position:fixed;

    inset:0;

    z-index:800;

    display:flex;

    align-items:center;

    justify-content:center;

    opacity:0;

    visibility:hidden;

    background:
        rgba(
            0,
            0,
            0,
            .55
        );

    backdrop-filter:
        blur(8px);

    transition:.5s;

}


#finishPanel.show{

    opacity:1;

    visibility:visible;

}


.finish-box{

    width:
        min(
            430px,
            90vw
        );

    padding:30px;

    color:white;

    text-align:center;

    border-radius:25px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .15
        );

    background:
        linear-gradient(
            145deg,
            rgba(
                30,
                45,
                33,
                .97
            ),
            rgba(
                5,
                12,
                7,
                .97
            )
        );

    box-shadow:
        0 30px 100px
        rgba(
            0,
            0,
            0,
            .6
        );

}


.finish-trophy{

    font-size:55px;

}


.finish-title{

    margin-top:8px;

    font-size:28px;

    font-weight:1000;

}


.finish-subtitle{

    margin-top:6px;

    font-size:12px;

    color:
        rgba(
            255,
            255,
            255,
            .5
        );

}


.final-list{

    margin-top:20px;

    text-align:left;

}


.final-row{

    display:flex;

    justify-content:space-between;

    padding:
        9px 12px;

    margin-top:5px;

    border-radius:9px;

    background:
        rgba(
            255,
            255,
            255,
            .06
        );

    font-size:13px;

}


.final-row.first{

    background:
        rgba(
            255,
            255,
            255,
            .15
        );

}


#againButton{

    width:100%;

    margin-top:22px;

    padding:13px;

    border:0;

    border-radius:12px;

    background:white;

    color:#101510;

    font-weight:900;

    cursor:pointer;

}


#againButton:hover{

    transform:
        translateY(-2px);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    #topHud{

        top:10px;

        min-width:220px;

        padding:
            9px 14px;

    }


    .race-title{

        font-size:12px;

    }


    #leaderboard{

        top:70px;

        right:10px;

        width:175px;

        padding:10px;

    }


    .lb-row{

        font-size:9px;

    }


    #startPanel{

        bottom:12px;

        font-size:10px;

    }

}

</style>


<!-- =====================================================
     IMPORT MAP
===================================================== -->

<script type="importmap">

{

    "imports":{

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

    }

}

</script>

</head>

===================================================== -->

<div id="loading">

    <div class="loading-title">
        HORSE RACING
    </div>

    <div class="loading-subtitle">

    </div>

    </div>

</div>

<!-- =====================================================

<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="module">


/* =====================================================
   IMPORT THREE
===================================================== */

import * as THREE
from "three";


/* =====================================================
   GLTF LOADER
===================================================== */

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   SKELETON UTILS

   IMPORTANT:
   Kita mengambil fungsi clone langsung.
===================================================== */

import {
    clone as cloneSkeleton
}
from "three/addons/utils/SkeletonUtils.js";


/* =====================================================
   CONFIG
===================================================== */

const HORSE_FILE =
    "./quaternius_cc0-white-horse-1081(1).glb";


const HORSE_COUNT =
    8;


const LANE_SPACING =
    2.6;


const START_Z =
    20;


const FINISH_Z =
    -280;


/* =====================================================
   GLOBAL
===================================================== */

let scene;

let camera;

let renderer;

let clock;

let horses = [];

let raceStarted =
    false;

let raceFinished =
    false;

let countdownRunning =
    false;

let finishOrder =
    [];


/* =====================================================
   DOM
===================================================== */

const loading =
    document.getElementById(
        "loading"
    );


const progress =
    document.getElementById(
        "loading-progress"
    );


const loadingPercent =
    document.querySelector(
        ".loading-percent"
    );


const countdown =
    document.getElementById(
        "countdown"
    );


const raceStatus =
    document.getElementById(
        "raceStatus"
    );


const leaderRows =
    document.getElementById(
        "leaderRows"
    );


const startPanel =
    document.getElementById(
        "startPanel"
    );


const finishPanel =
    document.getElementById(
        "finishPanel"
    );


const finalList =
    document.getElementById(
        "finalList"
    );


const againButton =
    document.getElementById(
        "againButton"
    );


/* =====================================================
   PLAYER DATA
===================================================== */

const horseData = [

    {
        player:"Player 1",
        speed:9.15
    },

    {
        player:"Player 2",
        speed:9.45
    },

    {
        player:"Player 3",
        speed:9.05
    },

    {
        player:"Player 4",
        speed:9.65
    },

    {
        player:"Player 5",
        speed:9.30
    },

    {
        player:"Player 6",
        speed:9.50
    },

    {
        player:"Player 7",
        speed:9.10
    },

    {
        player:"Player 8",
        speed:9.38
    }

];


/* =====================================================
   INIT
===================================================== */

function init(){


    clock =
        new THREE.Clock();


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x8bc7e8
        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(

            55,

            window.innerWidth /
            window.innerHeight,

            .1,

            1000

        );


    camera.position.set(

        0,
        11,
        34

    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.shadowMap.enabled =
        true;


    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.1;


    document.body.appendChild(
        renderer.domElement
    );


    createLights();

    createWorld();

    loadHorse();

    updateLeaderboard();


    window.addEventListener(
        "resize",
        onResize
    );


    againButton.addEventListener(
        "click",
        restartRace
    );


    animate();

}


/* =====================================================
   LIGHTS
===================================================== */

function createLights(){


    const hemi =
        new THREE.HemisphereLight(

            0xffffff,

            0x36553a,

            2.5

        );


    scene.add(hemi);


    const sun =
        new THREE.DirectionalLight(

            0xffffff,

            3.5

        );


    sun.position.set(
        -40,
        60,
        30
    );


    sun.castShadow =
        true;


    sun.shadow.mapSize.width =
        2048;


    sun.shadow.mapSize.height =
        2048;


    sun.shadow.camera.left =
        -100;


    sun.shadow.camera.right =
        100;


    sun.shadow.camera.top =
        100;


    sun.shadow.camera.bottom =
        -100;


    scene.add(sun);

}


/* =====================================================
   WORLD
===================================================== */

function createWorld(){


    /* GRASS */

    const grass =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                650
            ),

            new THREE.MeshStandardMaterial({

                color:0x4c9f50,

                roughness:1

            })

        );


    grass.rotation.x =
        -Math.PI / 2;


    grass.receiveShadow =
        true;


    scene.add(grass);


    /* TRACK */

    const track =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                25,
                650
            ),

            new THREE.MeshStandardMaterial({

                color:0x956c51,

                roughness:.95

            })

        );


    track.rotation.x =
        -Math.PI / 2;


    track.position.y =
        .02;


    track.receiveShadow =
        true;


    scene.add(track);


    /* LANE LINES */

    for(
        let i=-4;
        i<=4;
        i++
    ){

        const line =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    .035,
                    650
                ),

                new THREE.MeshBasicMaterial({

                    color:0xffffff,

                    transparent:true,

                    opacity:.25

                })

            );


        line.rotation.x =
            -Math.PI / 2;


        line.position.set(

            i *
            LANE_SPACING,

            .045,

            0

        );


        scene.add(line);

    }


    createFence(-14);

    createFence(14);

    createStartLine();

    createFinishLine();

    createFinishArch();

    createTrees();

    createMountains();

}


/* =====================================================
   FENCE
===================================================== */

function createFence(x){


    for(
        let z=-320;
        z<=50;
        z+=5
    ){

        const post =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .18,
                    1.35,
                    .18
                ),

                new THREE.MeshStandardMaterial({

                    color:0xffffff

                })

            );


        post.position.set(

            x,
            .68,
            z

        );


        post.castShadow =
            true;


        scene.add(post);


        const rail =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .12,
                    .12,
                    5
                ),

                new THREE.MeshStandardMaterial({

                    color:0xffffff

                })

            );


        rail.position.set(

            x,
            .95,
            z + 2.5

        );


        scene.add(rail);

    }

}


/* =====================================================
   START LINE
===================================================== */

function createStartLine(){


    const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                25,
                .06,
                1
            ),

            new THREE.MeshStandardMaterial({

                color:0xffffff

            })

        );


    line.position.set(

        0,
        .06,
        START_Z

    );


    scene.add(line);

}


/* =====================================================
   FINISH LINE
===================================================== */

function createFinishLine(){


    const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                25,
                .07,
                1.4
            ),

            new THREE.MeshStandardMaterial({

                color:0xffffff

            })

        );


    line.position.set(

        0,
        .07,
        FINISH_Z

    );


    scene.add(line);

}


/* =====================================================
   FINISH ARCH
===================================================== */

function createFinishArch(){


    const material =
        new THREE.MeshStandardMaterial({

            color:0xffffff

        });


    const left =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .4,
                7,
                .4
            ),

            material

        );


    left.position.set(

        -10,
        3.5,
        FINISH_Z

    );


    scene.add(left);


    const right =
        left.clone();


    right.position.x =
        10;


    scene.add(right);


    const top =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                20,
                .45,
                .45
            ),

            material

        );


    top.position.set(

        0,
        7,
        FINISH_Z

    );


    scene.add(top);

}


/* =====================================================
   TREES
===================================================== */

function createTrees(){


    for(
        let i=0;
        i<80;
        i++
    ){

        const side =
            Math.random() < .5
            ? -1
            : 1;


        const x =
            side *
            (
                18 +
                Math.random() *
                25
            );


        const z =
            -320 +
            Math.random() *
            380;


        createTree(
            x,
            z
        );

    }

}


/* =====================================================
   TREE
===================================================== */

function createTree(
    x,
    z
){


    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .22,
                .35,
                2.8,
                8
            ),

            new THREE.MeshStandardMaterial({

                color:0x60452e

            })

        );


    trunk.position.set(

        x,
        1.4,
        z

    );


    trunk.castShadow =
        true;


    scene.add(trunk);


    const crown =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.7,
                10,
                10
            ),

            new THREE.MeshStandardMaterial({

                color:0x22652f

            })

        );


    crown.position.set(

        x,
        3.4,
        z

    );


    crown.castShadow =
        true;


    scene.add(crown);

}


/* =====================================================
   MOUNTAINS
===================================================== */

function createMountains(){


    for(
        let i=0;
        i<14;
        i++
    ){

        const mountain =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    10 +
                    Math.random() * 10,

                    18 +
                    Math.random() * 12,

                    4

                ),

                new THREE.MeshStandardMaterial({

                    color:0x668568,

                    roughness:1

                })

            );


        mountain.position.set(

            -120 +
            i * 18,

            8,

            -280

        );


        mountain.rotation.y =
            Math.random();


        scene.add(mountain);

    }

}


/* =====================================================
   LOAD GLB
===================================================== */

function loadHorse(){


    const loader =
        new GLTFLoader();


    loader.load(

        HORSE_FILE,


        function(gltf){

            console.log(
                "================================"
            );

            console.log(
                "HORSE MODEL LOADED"
            );

            console.log(
                "Animations:"
            );

            gltf.animations.forEach(
                animation => {

                    console.log(
                        animation.name
                    );

                }
            );


            progress.style.width =
                "100%";


            loadingPercent.textContent =
                "100%";


            createHorses(
                gltf
            );


            setTimeout(

                function(){

                    loading.classList.add(
                        "hide"
                    );


                    startCountdown();

                },

                600

            );

        },


        function(xhr){

            if(xhr.total){

                const percent =
                    (
                        xhr.loaded /
                        xhr.total
                    ) * 100;


                progress.style.width =
                    percent + "%";


                loadingPercent.textContent =
                    Math.round(
                        percent
                    ) + "%";

            }

        },


        function(error){

            console.error(
                "================================"
            );

            console.error(
                "GLB LOAD ERROR"
            );

            console.error(
                error
            );


            document.querySelector(
                ".loading-title"
            ).textContent =
                "GLB ERROR";


            document.querySelector(
                ".loading-subtitle"
            ).textContent =
                "File GLB tidak dapat dimuat";


            loadingPercent.textContent =
                "ERROR";

        }

    );

}


/* =====================================================
   CREATE 8 HORSES
===================================================== */

function createHorses(gltf){


    horses = [];


    /* =================================================
       CARI ANIMASI GALLOP
    ================================================= */

    let gallop =
        gltf.animations.find(

            animation =>

                animation.name
                    .toLowerCase()
                    .trim() ===
                "gallop"

        );


    /*
    Kalau nama animasi sedikit berbeda,
    cari yang mengandung "gallop".
    */

    if(!gallop){

        gallop =
            gltf.animations.find(

                animation =>

                    animation.name
                        .toLowerCase()
                        .includes(
                            "gallop"
                        )

            );

    }


    console.log(
        "GALL0P ANIMATION:",
        gallop
    );


    /* =================================================
       BUAT 8 KUDA
    ================================================= */

    for(
        let i=0;
        i<HORSE_COUNT;
        i++
    ){

        /*
        ================================================
        CLONE SKELETON
        ================================================
        */

        const horse =
            cloneSkeleton(
                gltf.scene
            );


        /*
        ================================================
        MASUKKAN KE SCENE
        ================================================
        */

        scene.add(
            horse
        );


        /*
        ================================================
        UKURAN AWAL
        ================================================
        */

        horse.scale.set(
            1,
            1,
            1
        );


        horse.updateMatrixWorld(
            true
        );


        /*
        ================================================
        HITUNG UKURAN MODEL
        ================================================
        */

        let box =
            new THREE.Box3();


        box.setFromObject(
            horse
        );


        const size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        console.log(
            "HORSE",
            i + 1,
            "SIZE",
            size
        );


        /*
        ================================================
        NORMALISASI TINGGI
        ================================================
        */

        const TARGET_HEIGHT =
            3.0;


        if(
            size.y > 0.001
        ){

            const scale =
                TARGET_HEIGHT /
                size.y;


            horse.scale.set(
                scale,
                scale,
                scale
            );

        }


        /*
        ================================================
        UPDATE WORLD MATRIX
        ================================================
        */

        horse.updateMatrixWorld(
            true
        );


        /*
        ================================================
        HITUNG ULANG BOUNDING BOX
        ================================================
        */

        box =
            new THREE.Box3();


        box.setFromObject(
            horse
        );


        /*
        ================================================
        LANE
        ================================================
        */

        const x =
            (
                i -
                3.5
            ) *
            LANE_SPACING;


        /*
        ================================================
        POSISI KAKI KE TANAH
        ================================================
        */

        const y =
            -box.min.y;


        horse.position.set(

            x,
            y,
            START_Z

        );


        /*
        ================================================
        ARAH KUDA
        ================================================
        */

        horse.rotation.y =
            Math.PI;


        /*
        ================================================
        SHADOW
        ================================================
        */

        horse.traverse(

            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow =
                        true;


                    object.receiveShadow =
                        true;


                    /*
                    Penting:
                    jangan sampai Three.js
                    melakukan culling
                    terhadap model.
                    */

                    object.frustumCulled =
                        false;


                    if(
                        object.material
                    ){

                        object.material.transparent =
                            false;


                        object.material.opacity =
                            1;

                    }

                }

            }

        );


        /*
        ================================================
        ANIMATION MIXER
        ================================================
        */

        const mixer =
            new THREE.AnimationMixer(
                horse
            );


        let action =
            null;


        if(gallop){

            action =
                mixer.clipAction(
                    gallop
                );


            action.setLoop(
                THREE.LoopRepeat,
                Infinity
            );


            action.setEffectiveWeight(
                1
            );


            action.setEffectiveTimeScale(
                1
            );

        }


        /*
        ================================================
        PLAYER DATA
        ================================================
        */

        const data =
            horseData[i];


        horses.push({

            id:i,

            player:data.player,

            model:horse,

            mixer:mixer,

            action:action,

            baseSpeed:data.speed,

            currentSpeed:data.speed,

            distance:0,

            finished:false,

            finishTime:null,

            variation:
                Math.random() *
                Math.PI *
                2

        });

    }


    console.log(
        "================================"
    );


    console.log(
        "TOTAL HORSES:",
        horses.length
    );


    console.log(
        "HORSES READY"
    );


    console.log(
        "================================"
    );


    updateLeaderboard();

}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown(){


    if(
        countdownRunning
    ){

        return;

    }


    countdownRunning =
        true;


    raceStarted =
        false;


    raceFinished =
        false;


    finishOrder = [];


    raceStatus.textContent =
        "GET READY";


    let number =
        3;


    countdown.classList.add(
        "show"
    );


    countdown.textContent =
        number;


    const timer =
        setInterval(

            function(){

                number--;


                if(
                    number > 0
                ){

                    countdown.textContent =
                        number;

                }
                else{

                    countdown.textContent =
                        "GO!";


                    raceStarted =
                        true;


                    countdownRunning =
                        false;


                    raceStatus.textContent =
                        "RACING";


                    startPanel.classList.add(
                        "hidden"
                    );


                    /*
                    MULAI ANIMASI
                    */

                    horses.forEach(

                        function(horse){

                            if(
                                horse.action
                            ){

                                horse.action
                                    .reset()
                                    .play();

                            }

                        }

                    );


                    setTimeout(

                        function(){

                            countdown.classList.remove(
                                "show"
                            );

                        },

                        700

                    );


                    clearInterval(
                        timer
                    );

                }

            },

            1000

        );

}


/* =====================================================
   UPDATE HORSES
===================================================== */

function updateHorses(
    delta,
    elapsed
){


    if(
        !raceStarted ||
        raceFinished
    ){

        return;

    }


    horses.forEach(

        function(horse){

            /*
            ============================================
            ANIMATION
            ============================================
            */

            if(
                horse.mixer
            ){

                horse.mixer.update(
                    delta
                );

            }


            if(
                horse.finished
            ){

                return;

            }


            /*
            ============================================
            SPEED VARIATION
            ============================================
            */

            const variation =
                Math.sin(

                    elapsed *
                    .7 +
                    horse.variation

                ) * .18;


            horse.currentSpeed =
                horse.baseSpeed +
                variation;


            /*
            ============================================
            GERAK
            ============================================
            */

            const movement =
                horse.currentSpeed *
                delta;


            horse.model.position.z -=
                movement;


            horse.distance +=
                movement;


            /*
            ============================================
            FINISH
            ============================================
            */

            if(
                horse.model.position.z <=
                FINISH_Z
            ){

                horse.finished =
                    true;


                horse.finishTime =
                    elapsed;


                finishOrder.push(
                    horse
                );


                if(
                    horse.action
                ){

                    horse.action.stop();

                }

            }

        }

    );


    updateLeaderboard();


    if(
        finishOrder.length ===
        HORSE_COUNT
    ){

        finishRace();

    }

}


/* =====================================================
   LEADERBOARD
===================================================== */

function updateLeaderboard(){


    if(
        horses.length === 0
    ){

        return;

    }


    const sorted =
        [...horses].sort(

            function(a,b){

                return (
                    a.model.position.z -
                    b.model.position.z
                );

            }

        );


    leaderRows.innerHTML =
        "";


    sorted.forEach(

        function(horse,index){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "lb-row";


            if(
                index === 0
            ){

                row.classList.add(
                    "leading"
                );

            }


            row.innerHTML = `

                <div class="lb-left">

                    <div class="lb-number">
                        ${index + 1}
                    </div>

                    <div class="lb-player">
                        ${horse.player}
                    </div>

                </div>

                <div class="lb-distance">
                    ${Math.round(
                        horse.distance
                    )}m
                </div>

            `;


            leaderRows.appendChild(
                row
            );

        }

    );

}


/* =====================================================
   FINISH RACE
===================================================== */

function finishRace(){


    raceFinished =
        true;


    raceStarted =
        false;


    raceStatus.textContent =
        "FINISH";


    finalList.innerHTML =
        "";


    finishOrder.forEach(

        function(horse,index){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "final-row";


            if(
                index === 0
            ){

                row.classList.add(
                    "first"
                );

            }


            row.innerHTML = `

                <span>
                    ${index + 1}.
                    ${horse.player}
                </span>

                <span>
                    ${
                        index === 0
                        ? "🏆"
                        : ""
                    }
                </span>

            `;


            finalList.appendChild(
                row
            );

        }

    );


    setTimeout(

        function(){

            finishPanel.classList.add(
                "show"
            );

        },

        1000

    );

}


/* =====================================================
   RESTART
===================================================== */

function restartRace(){


    finishPanel.classList.remove(
        "show"
    );


    horses.forEach(

        function(horse,index){

            const x =
                (
                    index -
                    3.5
                ) *
                LANE_SPACING;


            horse.model.position.set(

                x,

                horse.model.position.y,

                START_Z

            );


            horse.distance =
                0;


            horse.finished =
                false;


            horse.finishTime =
                null;


            horse.currentSpeed =
                horse.baseSpeed;


            if(
                horse.action
            ){

                horse.action.stop();

            }

        }

    );


    finishOrder = [];


    raceStarted =
        false;


    raceFinished =
        false;


    countdownRunning =
        false;


    raceStatus.textContent =
        "GET READY";


    startPanel.classList.remove(
        "hidden"
    );


    updateLeaderboard();


    setTimeout(

        function(){

            startCountdown();

        },

        400

    );

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){


    if(
        horses.length === 0
    ){

        return;

    }


    /*
    ================================================
    CARI POSISI ROMBONGAN
    ================================================
    */

    let averageX =
        0;


    let averageZ =
        0;


    horses.forEach(

        function(horse){

            averageX +=
                horse.model.position.x;


            averageZ +=
                horse.model.position.z;

        }

    );


    averageX /=
        horses.length;


    averageZ /=
        horses.length;


    /*
    ================================================
    CAMERA
    ================================================
    */

    const targetX =
        averageX;


    const targetY =
        13;


    const targetZ =
        averageZ + 30;


    camera.position.x +=
        (
            targetX -
            camera.position.x
        ) * .035;


    camera.position.y +=
        (
            targetY -
            camera.position.y
        ) * .035;


    camera.position.z +=
        (
            targetZ -
            camera.position.z
        ) * .045;


    camera.lookAt(

        averageX,

        1.5,

        averageZ - 18

    );

}


/* =====================================================
   RESIZE
===================================================== */

function onResize(){


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =====================================================
   ANIMATION LOOP
===================================================== */

function animate(){


    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            clock.getDelta(),

            .05

        );


    const elapsed =
        clock.elapsedTime;


    updateHorses(
        delta,
        elapsed
    );


    updateCamera();


    renderer.render(

        scene,

        camera

    );

}


/* =====================================================
   START
===================================================== */

init();


</script>
