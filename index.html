<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Horse Racing 3D — V14 FIX</title>

<!-- =========================================================
     THREE.JS IMPORTMAP
     ========================================================= -->
<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.180.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"
    }
}
</script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#9bb8a2;
}

body{
    position:relative;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* =========================================================
   LOADING SCREEN
   ========================================================= */

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle at center,
            #53695b 0%,
            #29352e 55%,
            #151b18 100%
        );

    color:white;
}

.loading-box{
    width:min(440px,90vw);
    text-align:center;
}

.loading-title{
    font-size:25px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:10px;
}

.loading-sub{
    font-size:13px;
    opacity:.65;
    margin-bottom:25px;
}

.progress-wrap{
    width:100%;
    height:10px;
    background:rgba(255,255,255,.12);
    border-radius:20px;
    overflow:hidden;
}

#progressBar{
    width:0%;
    height:100%;
    border-radius:20px;
    background:linear-gradient(
        90deg,
        #ffffff,
        #8edb9c
    );
    transition:width .25s ease;
}

#loadingText{
    margin-top:13px;
    font-size:13px;
    opacity:.75;
}

/* =========================================================
   TOP TITLE
   ========================================================= */

#titlePanel{
    position:fixed;
    z-index:20;

    top:20px;
    left:50%;
    transform:translateX(-50%);

    width:320px;
    padding:16px 25px;

    text-align:center;

    color:white;

    background:rgba(38,51,44,.72);
    border:1px solid rgba(255,255,255,.08);

    border-radius:18px;

    backdrop-filter:blur(10px);

    box-shadow:
        0 12px 35px rgba(0,0,0,.18);
}

#titlePanel h1{
    font-size:20px;
    letter-spacing:4px;
    font-weight:900;
}

#titlePanel p{
    margin-top:5px;
    font-size:11px;
    opacity:.65;
    letter-spacing:1px;
}

/* =========================================================
   LIVE POSITION
   ========================================================= */

#positionPanel{
    position:fixed;
    z-index:20;

    top:20px;
    right:18px;

    width:225px;

    padding:14px;

    color:white;

    background:rgba(40,47,41,.72);

    border:1px solid rgba(255,255,255,.08);

    border-radius:17px;

    backdrop-filter:blur(12px);

    box-shadow:
        0 12px 35px rgba(0,0,0,.18);
}

.position-title{
    display:flex;
    align-items:center;
    gap:7px;

    font-size:14px;
    font-weight:900;
    letter-spacing:1px;

    margin-bottom:9px;
}

#ranking{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.rank-row{
    display:grid;

    grid-template-columns:
        27px
        1fr
        48px;

    align-items:center;

    min-height:27px;

    padding:4px 7px;

    border-radius:6px;

    font-size:11px;

    background:rgba(255,255,255,.055);
}

.rank-row:first-child{
    background:rgba(255,255,255,.13);
}

.rank-number{
    font-weight:900;
    opacity:.85;
}

.rank-name{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.rank-distance{
    text-align:right;
    opacity:.65;
}

/* =========================================================
   STATUS
   ========================================================= */

#raceStatus{
    position:fixed;
    z-index:20;

    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    padding:9px 18px;

    color:white;

    background:rgba(35,43,37,.65);

    border-radius:30px;

    font-size:11px;
    letter-spacing:1px;

    backdrop-filter:blur(8px);
}

/* =========================================================
   WINNER
   ========================================================= */

#winnerPanel{
    position:fixed;
    z-index:50;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(12,18,14,.42);

    backdrop-filter:blur(7px);
}

.winner-box{
    width:min(420px,90vw);

    padding:35px;

    text-align:center;

    color:white;

    background:
        linear-gradient(
            145deg,
            rgba(59,73,62,.95),
            rgba(25,32,27,.95)
        );

    border:1px solid rgba(255,255,255,.12);

    border-radius:25px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.35);
}

.winner-trophy{
    font-size:48px;
    margin-bottom:12px;
}

.winner-label{
    font-size:11px;
    letter-spacing:3px;
    opacity:.6;
}

#winnerName{
    margin-top:8px;

    font-size:31px;
    font-weight:900;
}

#restartBtn{
    margin-top:25px;

    padding:12px 25px;

    border:0;
    border-radius:30px;

    color:#263029;
    background:white;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

#restartBtn:hover{
    transform:scale(1.05);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

    #titlePanel{
        top:10px;
        width:250px;
        padding:12px;
    }

    #titlePanel h1{
        font-size:15px;
        letter-spacing:3px;
    }

    #positionPanel{
        top:10px;
        right:8px;
        width:190px;
    }

    .rank-row{
        font-size:10px;
        min-height:25px;
    }

    #raceStatus{
        bottom:10px;
    }

}

</style>
</head>

<body>

<div id="loadingScreen">

    <div class="loading-box">

        <div class="loading-title">
            🐎 HORSE RACING
        </div>

        <div class="loading-sub">
            MENYIAPKAN ARENA

        <div class="progress-wrap">
            <div id="progressBar"></div>
        </div>

        <div id="loadingText">

        </div>

    </div>

</div>


<!-- =========================================================

     ========================================================= -->

<div id="titlePanel">

    <h1>🏇 HORSE RACING</h1>

    <p>RACING</p>

</div>


<!-- =========================================================
     LIVE POSITION
     ========================================================= -->

<div id="positionPanel">

</div>

        <div class="winner-trophy">

        <div class="winner-label">

        </div>

        <button id="restartBtn">

        </button>

</div>


<!-- =========================================================
     THREE.JS
     ========================================================= -->

<script type="module">

import * as THREE from "three";

import { GLTFLoader }
from "three/addons/loaders/GLTFLoader.js";

import * as SkeletonUtils
from "three/addons/utils/SkeletonUtils.js";


/* =========================================================
   CONFIG
   ========================================================= */

const HORSE_FILE =
    "quaternius_cc0-white-horse-1081(1).glb";


/*
    5 POHON
*/

const TREE_FILES = [

    "assets/trees/quaternius_cc0-common-tree-846.glb",

    "assets/trees/quaternius_cc0-common-tree-838.glb",

    "assets/trees/quaternius_cc0-common-tree-837.glb",

    "assets/trees/quaternius_cc0-common-tree-839.glb",

    "assets/trees/quaternius_cc0-common-tree-835.glb"

];


/*
    4 BATU
*/

const ROCK_FILES = [

    "assets/trees/quaternius_cc0-mossy-rock-1304.glb",

    "assets/trees/quaternius_cc0-mossy-rock-1303.glb",

    "assets/trees/quaternius_cc0-mossy-rock-1309.glb",

    "assets/trees/quaternius_cc0-mossy-rock-1308.glb"

];


/* =========================================================
   HORSE DATA
   ========================================================= */

const HORSE_NAMES = [

    "Shadow",
    "Golden Flash",
    "Blaze",
    "Lightning",
    "Thunder",
    "Black Storm",
    "Wild Runner",
    "Red Fury"

];


/*
   Warna berbeda untuk setiap kuda.
*/

const HORSE_COLORS = [

    0x171717,
    0xc99725,
    0x9c3f1d,
    0x727272,
    0x6f4a28,
    0x111111,
    0x47352c,
    0x8f2f17

];


/* =========================================================
   RACE SETTINGS
   ========================================================= */

const TRACK_LENGTH = 1000;

const START_Z = 430;

const FINISH_Z = -500;

const TRACK_WIDTH = 34;

const LANE_WIDTH = 4;


/* =========================================================
   THREE VARIABLES
   ========================================================= */

let scene;

let camera;

let renderer;

let clock;

let loader;


/* =========================================================
   WORLD GROUPS
   ========================================================= */

let arenaGroup;

let environmentGroup;

let horsesGroup;


/* =========================================================
   HORSE ARRAY
   ========================================================= */

const horses = [];


/* =========================================================
   TREE / ROCK CACHE
   ========================================================= */

const treeTemplates = [];

const rockTemplates = [];


/* =========================================================
   RACE STATE
   ========================================================= */

let raceStarted = false;

let raceFinished = false;

let winner = null;

let lastTime = 0;


/* =========================================================
   DOM
   ========================================================= */

const loadingScreen =
    document.getElementById("loadingScreen");

const progressBar =
    document.getElementById("progressBar");

const loadingText =
    document.getElementById("loadingText");

const ranking =
    document.getElementById("ranking");

const raceStatus =
    document.getElementById("raceStatus");

const winnerPanel =
    document.getElementById("winnerPanel");

const winnerName =
    document.getElementById("winnerName");

const restartBtn =
    document.getElementById("restartBtn");


/* =========================================================
   LOADING COUNTER
   ========================================================= */

const TOTAL_ASSETS =
    1 +
    TREE_FILES.length +
    ROCK_FILES.length;

let loadedAssets = 0;


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress(text){

    loadedAssets++;

    const percent =
        Math.min(
            100,
            Math.round(
                loadedAssets /
                TOTAL_ASSETS *
                100
            )
        );

    progressBar.style.width =
        percent + "%";

    loadingText.textContent =
        text +
        " " +
        percent +
        "%";

}


/* =========================================================
   SAFE GLTF LOADER
   ========================================================= */

function loadGLTF(url){

    return new Promise((resolve,reject)=>{

        loader.load(

            url,

            gltf => {

                resolve(gltf);

            },

            undefined,

            error => {

                console.warn(
                    "Gagal memuat:",
                    url,
                    error
                );

                reject(error);

            }

        );

    });

}


/* =========================================================
   INIT
   ========================================================= */

async function init(){

    try{

        setupRenderer();

        setupScene();

        setupLights();

        createArena();

        createFinishLine();

        createStartLine();

        await loadAssets();

        createHorses();

        createEnvironment();

        createRanking();

        loadingText.textContent =
            "Arena siap!";

        progressBar.style.width =
            "100%";

        setTimeout(()=>{

            loadingScreen.style.display =
                "none";

            startRace();

        },700);

        animate();

    }
    catch(error){

        console.error(error);

        loadingText.textContent =
            "Terjadi kesalahan. Cek Console.";

    }

}


/* =========================================================
   RENDERER
   ========================================================= */

function setupRenderer(){

    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.7
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    document.body.appendChild(
        renderer.domElement
    );

}


/* =========================================================
   SCENE
   ========================================================= */

function setupScene(){

    scene =
        new THREE.Scene();


    /*
       TIDAK ADA GUNUNG.
       Hanya warna langit + fog.
    */

    scene.background =
        new THREE.Color(
            0x9fc6da
        );


    scene.fog =
        new THREE.Fog(
            0x9fc6da,
            500,
            1300
        );


    camera =
        new THREE.PerspectiveCamera(

            52,

            window.innerWidth /
            window.innerHeight,

            0.1,

            2500

        );


    camera.position.set(
        0,
        18,
        455
    );


    camera.lookAt(
        0,
        2,
        390
    );


    clock =
        new THREE.Clock();


    loader =
        new GLTFLoader();


    arenaGroup =
        new THREE.Group();

    environmentGroup =
        new THREE.Group();

    horsesGroup =
        new THREE.Group();


    scene.add(
        arenaGroup
    );

    scene.add(
        environmentGroup
    );

    scene.add(
        horsesGroup
    );

}


/* =========================================================
   LIGHTING
   ========================================================= */

function setupLights(){

    const hemi =
        new THREE.HemisphereLight(

            0xd9f4ff,

            0x56704e,

            2.1

        );

    scene.add(
        hemi
    );


    const sun =
        new THREE.DirectionalLight(

            0xffffff,

            3.0

        );


    sun.position.set(
        -120,
        180,
        120
    );


    sun.castShadow = true;


    sun.shadow.mapSize.width =
        2048;

    sun.shadow.mapSize.height =
        2048;


    sun.shadow.camera.left =
        -180;

    sun.shadow.camera.right =
        180;

    sun.shadow.camera.top =
        220;

    sun.shadow.camera.bottom =
        -220;


    scene.add(
        sun
    );

}


/* =========================================================
   ARENA
   ========================================================= */

function createArena(){

    /*
       AREA RUMPUT
    */

    const grassGeo =
        new THREE.PlaneGeometry(
            220,
            1250
        );


    const grassMat =
        new THREE.MeshStandardMaterial({

            color:0x86bd78,

            roughness:.95

        });


    const grass =
        new THREE.Mesh(
            grassGeo,
            grassMat
        );


    grass.rotation.x =
        -Math.PI / 2;


    grass.position.y =
        -0.15;


    grass.position.z =
        -20;


    grass.receiveShadow =
        true;


    arenaGroup.add(
        grass
    );


    /*
       TRACK
    */

    const trackGeo =
        new THREE.PlaneGeometry(
            TRACK_WIDTH,
            TRACK_LENGTH
        );


    const trackMat =
        new THREE.MeshStandardMaterial({

            color:0xc89b78,

            roughness:1

        });


    const track =
        new THREE.Mesh(
            trackGeo,
            trackMat
        );


    track.rotation.x =
        -Math.PI / 2;


    track.position.y =
        0;


    track.position.z =
        -35;


    track.receiveShadow =
        true;


    arenaGroup.add(
        track
    );


    /*
       LANE LINES
    */

    for(
        let i = 1;
        i < 8;
        i++
    ){

        const x =
            -TRACK_WIDTH / 2 +
            i * LANE_WIDTH;


        const lineGeo =
            new THREE.PlaneGeometry(
                .06,
                TRACK_LENGTH
            );


        const lineMat =
            new THREE.MeshBasicMaterial({

                color:0xf2d8c4,

                transparent:true,

                opacity:.35

            });


        const line =
            new THREE.Mesh(
                lineGeo,
                lineMat
            );


        line.rotation.x =
            -Math.PI / 2;


        line.position.set(
            x,
            .018,
            -35
        );


        arenaGroup.add(
            line
        );

    }


    createRail(
        -TRACK_WIDTH / 2 - 1.5
    );

    createRail(
        TRACK_WIDTH / 2 + 1.5
    );

}


/* =========================================================
   RAIL
   ========================================================= */

function createRail(x){

    const railLength =
        TRACK_LENGTH;


    const horizontalGeo =
        new THREE.BoxGeometry(
            .12,
            .12,
            railLength
        );


    const railMat =
        new THREE.MeshStandardMaterial({

            color:0xf0f0f0,

            roughness:.7

        });


    for(
        const y of [
            1.05,
            0.55
        ]
    ){

        const rail =
            new THREE.Mesh(
                horizontalGeo,
                railMat
            );


        rail.position.set(
            x,
            y,
            -35
        );


        rail.castShadow = true;

        arenaGroup.add(
            rail
        );

    }


    /*
       TIANG PAGAR
    */

    for(
        let z = -520;
        z <= 450;
        z += 10
    ){

        const postGeo =
            new THREE.BoxGeometry(
                .12,
                1.35,
                .12
            );


        const post =
            new THREE.Mesh(
                postGeo,
                railMat
            );


        post.position.set(
            x,
            .55,
            z
        );


        post.castShadow =
            true;


        arenaGroup.add(
            post
        );

    }

}


/* =========================================================
   START LINE
   ========================================================= */

function createStartLine(){

    const group =
        new THREE.Group();


    const squareSize = 2;


    for(
        let i = 0;
        i < 17;
        i++
    ){

        const geo =
            new THREE.BoxGeometry(
                squareSize,
                .03,
                squareSize
            );


        const mat =
            new THREE.MeshStandardMaterial({

                color:
                    i % 2 === 0
                        ? 0xffffff
                        : 0x222222

            });


        const mesh =
            new THREE.Mesh(
                geo,
                mat
            );


        mesh.position.set(

            -16 +
            i * squareSize,

            .025,

            START_Z - 2

        );


        group.add(
            mesh
        );

    }


    arenaGroup.add(
        group
    );

}


/* =========================================================
   FINISH LINE
   ========================================================= */

function createFinishLine(){

    const group =
        new THREE.Group();


    for(
        let x = -16;
        x < 18;
        x += 2
    ){

        for(
            let z = FINISH_Z - 1;
            z <= FINISH_Z + 1;
            z += 2
        ){

            const geo =
                new THREE.BoxGeometry(
                    2,
                    .04,
                    2
                );


            const mat =
                new THREE.MeshStandardMaterial({

                    color:
                        (
                            Math.round(
                                (x + 16) / 2
                            ) +
                            Math.round(
                                (z - FINISH_Z + 1) / 2
                            )
                        ) % 2 === 0
                            ? 0xffffff
                            : 0x222222

                });


            const square =
                new THREE.Mesh(
                    geo,
                    mat
                );


            square.position.set(
                x,
                .04,
                z
            );


            group.add(
                square
            );

        }

    }


    /*
       FINISH ARCH
    */

    const pillarMat =
        new THREE.MeshStandardMaterial({

            color:0xffffff

        });


    const pillarGeo =
        new THREE.BoxGeometry(
            1.1,
            9,
            1.1
        );


    const left =
        new THREE.Mesh(
            pillarGeo,
            pillarMat
        );


    left.position.set(
        -18,
        4.5,
        FINISH_Z
    );


    const right =
        left.clone();


    right.position.x =
        18;


    group.add(
        left,
        right
    );


    const topGeo =
        new THREE.BoxGeometry(
            37,
            1.1,
            1.1
        );


    const top =
        new THREE.Mesh(
            topGeo,
            pillarMat
        );


    top.position.set(
        0,
        8.5,
        FINISH_Z
    );


    group.add(
        top
    );


    /*
       FINISH TEXT
    */

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        1024;

    canvas.height =
        256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        1024,
        256
    );


    ctx.fillStyle =
        "#222222";


    ctx.font =
        "bold 130px Arial";


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "FINISH",
        512,
        128
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    const textMat =
        new THREE.MeshBasicMaterial({

            map:texture,

            transparent:true

        });


    const textGeo =
        new THREE.PlaneGeometry(
            12,
            3
        );


    const text =
        new THREE.Mesh(
            textGeo,
            textMat
        );


    text.position.set(
        0,
        5.8,
        FINISH_Z - .65
    );


    text.rotation.y =
        Math.PI;


    group.add(
        text
    );


    arenaGroup.add(
        group
    );

}


/* =========================================================
   LOAD ALL GLB
   ========================================================= */

async function loadAssets(){

    /*
       HORSE
    */

    try{

        const horseGLTF =
            await loadGLTF(
                HORSE_FILE
            );

        window.horseSource =
            horseGLTF;

        updateProgress(
            "Kuda berhasil dimuat"
        );

    }
    catch(error){

        console.error(
            "HORSE ERROR:",
            error
        );

        /*
           Race tetap jalan dengan
           fallback horse primitive.
        */

        window.horseSource =
            null;

        updateProgress(
            "Kuda fallback"
        );

    }


    /*
       TREES
    */

    for(
        let i = 0;
        i < TREE_FILES.length;
        i++
    ){

        try{

            const gltf =
                await loadGLTF(
                    TREE_FILES[i]
                );

            treeTemplates.push(
                gltf.scene
            );

            updateProgress(
                "Pohon " +
                (i + 1) +
                "/5"
            );

        }
        catch(error){

            console.warn(
                "Tree gagal:",
                TREE_FILES[i]
            );

            updateProgress(
                "Pohon " +
                (i + 1) +
                "/5 dilewati"
            );

        }

    }


    /*
       ROCKS
    */

    for(
        let i = 0;
        i < ROCK_FILES.length;
        i++
    ){

        try{

            const gltf =
                await loadGLTF(
                    ROCK_FILES[i]
                );

            rockTemplates.push(
                gltf.scene
            );

            updateProgress(
                "Batu " +
                (i + 1) +
                "/4"
            );

        }
        catch(error){

            console.warn(
                "Rock gagal:",
                ROCK_FILES[i]
            );

            updateProgress(
                "Batu " +
                (i + 1) +
                "/4 dilewati"
            );

        }

    }

}


/* =========================================================
   CREATE HORSES
   ========================================================= */

function createHorses(){

    horses.length = 0;


    for(
        let i = 0;
        i < HORSE_NAMES.length;
        i++
    ){

        let model;


        if(
            window.horseSource
        ){

            model =
                SkeletonUtils.clone(
                    window.horseSource.scene
                );

        }
        else{

            model =
                createFallbackHorse();

        }


        /*
           SCALE
        */

        model.scale.set(
            1.35,
            1.35,
            1.35
        );


        /*
           HORSE POSITION
        */

        const lane =
            i - 3.5;


        model.position.set(

            lane * LANE_WIDTH,

            0.05,

            START_Z + i * 1.8

        );


        /*
           WARNA KUDA
        */

        applyHorseColor(
            model,
            HORSE_COLORS[i]
        );


        /*
           ROTASI
           GLB diasumsikan menghadap
           arah depan.
        */

        model.rotation.y =
            0;


        model.traverse(
            child => {

                if(
                    child.isMesh
                ){

                    child.castShadow =
                        true;

                    child.receiveShadow =
                        true;

                }

            }
        );


        horsesGroup.add(
            model
        );


        const horse = {

            id:i,

            name:
                HORSE_NAMES[i],

            model:model,

            lane:lane,

            z:
                START_Z +
                i * 1.8,

            distance:0,

            speed:0,

            baseSpeed:
                11 +
                Math.random() * 5,

            finished:false,

            finishTime:null,

            mixer:null,

            actions:[],

            phase:
                Math.random() *
                Math.PI * 2

        };


        /*
           ANIMATION
        */

        if(
            window.horseSource &&
            window.horseSource.animations &&
            window.horseSource.animations.length
        ){

            horse.mixer =
                new THREE.AnimationMixer(
                    model
                );


            const clips =
                window.horseSource
                    .animations;


            let gallop =
                clips.find(
                    clip =>
                        /gallop|run|walk/i
                            .test(
                                clip.name
                            )
                );


            if(!gallop){

                gallop =
                    clips[0];

            }


            if(gallop){

                const action =
                    horse.mixer.clipAction(
                        gallop
                    );


                action.play();


                horse.actions.push(
                    action
                );

            }

        }


        horses.push(
            horse
        );

    }

}


/* =========================================================
   HORSE COLOR
   ========================================================= */

function applyHorseColor(
    object,
    color
){

    object.traverse(
        child => {

            if(
                !child.isMesh ||
                !child.material
            ){
                return;
            }


            if(
                Array.isArray(
                    child.material
                )
            ){

                child.material =
                    child.material.map(
                        mat =>
                            prepareHorseMaterial(
                                mat,
                                color
                            )
                    );

            }
            else{

                child.material =
                    prepareHorseMaterial(
                        child.material,
                        color
                    );

            }

        }
    );

}


function prepareHorseMaterial(
    original,
    color
){

    const material =
        original.clone();


    /*
       Jika material punya texture,
       tetap pertahankan texture.

       Warna hanya sedikit diberi
       tint supaya bentuk/tekstur
       asli tetap terlihat.
    */

    if(
        material.color
    ){

        material.color.multiply(
            new THREE.Color(color)
        );

    }


    return material;

}


/* =========================================================
   FALLBACK HORSE
   ========================================================= */

function createFallbackHorse(){

    const group =
        new THREE.Group();


    const bodyMat =
        new THREE.MeshStandardMaterial({

            color:0x222222,

            roughness:.8

        });


    const body =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.2,
                12,
                8
            ),

            bodyMat

        );


    body.scale.set(
        1.6,
        .75,
        .7
    );


    body.position.y =
        1.2;


    group.add(
        body
    );


    const neck =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .45,
                .6,
                1.6,
                10
            ),

            bodyMat

        );


    neck.position.set(
        1.15,
        1.8,
        0
    );


    neck.rotation.z =
        -0.5;


    group.add(
        neck
    );


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .55,
                10,
                8
            ),

            bodyMat

        );


    head.position.set(
        1.75,
        2.25,
        0
    );


    head.scale.set(
        1.2,
        .8,
        .8
    );


    group.add(
        head
    );


    for(
        let i = 0;
        i < 4;
        i++
    ){

        const leg =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .16,
                    .13,
                    1.5,
                    8
                ),

                bodyMat

            );


        leg.position.set(

            i < 2
                ? .7
                : -.7,

            .55,

            i % 2 === 0
                ? .42
                : -.42

        );


        group.add(
            leg
        );

    }


    group.traverse(
        child => {

            if(
                child.isMesh
            ){

                child.castShadow =
                    true;

            }

        }
    );


    return group;

}


/* =========================================================
   CREATE ENVIRONMENT
   ========================================================= */

function createEnvironment(){

    /*
       PENTING:

       Semua environment hanya berada
       DI SAMPING arena.

       Tidak ada gunung.
       Tidak ada objek besar di depan kamera.
    */


    createTrees();

    createRocks();

}


/* =========================================================
   TREES
   ========================================================= */

function createTrees(){

    if(
        treeTemplates.length === 0
    ){

        console.warn(
            "Tidak ada tree GLB yang berhasil dimuat."
        );

        return;

    }


    /*
       Sisi kiri dan kanan.

       Pohon tidak pernah masuk
       ke track.
    */

    const sides = [
        -1,
        1
    ];


    for(
        let sideIndex = 0;
        sideIndex < sides.length;
        sideIndex++
    ){

        const side =
            sides[sideIndex];


        for(
            let i = 0;
            i < 28;
            i++
        ){

            const template =
                treeTemplates[
                    Math.floor(
                        Math.random() *
                        treeTemplates.length
                    )
                ];


            const tree =
                SkeletonUtils.clone(
                    template
                );


            /*
               Posisi X:

               track ±17
               environment mulai
               sekitar ±25
            */

            const x =
                side *
                (
                    27 +
                    Math.random() *
                    42
                );


            const z =
                FINISH_Z +
                Math.random() *
                (
                    START_Z -
                    FINISH_Z
                );


            const scale =
                .7 +
                Math.random() *
                1.0;


            tree.position.set(
                x,
                0,
                z
            );


            tree.scale.setScalar(
                scale
            );


            tree.rotation.y =
                Math.random() *
                Math.PI *
                2;


            prepareEnvironmentObject(
                tree
            );


            environmentGroup.add(
                tree
            );

        }

    }

}


/* =========================================================
   ROCKS
   ========================================================= */

function createRocks(){

    if(
        rockTemplates.length === 0
    ){

        console.warn(
            "Tidak ada rock GLB yang berhasil dimuat."
        );

        return;

    }


    const sides = [
        -1,
        1
    ];


    for(
        let sideIndex = 0;
        sideIndex < sides.length;
        sideIndex++
    ){

        const side =
            sides[sideIndex];


        for(
            let i = 0;
            i < 18;
            i++
        ){

            const template =
                rockTemplates[
                    Math.floor(
                        Math.random() *
                        rockTemplates.length
                    )
                ];


            const rock =
                SkeletonUtils.clone(
                    template
                );


            const x =
                side *
                (
                    22 +
                    Math.random() *
                    48
                );


            const z =
                FINISH_Z +
                Math.random() *
                (
                    START_Z -
                    FINISH_Z
                );


            const scale =
                .35 +
                Math.random() *
                .65;


            rock.position.set(
                x,
                0,
                z
            );


            rock.scale.setScalar(
                scale
            );


            rock.rotation.y =
                Math.random() *
                Math.PI *
                2;


            prepareEnvironmentObject(
                rock
            );


            environmentGroup.add(
                rock
            );

        }

    }

}


/* =========================================================
   ENVIRONMENT MATERIAL
   ========================================================= */

function prepareEnvironmentObject(
    object
){

    object.traverse(
        child => {

            if(
                child.isMesh
            ){

                child.castShadow =
                    true;

                child.receiveShadow =
                    true;

            }

        }
    );

}


/* =========================================================
   RANKING
   ========================================================= */

function createRanking(){

    ranking.innerHTML = "";


    for(
        let i = 0;
        i < horses.length;
        i++
    ){

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "rank-row";


        row.innerHTML = `

            <div class="rank-number">
                ${i + 1}
            </div>

            <div class="rank-name">
                ${horses[i].name}
            </div>

            <div class="rank-distance">
                0m
            </div>

        `;


        ranking.appendChild(
            row
        );

    }

}


/* =========================================================
   UPDATE RANKING
   ========================================================= */

function updateRanking(){

    const sorted =
        [...horses].sort(
            (a,b) =>
                b.distance -
                a.distance
        );


    const rows =
        ranking.children;


    sorted.forEach(
        (horse,index)=>{

            const row =
                rows[index];


            if(!row){
                return;
            }


            row.querySelector(
                ".rank-number"
            ).textContent =
                index + 1;


            row.querySelector(
                ".rank-name"
            ).textContent =
                horse.name;


            row.querySelector(
                ".rank-distance"
            ).textContent =
                Math.max(
                    0,
                    Math.round(
                        horse.distance
                    )
                ) +
                "m";

        }
    );

}


/* =========================================================
   START RACE
   ========================================================= */

function startRace(){

    raceStarted =
        true;

    raceFinished =
        false;

    winner =
        null;

    raceStatus.textContent =
        "🏁 RACE STARTED";


    /*
       Sedikit variasi kecepatan.
       Tetap sistem hoki/random.
    */

    horses.forEach(
        horse => {

            horse.finished =
                false;

            horse.finishTime =
                null;

            horse.distance =
                0;

            horse.z =
                START_Z +
                horse.id *
                1.8;


            horse.model.position.z =
                horse.z;


            horse.baseSpeed =
                10.8 +
                Math.random() *
                6.5;

        }
    );

}


/* =========================================================
   UPDATE HORSES
   ========================================================= */

function updateRace(delta){

    if(
        !raceStarted ||
        raceFinished
    ){

        return;

    }


    for(
        const horse of horses
    ){

        if(
            horse.finished
        ){

            continue;

        }


        /*
           RANDOM HOKI.

           Speed dapat naik/turun
           secara natural.
        */

        const luck =
            Math.sin(
                performance.now() *
                .0007 +
                horse.id *
                3.17
            );


        const randomBoost =
            (
                Math.random() -
                .48
            ) *
            4.2;


        const targetSpeed =
            horse.baseSpeed +
            luck *
            1.2 +
            randomBoost;


        horse.speed =
            THREE.MathUtils.lerp(

                horse.speed,

                Math.max(
                    7,
                    targetSpeed
                ),

                .08

            );


        /*
           Gerakan.
        */

        const movement =
            horse.speed *
            delta;


        horse.z -=
            movement;


        horse.distance =
            START_Z -
            horse.z;


        horse.model.position.z =
            horse.z;


        /*
           sedikit animasi bobbing
           kalau GLB tidak punya animasi.
        */

        horse.phase +=
            delta *
            horse.speed *
            .7;


        if(
            !horse.mixer
        ){

            horse.model.position.y =
                .05 +
                Math.abs(
                    Math.sin(
                        horse.phase
                    )
                ) *
                .045;

        }


        /*
           FINISH
        */

        if(
            horse.z <= FINISH_Z
        ){

            horse.z =
                FINISH_Z;


            horse.distance =
                TRACK_LENGTH;


            horse.finished =
                true;


            horse.finishTime =
                performance.now();


            if(
                !winner
            ){

                winner =
                    horse;

                finishRace(
                    horse
                );

            }

        }

    }


    updateRanking();

}


/* =========================================================
   FINISH RACE
   ========================================================= */

function finishRace(
    horse
){

    raceFinished =
        true;

    raceStarted =
        false;


    raceStatus.textContent =
        "🏆 " +
        horse.name +
        " MENANG!";


    winnerName.textContent =
        horse.name;


    setTimeout(
        ()=>{

            winnerPanel.style.display =
                "flex";

        },
        1000
    );

}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(){

    if(
        horses.length === 0
    ){

        return;

    }


    /*
       Cari kuda paling depan.
    */

    let leader =
        horses[0];


    for(
        const horse of horses
    ){

        if(
            horse.distance >
            leader.distance
        ){

            leader =
                horse;

        }

    }


    const targetZ =
        leader.z +
        34;


    /*
       Camera mengikuti dari belakang.
    */

    const desiredX =
        leader.model.position.x *
        .35;


    camera.position.x =
        THREE.MathUtils.lerp(

            camera.position.x,

            desiredX,

            .035

        );


    camera.position.y =
        THREE.MathUtils.lerp(

            camera.position.y,

            16,

            .035

        );


    camera.position.z =
        THREE.MathUtils.lerp(

            camera.position.z,

            targetZ,

            .055

        );


    const lookZ =
        leader.z -
        22;


    camera.lookAt(
        leader.model.position.x *
            .2,
        2.2,
        lookZ
    );

}


/* =========================================================
   ANIMATION
   ========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    /*
       MIXER
    */

    for(
        const horse of horses
    ){

        if(
            horse.mixer
        ){

            horse.mixer.update(
                delta
            );

        }

    }


    updateRace(
        delta
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   RESTART
   ========================================================= */

restartBtn.addEventListener(
    "click",
    ()=>{

        winnerPanel.style.display =
            "none";


        /*
           Reset semua kuda.
        */

        horses.forEach(
            horse => {

                horse.finished =
                    false;

                horse.finishTime =
                    null;

                horse.distance =
                    0;

                horse.speed =
                    0;

                horse.z =
                    START_Z +
                    horse.id *
                    1.8;


                horse.model.position.set(

                    horse.lane *
                    LANE_WIDTH,

                    .05,

                    horse.z

                );

            }
        );


        /*
           Reset kamera.
        */

        camera.position.set(
            0,
            18,
            455
        );


        camera.lookAt(
            0,
            2,
            390
        );


        winner =
            null;


        raceFinished =
            false;


        raceStarted =
            true;


        raceStatus.textContent =
            "🏁 RACE STARTED";


        horses.forEach(
            horse => {

                horse.baseSpeed =
                    10.8 +
                    Math.random() *
                    6.5;

            }
        );

    }
);


/* =========================================================
   START APPLICATION
   ========================================================= */

init();

</script>
