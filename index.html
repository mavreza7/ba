<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horse Racing 3D — V9</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#071009;
}

canvas{
    display:block;
}

/* =====================================================
   LOADING
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:
        radial-gradient(circle at center,#294b34 0%,#071009 75%);
    transition:.5s;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loading-title{
    font-size:clamp(32px,6vw,64px);
    font-weight:900;
    letter-spacing:6px;
}

.loading-subtitle{
    margin-top:12px;
    color:rgba(255,255,255,.65);
}

.loading-bar{
    width:min(350px,75vw);
    height:7px;
    margin-top:25px;
    overflow:hidden;
    border-radius:20px;
    background:rgba(255,255,255,.12);
}

#loading-progress{
    width:0%;
    height:100%;
    background:white;
    transition:.2s;
}

.loading-percent{
    margin-top:10px;
    font-size:12px;
    color:rgba(255,255,255,.5);
}

/* =====================================================
   MENU
===================================================== */

#menu{
    position:fixed;
    inset:0;
    z-index:900;
    overflow-y:auto;
    padding:30px 15px;
    color:white;
    background:
        radial-gradient(circle at top,#315f3b,#071009 70%);
}

.menu-container{
    width:min(1050px,100%);
    margin:auto;
}

.menu-title{
    text-align:center;
    font-size:clamp(30px,6vw,58px);
    font-weight:1000;
    letter-spacing:5px;
}

.menu-subtitle{
    margin-top:8px;
    text-align:center;
    color:rgba(255,255,255,.6);
}

.horse-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:30px;
}

.horse-card{
    padding:15px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(12px);
}

.horse-card.selected{
    border-color:white;
    box-shadow:0 0 0 2px rgba(255,255,255,.15);
}

.horse-preview{
    height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
}

.horse-number{
    font-size:10px;
    color:rgba(255,255,255,.45);
}

.horse-card label{
    display:block;
    margin-top:8px;
    font-size:10px;
    color:rgba(255,255,255,.5);
}

.horse-card input,
.horse-card select{
    width:100%;
    margin-top:5px;
    padding:9px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    outline:none;
    background:rgba(255,255,255,.08);
    color:white;
}

.horse-card option{
    color:black;
}

.color-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:7px;
}

.color-row input[type=color]{
    width:45px;
    height:32px;
    padding:2px;
    margin:0;
}

.color-value{
    font-size:10px;
    color:rgba(255,255,255,.5);
}

.menu-settings{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:25px;
}

.toggle-box{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:rgba(0,0,0,.3);
    font-size:12px;
}

#testModePanel{
    display:none;
    margin-top:15px;
    padding:15px;
    border:1px solid rgba(255,190,70,.25);
    border-radius:15px;
    background:rgba(70,40,0,.25);
}

#testModePanel.show{
    display:block;
}

.test-title{
    font-size:12px;
    font-weight:900;
    color:#ffd36a;
}

.test-info{
    margin-top:5px;
    font-size:10px;
    color:rgba(255,255,255,.55);
}

#forcedWinner{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    color:white;
    background:rgba(255,255,255,.08);
}

.menu-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
}

.menu-button{
    padding:13px 25px;
    border:0;
    border-radius:12px;
    cursor:pointer;
    font-weight:900;
}

#startRaceButton{
    background:white;
    color:#101510;
}

#resetSettings{
    color:white;
    background:rgba(255,255,255,.1);
}

/* =====================================================
   COUNTDOWN
===================================================== */

#countdown{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    color:white;
    font-size:clamp(90px,20vw,220px);
    font-weight:1000;
    text-shadow:0 10px 50px rgba(0,0,0,.8);
}

#countdown.show{

}

/* =====================================================
   HUD
===================================================== */

#topHud{
    position:fixed;
    top:18px;

    min-width:320px;

    background:rgba(0,0,0,.38);
    backdrop-filter:blur(15px);
}

.race-title{
    font-size:16px;
    font-weight:900;
    letter-spacing:3px;
}

.race-status{
    margin-top:5px;
    font-size:11px;
    color:rgba(255,255,255,.6);
}

/* =====================================================
   LIVE POSITION
===================================================== */

#leaderboard{
    position:fixed;
    top:18px;
    right:18px;

    width:230px;
    padding:14px;
    color:white;

    background:rgba(0,0,0,.4);

}

.lb-title{
    margin-bottom:10px;

}

.lb-row{
    display:flex;

    justify-content:space-between;
    padding:7px;
    margin-top:3px;
    border-radius:7px;
    font-size:11px;
    color:rgba(255,255,255,.7);
}

.lb-row.leading{
    color:white;

}

.lb-left{
    display:flex;
    align-items:center;

}

.lb-number{
    width:18px;
    text-align:center;

}

.lb-player{
    font-weight:600;
}

.lb-distance{
    color:rgba(255,255,255,.5);
}

/* =====================================================
   START PANEL
===================================================== */

#startPanel{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:100;
    padding:12px 20px;
    color:white;
    font-size:12px;
    border-radius:50px;
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    transition:.4s;
}

#startPanel.hidden{
    opacity:0;
    transform:translateX(-50%) translateY(20px);
}

/* =====================================================
   FINISH
===================================================== */

#finishPanel{
    position:fixed;
    inset:0;
    z-index:800;
    display:flex;
    align-items:center;
    justify-content:center;

    visibility:hidden;
    background:rgba(0,0,0,.55);

}

#finishPanel.show{

}

.finish-box{

    text-align:center;

    border:1px solid rgba(255,255,255,.15);
    background:
        linear-gradient(
            145deg,
            rgba(30,45,33,.97),
            rgba(5,12,7,.97)
        );
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.finish-trophy{
    font-size:55px;
}

.finish-title{
    margin-top:8px;
    font-size:28px;
    font-weight:1000;
}

.finish-subtitle{
    margin-top:6px;
    font-size:12px;
    color:rgba(255,255,255,.5);
}

.final-list{
    margin-top:20px;
    text-align:left;
}

.final-row{
    display:flex;
    justify-content:space-between;
    padding:9px 12px;
    margin-top:5px;
    border-radius:9px;
    background:rgba(255,255,255,.06);
    font-size:13px;
}

.final-row.first{
    background:rgba(255,255,255,.15);
}

#againButton{
    width:100%;
    margin-top:22px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:white;
    color:#101510;
    font-weight:900;
    cursor:pointer;
}

/* =====================================================
   EFFECT
===================================================== */

#cinematicVignette{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.24) 100%
        );
    box-shadow:inset 0 0 90px rgba(0,0,0,.22);
}

#raceFlash{
    position:fixed;
    inset:0;
    z-index:25;
    pointer-events:none;
    opacity:0;
    background:rgba(255,255,255,.28);
}

#raceVignette{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    box-shadow:inset 0 0 140px rgba(0,0,0,.35);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    .horse-grid{
        grid-template-columns:repeat(2,1fr);
    }

    #topHud{
        top:10px;
        min-width:220px;
        padding:9px 14px;
    }

    .race-title{
        font-size:12px;
    }

    #leaderboard{
        top:70px;
        right:10px;

    }

    .lb-row{

    }

    #startPanel{
        bottom:12px;

    }
}

@media(max-width:450px){

    .horse-grid{
        grid-template-columns:1fr;
    }

    .horse-preview{
        height:80px;
    }
}

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    clone as cloneSkeleton
} from "three/addons/utils/SkeletonUtils.js";


/* =====================================================
   CONFIG
===================================================== */

const HORSE_FILE =
    "./quaternius_cc0-white-horse-1081(1).glb";

const HORSE_COUNT = 8;

const LANE_SPACING = 2.6;

const START_Z = 20;

const FINISH_Z = -280;

const RACE_DISTANCE =
    START_Z - FINISH_Z;


/* =====================================================
   HORSE COLORS
===================================================== */

const defaultColors = [
    "#8B4513",
    "#111111",
    "#FFFFFF",
    "#654321",
    "#A0522D",
    "#3B2415",
    "#C8A27A",
    "#4B3621"
];


/* =====================================================
   HORSE NAMES
===================================================== */

const defaultNames = [
    "Thunder",
    "Blaze",
    "Shadow",
    "Storm",
    "Rocket",
    "Comet",
    "Hunter",
    "Flash"
];


/* =====================================================
   HORSE DATA
===================================================== */

let horseSettings =
    JSON.parse(
        localStorage.getItem(
            "horseSettingsV9"
        ) || "null"
    );

if(!horseSettings){

    horseSettings =
        defaultNames.map(
            (name,index)=>({

                name:name,

                color:
                    defaultColors[index]

            })
        );

}


/* =====================================================
   GLOBAL
===================================================== */

let scene;
let camera;
let renderer;
let clock;

let horses = [];

let raceStarted = false;
let raceFinished = false;
let countdownRunning = false;

let finishOrder = [];

let forcedWinner = -1;

let testMode = false;

let raceNumber =
    Number(
        localStorage.getItem(
            "horseRaceNumber"
        ) || 1
    );


let dustMesh;
let dustParticles = [];

let cameraTarget =
    new THREE.Vector3();

let cameraLook =
    new THREE.Vector3();


/* =====================================================
   DOM
===================================================== */

const loading =
    document.getElementById("loading");

const progress =
    document.getElementById("loading-progress");

const loadingPercent =
    document.querySelector(
        ".loading-percent"
    );

const menu =
    document.getElementById("menu");

const horseGrid =
    document.getElementById("horseGrid");

const testModeInput =
    document.getElementById("testMode");

const testModePanel =
    document.getElementById(
        "testModePanel"
    );

const forcedWinnerSelect =
    document.getElementById(
        "forcedWinner"
    );

const startRaceButton =
    document.getElementById(
        "startRaceButton"
    );

const resetSettings =
    document.getElementById(
        "resetSettings"
    );

const countdown =
    document.getElementById(
        "countdown"
    );

const raceStatus =
    document.getElementById(
        "raceStatus"
    );

const leaderRows =
    document.getElementById(
        "leaderRows"
    );

const startPanel =
    document.getElementById(
        "startPanel"
    );

const finishPanel =
    document.getElementById(
        "finishPanel"
    );

const finalList =
    document.getElementById(
        "finalList"
    );

const againButton =
    document.getElementById(
        "againButton"
    );

const raceFlash =
    document.getElementById(
        "raceFlash"
    );


/* =====================================================
   MENU
===================================================== */

function buildMenu(){

    horseGrid.innerHTML = "";

    forcedWinnerSelect.innerHTML =
        `<option value="-1">
            Random Winner
        </option>`;

    for(
        let i=0;
        i<HORSE_COUNT;
        i++
    ){

        const data =
            horseSettings[i];

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "horse-card";

        card.innerHTML = `

            <div class="horse-preview">
                🐎
            </div>

            <div class="horse-number">
                HORSE ${i+1}
            </div>

            <label>
                NAMA KUDA
            </label>

            <input
                type="text"
                maxlength="18"
                value="${escapeHtml(data.name)}"
                data-name="${i}"
            >

            <label>
                WARNA KUDA
            </label>

            <div class="color-row">

                <input
                    type="color"
                    value="${data.color}"
                    data-color="${i}"
                >

                <span class="color-value">
                    ${data.color}
                </span>

            </div>

        `;

        horseGrid.appendChild(card);


        const option =
            document.createElement(
                "option"
            );

        option.value = i;

        option.textContent =
            `${i+1}. ${data.name}`;

        forcedWinnerSelect.appendChild(
            option
        );

    }


    document
        .querySelectorAll(
            "[data-name]"
        )
        .forEach(input=>{

            input.addEventListener(
                "input",
                function(){

                    const index =
                        Number(
                            this.dataset.name
                        );

                    horseSettings[index].name =
                        this.value ||
                        `Horse ${index+1}`;

                    saveSettings();

                    updateForcedWinnerOptions();

                }
            );

        });


    document
        .querySelectorAll(
            "[data-color]"
        )
        .forEach(input=>{

            input.addEventListener(
                "input",
                function(){

                    const index =
                        Number(
                            this.dataset.color
                        );

                    horseSettings[index].color =
                        this.value;

                    this.nextElementSibling
                        .textContent =
                        this.value;

                    saveSettings();

                }
            );

        });

}


function updateForcedWinnerOptions(){

    const old =
        forcedWinnerSelect.value;

    forcedWinnerSelect.innerHTML =
        `<option value="-1">
            Random Winner
        </option>`;

    horseSettings.forEach(
        (horse,index)=>{

            const option =
                document.createElement(
                    "option"
                );

            option.value = index;

            option.textContent =
                `${index+1}. ${horse.name}`;

            forcedWinnerSelect.appendChild(
                option
            );

        }
    );

    forcedWinnerSelect.value =
        old;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   SAVE SETTINGS
===================================================== */

function saveSettings(){

    localStorage.setItem(
        "horseSettingsV9",
        JSON.stringify(
            horseSettings
        )
    );

}


/* =====================================================
   RESET SETTINGS
===================================================== */

resetSettings.addEventListener(
    "click",
    function(){

        horseSettings =
            defaultNames.map(
                (name,index)=>({

                    name:name,

                    color:
                        defaultColors[index]

                })
            );

        saveSettings();

        buildMenu();

    }
);


/* =====================================================
   TEST MODE
===================================================== */

testModeInput.addEventListener(
    "change",
    function(){

        testMode =
            this.checked;

        testModePanel
            .classList.toggle(
                "show",
                testMode
            );

    }
);


/* =====================================================
   START BUTTON
===================================================== */

startRaceButton.addEventListener(
    "click",
    function(){

        saveSettings();

        testMode =
            testModeInput.checked;

        forcedWinner =
            Number(
                forcedWinnerSelect.value
            );

        menu.style.display =
            "none";

        startNewRace();

    }
);


/* =====================================================
   INIT
===================================================== */

function init(){

    clock =
        new THREE.Clock();

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x8bc7e8
        );


    camera =
        new THREE.PerspectiveCamera(
            55,
            window.innerWidth /
            window.innerHeight,
            .1,
            1000
        );


    camera.position.set(
        0,
        10,
        30
    );


    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled =
        true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.1;

    document.body.appendChild(
        renderer.domElement
    );


    createLights();

    createWorld();

    createDustSystem();

    loadHorse();

function createDustSystem(){

    const geometry =
        new THREE.SphereGeometry(
            .16,
            6,
            6
        );

    const material =
        new THREE.MeshBasicMaterial({

            color:0xd8b58a,

            transparent:true,

            depthWrite:false

        });


    dustMesh =
        new THREE.InstancedMesh(
            geometry,
            material,
            160
        );


    dustMesh.instanceMatrix.setUsage(
        THREE.DynamicDrawUsage
    );

    scene.add(dustMesh);


    const dummy =
        new THREE.Object3D();


    for(
        let i=0;
        i<160;
        i++
    ){

        dustParticles.push({

            active:false,

            x:0,
            y:-100,
            z:0,

            vx:0,
            vy:0,
            vz:0,

            life:0,
            maxLife:1,

            scale:1

        });


        dummy.position.set(
            0,
            -100,
            0
        );

        dummy.scale.setScalar(0);

        dummy.updateMatrix();

        dustMesh.setMatrixAt(
            i,
            dummy.matrix
        );

    }

}


/* =====================================================
   SPAWN DUST
===================================================== */

function spawnDust(horse){

    const p =
        dustParticles.find(
            x=>!x.active
        );

    if(!p)return;

    p.active=true;

    p.x =
        horse.model.position.x +
        (Math.random()-.5)*.55;

    p.y =
        .08+
        Math.random()*.2;

    p.z =
        horse.model.position.z+
        1+
        Math.random()*.7;

    p.vx =
        (Math.random()-.5)*.9;

    p.vy =
        .25+
        Math.random()*.55;

    p.vz =
        .8+
        Math.random()*1.5;

    p.life=0;

    p.maxLife =
        .45+
        Math.random()*.55;

    p.scale =
        .55+
        Math.random()*.8;

}


/* =====================================================
   UPDATE DUST
===================================================== */

function updateDust(delta){

    if(!dustMesh)return;

    const dummy =
        new THREE.Object3D();

    for(
        let i=0;
        i<dustParticles.length;
        i++
    ){

        const p =
            dustParticles[i];

        if(p.active){

            p.life += delta;

            p.x +=
                p.vx*delta;

            p.y +=
                p.vy*delta;

            p.z +=
                p.vz*delta;

            p.vy -=
                1.15*delta;

            if(
                p.life>=p.maxLife
            ){

                p.active=false;

            }

        }


        if(p.active){

            const t =
                p.life /
                p.maxLife;

            dummy.position.set(
                p.x,
                p.y,
                p.z
            );

            dummy.scale.setScalar(
                Math.max(
                    .001,
                    p.scale*(1-t)
                )
            );

        }
        else{

            dummy.position.set(
                0,
                -100,
                0
            );

            dummy.scale.setScalar(0);

        }


        dummy.updateMatrix();

        dustMesh.setMatrixAt(
            i,
            dummy.matrix
        );

    }

    dustMesh.instanceMatrix.needsUpdate=true;

}

/* =====================================================
   CREATE HORSES
===================================================== */

function createHorses(gltf){

    horses=[];


    let gallop =
        gltf.animations.find(
            animation =>
                animation.name
                    .toLowerCase()
                    .includes("gallop")
        );


    for(
        let i=0;
        i<HORSE_COUNT;
        i++
    ){

        const horse =
            cloneSkeleton(
                gltf.scene
            );

        scene.add(horse);


        horse.scale.set(
            1,
            1,
            1
        );

        horse.updateMatrixWorld(true);


        let box =
            new THREE.Box3();

        box.setFromObject(horse);


        const size =
            new THREE.Vector3();

        box.getSize(size);


        const TARGET_HEIGHT =
            3.55;


        if(size.y>.001){

            const scale =
                TARGET_HEIGHT /
                size.y;

            horse.scale.setScalar(
                scale
            );

        }


        horse.updateMatrixWorld(true);


        box =
            new THREE.Box3();

        box.setFromObject(horse);


        const x =
            (
                i-3.5
            )*
            LANE_SPACING;


        const y =
            -box.min.y;


        horse.position.set(
            x,
            y,
            START_Z
        );


        horse.rotation.y =
            Math.PI;


        horse.traverse(
            object=>{

                if(object.isMesh){

                    object.castShadow=true;

                    object.receiveShadow=true;

                    object.frustumCulled=false;

                    /*
                     * Karena model dasar Quaternius
                     * adalah putih, kita beri variasi
                     * warna menggunakan material.
                     */

                    if(object.material){

                        object.material =
                            object.material.clone();

                        object.material.color =
                            new THREE.Color(
                                horseSettings[i].color
                            );

                    }

                }

            }
        );


        const mixer =
            new THREE.AnimationMixer(
                horse
            );


        let action=null;


        if(gallop){

            action =
                mixer.clipAction(
                    gallop
                );

            action.setLoop(
                THREE.LoopRepeat,
                Infinity
            );

        }


        horses.push({

            id:i,

            player:
                horseSettings[i].name,

            model:horse,

            mixer:mixer,

            action:action,

            baseX:x,

            baseY:y,

            distance:0,

            finished:false,

            finishTime:null,

            /*
             * Speed dasar baru dibuat setiap race.
             */

            baseSpeed:9,

            currentSpeed:9,

            stamina:100,

            boost:0,

            rivalry:0,

            overtakeCount:0,

            lastPosition:i,

            variation:
                Math.random()*Math.PI*2,

            bobPhase:
                Math.random()*Math.PI*2,

            dustTimer:
                Math.random()*.1

        });

    }


    updateLeaderboard();

}

        "horseRaceNumber",
        raceNumber
    );


    finishOrder=[];

    raceStarted=false;

    raceFinished=false;

    countdownRunning=false;


    /*

     *

     */

    const performance =

                Math.random()*.24
        );


    /*
     * Kalau TEST MODE aktif,
     * pemenang target mendapat
     * sedikit keuntungan performa.
     */

    if(
        testMode &&
        forcedWinner>=0 &&
        forcedWinner<HORSE_COUNT
    ){

        performance[forcedWinner] +=
            .20;

    }


    horses.forEach(
        (horse,index)=>{

            const x =
                (
                    index-3.5
                )*
                LANE_SPACING;


            horse.model.position.set(
                x,
                horse.baseY,
                START_Z
            );


            horse.baseX=x;

            horse.distance=0;

            horse.finished=false;

            horse.finishTime=null;

            horse.stamina=100;

            horse.boost=0;

            horse.rivalry=0;

            horse.overtakeCount=0;

            horse.lastPosition=index;


            /*
             * RANDOM BASE SPEED
             */

            horse.baseSpeed =
                (
                    8.75+
                    Math.random()*1.25
                )*
                performance[index];


            horse.currentSpeed =
                horse.baseSpeed;


            horse.dustTimer=.02;


            if(horse.action){

                horse.action.stop();

            }

        }
    );


    raceStatus.textContent =
        "GET READY";


    startPanel.classList.remove(
        "hidden"
    );


    updateLeaderboard();


    startCountdown();

/* =====================================================
   RIVALRY SYSTEM
===================================================== */

function calculateRivalry(){

    const sorted =
        [...horses].sort(
            (a,b)=>
                a.model.position.z -
                b.model.position.z
        );


    sorted.forEach(
        (horse,index)=>{

            const previous =
                horse.lastPosition;


            if(
                previous!==index
            ){

                if(
                    index<previous
                ){

                    horse.overtakeCount++;

                    horse.rivalry =
                        Math.min(
                            100,
                            horse.rivalry+8
                        );

                }

                horse.lastPosition=
                    index;

            }


            /*
             * Kuda yang berada
             * dekat dengan lawannya
             * mendapatkan tekanan rivalry.
             */

            if(index>0){

                const ahead =
                    sorted[index-1];

                const distance =
                    Math.abs(
                        horse.model.position.z -
                        ahead.model.position.z
                    );


                if(distance<5){

                    horse.rivalry =
                        Math.min(
                            100,
                            horse.rivalry+
                            .8
                        );

                }

            }

        }
    );

}


/* =====================================================
   BOOST SYSTEM
===================================================== */

function updateBoost(horse,delta){

    /*
     * Semakin tinggi rivalry,
     * semakin besar kemungkinan boost.
     */

    const chance =
        .0025+
        horse.rivalry*.00008;


    if(
        Math.random()<chance &&
        horse.stamina>35
    ){

        horse.boost =
            Math.min(
                100,
                horse.boost+20
            );

    }


    if(horse.boost>0){

        const boostPower =
            .55+
            horse.boost*.006;

        horse.currentSpeed +=
            boostPower;


        horse.boost -=
            18*delta;

        horse.stamina -=
            3*delta;

    }

}


/* =====================================================
   STAMINA
===================================================== */

function updateStamina(horse,delta){

    /*
     * Kuda cepat lebih banyak
     * menggunakan stamina.
     */

    const drain =
        Math.max(
            0,
            horse.currentSpeed-8.5
        )*.65;


    horse.stamina -=
        drain*delta;


    if(
        horse.stamina<15
    ){

        horse.currentSpeed -=
            .5;

    }


    /*
     * Sedikit recovery jika
     * kecepatannya turun.
     */

    if(
        horse.currentSpeed<9
    ){

        horse.stamina +=
            .8*delta;

    }


    horse.stamina =
        THREE.MathUtils.clamp(
            horse.stamina,
            0,
            100
        );

}


/* =====================================================
   UPDATE HORSES
===================================================== */

function updateHorses(
    delta,
    elapsed
){

    if(
        !raceStarted ||
        raceFinished
    ){

        return;

    }


    horses.forEach(
        horse=>{

            if(horse.mixer){

                horse.mixer.update(
                    delta
                );

            }


            if(horse.finished){

                return;

            }


            /*
             * NATURAL SPEED VARIATION
             */

            const wave =
                Math.sin(
                    elapsed*.72+
                    horse.variation
                )*.20;


            const micro =
                Math.sin(
                    elapsed*1.8+
                    horse.variation*1.9
                )*.08;


            const momentum =
                Math.sin(
                    elapsed*.21+
                    horse.variation*2.4
                )*.10;


            horse.currentSpeed =
                horse.baseSpeed+
                wave+
                micro+
                momentum;


            /*
             * RIVALRY
             */

            calculateRivalry();


            /*
             * BOOST
             */

            updateBoost(
                horse,
                delta
            );


            /*
             * STAMINA
             */

            updateStamina(
                horse,
                delta
            );


            /*
             * SMALL RANDOM SURGE
             */

            if(
                Math.random()<.004 &&
                horse.stamina>50
            ){

                horse.currentSpeed +=
                    .35+
                    Math.random()*.5;

            }


            /*
             * MOVEMENT
             */

            const movement =
                Math.max(
                    0,
                    horse.currentSpeed
                )*
                delta;


            horse.model.position.z -=
                movement;


            horse.distance +=
                movement;


            /*
             * GALLOP MOTION
             */

            const phase =
                elapsed*
                (
                    7.2+
                    horse.currentSpeed*.12
                )+
                horse.bobPhase;


            horse.model.position.y =
                horse.baseY+
                Math.sin(phase)*.045;


            /*
             * SEDIKIT LATERAL
             */

            horse.model.position.x =
                horse.baseX+
                Math.sin(phase*.5)*.025;


            horse.model.rotation.z =
                Math.sin(phase*.5)*.008;


            horse.model.rotation.x =
                Math.sin(phase)*.006;


            /*
             * ANIMATION SPEED
             */

            if(horse.action){

                horse.action
                    .setEffectiveTimeScale(
                        THREE.MathUtils.clamp(
                            .84+
                            horse.currentSpeed/10*.31,
                            .84,
                            1.35
                        )
                    );

            }


            /*
             * DUST
             */

            horse.dustTimer -=
                delta;


            const dustInterval =
                THREE.MathUtils.clamp(
                    .095-
                    (horse.currentSpeed-9)*.008,
                    .045,
                    .095
                );


            if(
                horse.dustTimer<=0
            ){

                spawnDust(horse);

                if(
                    Math.random()>.32
                ){

                    spawnDust(horse);

                }

                horse.dustTimer =
                    dustInterval+
                    Math.random()*.045;

            }


            /*
             * FINISH
             */

            if(
                horse.model.position.z<=
                FINISH_Z
            ){

                horse.finished=true;

                horse.finishTime=
                    elapsed;

                finishOrder.push(
                    horse
                );


                if(horse.action){

                    horse.action.stop();

                }

            }

        }
    );


    updateDust(delta);

    updateLeaderboard();


    if(
        finishOrder.length===
        HORSE_COUNT
    ){

        finishRace();

    }

}


/* =====================================================
   LEADERBOARD
===================================================== */

function updateLeaderboard(){

    if(
        horses.length===0
    ){

        return;

    }


    const sorted =
        [...horses].sort(
            (a,b)=>
                a.model.position.z -
                b.model.position.z
        );


    leaderRows.innerHTML="";


    sorted.forEach(
        (horse,index)=>{

            const row =
                document.createElement(
                    "div"
                );


            row.className=
                "lb-row";


            if(index===0){

                row.classList.add(
                    "leading"
                );

            }


            const progress =
                Math.min(
                    100,
                    horse.distance /
                    RACE_DISTANCE*
                    100
                );


            row.innerHTML=`

                <div class="lb-left">

                    <div class="lb-number">
                        ${index+1}
                    </div>

                    <div class="lb-player">
                        ${escapeHtml(horse.player)}
                    </div>

                </div>

                <div class="lb-distance">
                    ${Math.round(progress)}%
                </div>

            `;


            leaderRows.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   FINISH RACE
===================================================== */

function finishRace(){

    raceFinished=true;

    raceStarted=false;


    /*
     * Pastikan semua kuda
     * masuk ranking.
     */

    const remaining =
        horses
            .filter(
                horse =>
                    !finishOrder.includes(
                        horse
                    )
            )
            .sort(
                (a,b)=>
                    a.model.position.z -
                    b.model.position.z
            );


    finishOrder.push(
        ...remaining
    );


    /*
     * TEST MODE SAFETY
     *
     * Jika target winner belum
     * masuk posisi pertama,
     * kita hanya menggunakannya
     * sebagai penanda hasil testing.
     *
     * Dalam race normal tidak
     * ada forced winner.
     */


    if(
        testMode &&
        forcedWinner>=0
    ){

        const target =
            horses[forcedWinner];

        const index =
            finishOrder.indexOf(
                target
            );


        if(index>0){

            finishOrder.splice(
                index,
                1
            );

            finishOrder.unshift(
                target
            );

        }

    }


    raceStatus.textContent=
        "FINISH";


    finalList.innerHTML="";


    finishOrder.forEach(
        (horse,index)=>{

            const row =
                document.createElement(
                    "div"
                );


            row.className=
                "final-row";


            if(index===0){

                row.classList.add(
                    "first"
                );

            }


            row.innerHTML=`

                <span>
                    ${index+1}.
                    ${escapeHtml(horse.player)}
                </span>

                <span>
                    ${
                        index===0
                        ? "🏆"
                        : ""
                    }
                </span>

            `;


            finalList.appendChild(
                row
            );

        }
    );


    setTimeout(
        function(){

            finishPanel.classList.add(
                "show"
            );

        },
        1000
    );

}


/* =====================================================
   CAMERA
   SIDE-TOP CINEMATIC
===================================================== */

function updateCamera(){

    if(
        horses.length===0
    ){

        return;

    }


    const sorted =
        [...horses].sort(
            (a,b)=>
                a.model.position.z -
                b.model.position.z
        );


    const leader =
        sorted[0];


    let averageX=0;

    let averageZ=0;


    horses.forEach(
        horse=>{

            averageX +=
                horse.model.position.x;

            averageZ +=
                horse.model.position.z;

        }
    );


    averageX /=
        horses.length;

    averageZ /=
        horses.length;


    /*
     * SIDE-TOP
     *
     * Kamera tidak berada tepat
     * di belakang kuda.
     */

    const progress =
        THREE.MathUtils.clamp(
            (
                START_Z-
                averageZ
            )/
            (
                START_Z-
                FINISH_Z
            ),
            0,
            1
        );


    const side =
        THREE.MathUtils.lerp(
            18,
            15,
            progress
        );


    const height =
        THREE.MathUtils.lerp(
            14,
            11,
            progress
        );


    const back =
        THREE.MathUtils.lerp(
            18,
            14,
            progress
        );


    const cinematicSway =
        Math.sin(
            clock.elapsedTime*.32
        )*.7;


    cameraTarget.set(

        averageX+
        side+
        cinematicSway,

        height,

        averageZ+
        back

    );


    camera.position.lerp(
        cameraTarget,
        .045
    );


    cameraLook.set(

        averageX,
        1.8,
        averageZ-
        10

    );


    camera.lookAt(
        cameraLook
    );


    /*
     * FOV DINAMIS
     */

    const targetFov =
        THREE.MathUtils.lerp(
            53,
            60,
            progress
        );


    camera.fov +=
        (
            targetFov-
            camera.fov
        )*.035;


    camera.updateProjectionMatrix();

}


/* =====================================================
   RESIZE
===================================================== */

function onResize(){

    camera.aspect =
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =====================================================
   ANIMATE
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    const elapsed =
        clock.elapsedTime;


    updateHorses(
        delta,
        elapsed
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   START
===================================================== */

buildMenu();

init();

</script>
