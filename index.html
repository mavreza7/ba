<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horse Racing 3D — V13 FIX</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#91b79b;
}

body{
    position:relative;
}

/* =========================
   GAME CANVAS
========================= */

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle at center,
            rgba(75,105,83,.95),
            rgba(20,31,25,.98)
        );

    color:white;
    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loading-title{
    font-size:28px;
    font-weight:800;
    letter-spacing:5px;
    margin-bottom:10px;
    text-align:center;
}

.loading-sub{
    font-size:13px;
    opacity:.7;
    margin-bottom:25px;
    text-align:center;
}

.loading-bar{
    width:min(360px,80vw);
    height:8px;
    background:rgba(255,255,255,.15);
    border-radius:20px;
    overflow:hidden;
}

#loadingProgress{
    width:0%;
    height:100%;
    background:linear-gradient(
        90deg,
        #ffffff,
        #b8dfbc
    );
    border-radius:20px;
    transition:width .25s ease;
}

#loadingText{
    margin-top:14px;
    font-size:12px;
    opacity:.7;
}

/* =========================
   HEADER
========================= */

#topPanel{
    position:fixed;
    z-index:20;

    top:20px;
    left:50%;
    transform:translateX(-50%);

    width:320px;
    padding:16px 22px;

    text-align:center;

    color:white;

    background:rgba(35,48,39,.72);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);
}

#topPanel .title{
    font-size:18px;
    font-weight:800;
    letter-spacing:4px;
}

#topPanel .subtitle{
    margin-top:5px;
    font-size:11px;
    opacity:.7;
    letter-spacing:1px;
}

/* =========================
   LIVE POSITION
========================= */

#leaderboard{
    position:fixed;
    z-index:20;

    top:20px;
    right:18px;

    width:225px;

    padding:14px;

    color:white;

    background:rgba(35,45,37,.72);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);
}

.board-title{
    font-size:14px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:9px;
}

.position{
    display:grid;
    grid-template-columns:22px 1fr 48px;
    align-items:center;

    min-height:31px;

    padding:0 8px;

    margin-bottom:3px;

    border-radius:8px;

    font-size:11px;

    background:rgba(255,255,255,.035);
}

.position:first-of-type{
    background:rgba(255,255,255,.13);
}

.position .rank{
    font-weight:800;
}

.position .name{
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.position .distance{
    text-align:right;
    opacity:.65;
    font-size:10px;
}

/* =========================
   FINISH PANEL
========================= */

#finishPanel{
    position:fixed;
    z-index:50;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.9);

    width:min(430px,90vw);

    padding:30px;

    text-align:center;

    color:white;

    background:rgba(25,32,27,.9);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.12);
    border-radius:25px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .4s ease,
        transform .4s ease,
        visibility .4s ease;
}

#finishPanel.show{
    opacity:1;
    visibility:visible;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.finish-icon{
    font-size:42px;
    margin-bottom:8px;
}

.finish-title{
    font-size:13px;
    letter-spacing:3px;
    opacity:.65;
}

#winnerName{
    margin-top:10px;

    font-size:32px;
    font-weight:900;
}

#winnerText{
    margin-top:8px;

    font-size:13px;
    opacity:.65;
}

#restartBtn{
    margin-top:22px;

    border:0;
    outline:none;

    padding:12px 28px;

    border-radius:30px;

    background:white;
    color:#243126;

    font-size:13px;
    font-weight:800;

    cursor:pointer;

    transition:
        transform .2s ease,
        opacity .2s ease;
}

#restartBtn:hover{
    transform:translateY(-2px);
}

#restartBtn:active{
    transform:scale(.96);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #topPanel{
        top:10px;
        width:230px;
        padding:12px 14px;
        border-radius:14px;
    }

    #topPanel .title{
        font-size:13px;
        letter-spacing:3px;
    }

    #topPanel .subtitle{
        font-size:9px;
    }

    #leaderboard{
        top:10px;
        right:10px;

        width:170px;

        padding:9px;

        border-radius:14px;
    }

    .board-title{
        font-size:11px;
    }

    .position{
        min-height:25px;

        grid-template-columns:
            18px
            1fr
            36px;

        font-size:9px;
    }

    .position .distance{
        font-size:8px;
    }

    #finishPanel{
        padding:24px;
    }

    #winnerName{
        font-size:25px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="loading-title">
        HORSE RACING
    </div>

    <div class="loading-sub">
        MENYIAPKAN ARENA
    </div>

    <div class="loading-bar">
        <div id="loadingProgress"></div>
    </div>

    <div id="loadingText">
        Memuat arena...
    </div>

</div>

<!-- =========================
     TOP
========================= -->

<div id="topPanel">

    <div class="title">
        🏇 HORSE RACING
    </div>

    <div class="subtitle" id="raceStatus">
        RACING
    </div>

</div>

<!-- =========================
     LIVE POSITION
========================= -->

<div id="leaderboard">

    <div class="board-title">
        🏆 LIVE POSITION
    </div>

    <div id="positions"></div>

</div>

<!-- =========================
     FINISH
========================= -->

<div id="finishPanel">

    <div class="finish-icon">
        🏆
    </div>

    <div class="finish-title">
        RACE FINISHED
    </div>

    <div id="winnerName">
        —
    </div>

    <div id="winnerText">
        Pemenang balapan!
    </div>

    <button id="restartBtn">
        BALAP LAGI
    </button>

</div>

<!-- =========================================================
     THREE.JS IMPORT MAP
========================================================= -->

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   BASIC SETUP
========================================================= */

const canvas =
    document.getElementById("game");

const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x91b9a0);

scene.fog =
    new THREE.Fog(
        0x91b9a0,
        100,
        850
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        48,
        window.innerWidth /
        window.innerHeight,
        .1,
        2000
    );

camera.position.set(
    -90,
    115,
    145
);


/* =========================================================
   LIGHTING
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x55705b,
        2.2
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    -100,
    180,
    100
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -350;
sun.shadow.camera.right = 350;
sun.shadow.camera.top = 350;
sun.shadow.camera.bottom = -350;

scene.add(sun);


/* =========================================================
   ARENA
========================================================= */

const TRACK_LENGTH = 720;
const TRACK_WIDTH = 65;
const LANE_COUNT = 8;


/* =========================================================
   GRASS
========================================================= */

const grass =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1100,
            650
        ),
        new THREE.MeshStandardMaterial({
            color:0x8fc681,
            roughness:1
        })
    );

grass.rotation.x =
    -Math.PI / 2;

grass.position.y = -0.3;

grass.receiveShadow = true;

scene.add(grass);


/* =========================================================
   TRACK
========================================================= */

const track =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            TRACK_LENGTH,
            TRACK_WIDTH
        ),
        new THREE.MeshStandardMaterial({
            color:0xcda17e,
            roughness:1
        })
    );

track.rotation.x =
    -Math.PI / 2;

track.receiveShadow = true;

scene.add(track);


/* =========================================================
   TRACK LANES
========================================================= */

const laneMaterial =
    new THREE.LineBasicMaterial({
        color:0xffffff,
        transparent:true,
        opacity:.22
    });


for(let i=1;i<LANE_COUNT;i++){

    const z =
        -TRACK_WIDTH / 2 +
        i *
        (TRACK_WIDTH / LANE_COUNT);

    const points = [
        new THREE.Vector3(
            -TRACK_LENGTH/2,
            .025,
            z
        ),
        new THREE.Vector3(
            TRACK_LENGTH/2,
            .025,
            z
        )
    ];

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);

    const line =
        new THREE.Line(
            geometry,
            laneMaterial
        );

    scene.add(line);
}


/* =========================================================
   SIDE RAILS
========================================================= */

function createFence(z){

    const group =
        new THREE.Group();

    const postMaterial =
        new THREE.MeshStandardMaterial({
            color:0xf4f4f0,
            roughness:.8
        });

    const railMaterial =
        new THREE.MeshStandardMaterial({
            color:0xe8e8e2,
            roughness:.8
        });

    for(
        let x=-TRACK_LENGTH/2;
        x<=TRACK_LENGTH/2;
        x+=14
    ){

        const post =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .12,
                    .15,
                    2.3,
                    6
                ),
                postMaterial
            );

        post.position.set(
            x,
            1.05,
            z
        );

        post.castShadow = true;

        group.add(post);
    }


    const rail =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TRACK_LENGTH,
                .12,
                .12
            ),
            railMaterial
        );

    rail.position.set(
        0,
        1.65,
        z
    );

    group.add(rail);


    scene.add(group);
}

createFence(
    -TRACK_WIDTH/2 - 1.5
);

createFence(
    TRACK_WIDTH/2 + 1.5
);


/* =========================================================
   FINISH LINE
========================================================= */

function createFinish(){

    const group =
        new THREE.Group();

    const squareSize = 3;

    for(
        let x=-12;
        x<=12;
        x+=squareSize
    ){

        for(
            let z=-TRACK_WIDTH/2;
            z<TRACK_WIDTH/2;
            z+=squareSize
        ){

            const even =
                (
                    Math.round(
                        (x+12)/squareSize
                    ) +
                    Math.round(
                        (z+TRACK_WIDTH/2) /
                        squareSize
                    )
                ) % 2 === 0;

            const mat =
                new THREE.MeshStandardMaterial({
                    color:
                        even ?
                        0xffffff :
                        0x222222
                });

            const tile =
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        squareSize,
                        squareSize
                    ),
                    mat
                );

            tile.rotation.x =
                -Math.PI/2;

            tile.position.set(
                x,
                .035,
                z
            );

            group.add(tile);
        }
    }

    group.position.x =
        TRACK_LENGTH/2 - 30;

    scene.add(group);
}

createFinish();


/* =========================================================
   TREES + ROCKS
========================================================= */

/*
    PENTING:

    TIDAK ADA GUNUNG.

    Asset hanya:
    - 5 pohon
    - 4 batu

    Semua diletakkan di luar lintasan.
*/


const TREE_FILES = [

    "quaternious_cc0-common-tree-846.glb",

    "quaternious_cc0-common-tree-838.glb",

    "quaternious_cc0-common-tree-837.glb",

    "quaternious_cc0-common-tree-839.glb",

    "quaternious_cc0-common-tree-835.glb"

];


const ROCK_FILES = [

    "quaternious_cc0-mossy-rock-1304.glb",

    "quaternious_cc0-mossy-rock-1303.glb",

    "quaternious_cc0-mossy-rock-1309.glb",

    "quaternious_cc0-mossy-rock-1308.glb"

];


const ASSET_PATH =
    "assets/trees/";


const loader =
    new GLTFLoader();


const treeModels = [];
const rockModels = [];


/* =========================================================
   ASSET LOADER
========================================================= */

function loadGLB(url){

    return new Promise(
        (resolve,reject)=>{

            loader.load(

                url,

                gltf=>{
                    resolve(gltf.scene);
                },

                undefined,

                error=>{
                    reject(error);
                }

            );

        }
    );
}


/* =========================================================
   LOAD TREES
========================================================= */

async function loadTrees(){

    for(
        let i=0;
        i<TREE_FILES.length;
        i++
    ){

        const file =
            TREE_FILES[i];

        try{

            const model =
                await loadGLB(
                    ASSET_PATH + file
                );

            model.traverse(
                child=>{

                    if(child.isMesh){

                        child.castShadow = true;
                        child.receiveShadow = true;

                    }

                }
            );

            treeModels.push(model);

            updateLoading(
                15 +
                ((i+1) /
                TREE_FILES.length) * 35,

                `Memuat pohon ${i+1}/5...`
            );

        }
        catch(error){

            console.warn(
                "Pohon gagal dimuat:",
                file,
                error
            );

        }

    }

}


/* =========================================================
   LOAD ROCKS
========================================================= */

async function loadRocks(){

    for(
        let i=0;
        i<ROCK_FILES.length;
        i++
    ){

        const file =
            ROCK_FILES[i];

        try{

            const model =
                await loadGLB(
                    ASSET_PATH + file
                );

            model.traverse(
                child=>{

                    if(child.isMesh){

                        child.castShadow = true;
                        child.receiveShadow = true;

                    }

                }
            );

            rockModels.push(model);

            updateLoading(
                50 +
                ((i+1) /
                ROCK_FILES.length) * 30,

                `Memuat batu ${i+1}/4...`
            );

        }
        catch(error){

            console.warn(
                "Batu gagal dimuat:",
                file,
                error
            );

        }

    }

}


/* =========================================================
   RANDOM UTIL
========================================================= */

function random(min,max){

    return min +
        Math.random() *
        (max-min);
}


/* =========================================================
   PLACE TREE
========================================================= */

function placeTree(
    source,
    x,
    z,
    scale
){

    const tree =
        source.clone(true);

    tree.position.set(
        x,
        0,
        z
    );

    tree.scale.setScalar(
        scale
    );

    tree.rotation.y =
        random(
            0,
            Math.PI*2
        );

    scene.add(tree);
}


/* =========================================================
   PLACE ROCK
========================================================= */

function placeRock(
    source,
    x,
    z,
    scale
){

    const rock =
        source.clone(true);

    rock.position.set(
        x,
        0,
        z
    );

    rock.scale.setScalar(
        scale
    );

    rock.rotation.y =
        random(
            0,
            Math.PI*2
        );

    scene.add(rock);
}


/* =========================================================
   RANDOM ENVIRONMENT
========================================================= */

function createEnvironment(){

    /*
        Area luar lintasan:

        bagian kiri:
        z < -40

        bagian kanan:
        z > 40

        Tidak pernah masuk ke arena.
    */


    if(treeModels.length){

        for(
            let i=0;
            i<32;
            i++
        ){

            const source =
                treeModels[
                    Math.floor(
                        Math.random() *
                        treeModels.length
                    )
                ];

            const side =
                Math.random() < .5
                ? -1
                : 1;

            const x =
                random(
                    -TRACK_LENGTH/2 + 10,
                    TRACK_LENGTH/2 - 10
                );

            const z =
                side *
                random(
                    TRACK_WIDTH/2 + 18,
                    105
                );

            placeTree(
                source,
                x,
                z,
                random(.65,1.15)
            );
        }

    }


    if(rockModels.length){

        for(
            let i=0;
            i<24;
            i++
        ){

            const source =
                rockModels[
                    Math.floor(
                        Math.random() *
                        rockModels.length
                    )
                ];

            const side =
                Math.random() < .5
                ? -1
                : 1;

            const x =
                random(
                    -TRACK_LENGTH/2 + 10,
                    TRACK_LENGTH/2 - 10
                );

            const z =
                side *
                random(
                    TRACK_WIDTH/2 + 12,
                    90
                );

            placeRock(
                source,
                x,
                z,
                random(.45,.9)
            );
        }

    }

}


/* =========================================================
   HORSE SYSTEM
========================================================= */

const HORSES = [

    {
        name:"Shadow",
        color:0x111111
    },

    {
        name:"Golden Flash",
        color:0xb47b19
    },

    {
        name:"Blaze",
        color:0x8d2f18
    },

    {
        name:"Lightning",
        color:0x777777
    },

    {
        name:"Thunder",
        color:0x4c4c4c
    },

    {
        name:"Black Storm",
        color:0x151515
    },

    {
        name:"Wild Runner",
        color:0x5a321d
    },

    {
        name:"Red Fury",
        color:0x9d341d
    }

];


const horseObjects = [];


/* =========================================================
   PROCEDURAL HORSE
========================================================= */

function createHorse(
    horseData,
    lane
){

    const group =
        new THREE.Group();


    const bodyMat =
        new THREE.MeshStandardMaterial({
            color:horseData.color,
            roughness:.75
        });


    const darkMat =
        new THREE.MeshStandardMaterial({
            color:0x151515,
            roughness:.8
        });


    /* BODY */

    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.2,
                12,
                8
            ),
            bodyMat
        );

    body.scale.set(
        1.5,
        .75,
        .7
    );

    body.position.y =
        3.5;

    body.castShadow = true;

    group.add(body);


    /* NECK */

    const neck =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .65,
                .8,
                2.6,
                10
            ),
            bodyMat
        );

    neck.position.set(
        2.0,
        4.7,
        0
    );

    neck.rotation.z =
        -.35;

    neck.castShadow = true;

    group.add(neck);


    /* HEAD */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .8,
                12,
                8
            ),
            bodyMat
        );

    head.scale.set(
        1.25,
        .8,
        .8
    );

    head.position.set(
        3.1,
        5.5,
        0
    );

    head.castShadow = true;

    group.add(head);


    /* EARS */

    for(
        const z of [-.35,.35]
    ){

        const ear =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    .18,
                    .7,
                    6
                ),
                bodyMat
            );

        ear.position.set(
            3.1,
            6.2,
            z
        );

        group.add(ear);

    }


    /* LEGS */

    const legPositions = [

        [-1.4,-.45],
        [-1.4,.45],
        [1.0,-.45],
        [1.0,.45]

    ];


    const legs = [];


    for(
        const [x,z] of legPositions
    ){

        const leg =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .22,
                    .28,
                    2.8,
                    8
                ),
                bodyMat
            );

        leg.position.set(
            x,
            1.8,
            z
        );

        leg.castShadow = true;

        group.add(leg);

        legs.push(leg);

    }


    /* MANE */

    const mane =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .55,
                8,
                8
            ),
            darkMat
        );

    mane.scale.set(
        .55,
        1.7,
        .4
    );

    mane.position.set(
        1.8,
        5.0,
        0
    );

    group.add(mane);


    /* TAIL */

    const tail =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .45,
                2.0,
                8
            ),
            darkMat
        );

    tail.position.set(
        -2.8,
        4.0,
        0
    );

    tail.rotation.z =
        -1.0;

    group.add(tail);


    /*
        Rotate horse so
        positive X = forward
    */

    group.rotation.y = 0;


    const z =
        -TRACK_WIDTH/2 +
        (lane + .5) *
        (TRACK_WIDTH/LANE_COUNT);


    group.position.set(
        -TRACK_LENGTH/2 + 25,
        0,
        z
    );


    group.scale.setScalar(.95);

    scene.add(group);


    return {
        ...horseData,

        group,

        lane,

        distance:0,

        speed:0,

        finished:false,

        finishTime:0,

        legs,

        phase:Math.random()*10,

        /*
            HOKI / RANDOM
        */

        luck:
            random(.86,1.14)
    };

}


/* =========================================================
   CREATE HORSES
========================================================= */

function createHorses(){

    for(
        let i=0;
        i<HORSES.length;
        i++
    ){

        horseObjects.push(
            createHorse(
                HORSES[i],
                i
            )
        );

    }

}


/* =========================================================
   RACE STATE
========================================================= */

let raceStarted = false;
let raceFinished = false;

let raceStartTime = 0;

let winner = null;


/* =========================================================
   START RACE
========================================================= */

function startRace(){

    if(raceStarted)
        return;

    raceStarted = true;

    raceFinished = false;

    raceStartTime =
        performance.now();


    horseObjects.forEach(
        horse=>{

            horse.distance = 0;
            horse.finished = false;
            horse.finishTime = 0;

            horse.group.position.x =
                -TRACK_LENGTH/2 + 25;

            /*
                HOKI RANDOM

                Setiap kuda punya
                karakter kecepatan
                sedikit berbeda.

                Jadi pemenang tidak
                selalu kuda yang sama.
            */

            horse.luck =
                random(.86,1.14);

            horse.speed =
                random(.02,.04);

        }
    );


    document
        .getElementById("raceStatus")
        .textContent =
        "RACING";


    updateLeaderboard();
}


/* =========================================================
   UPDATE HORSES
========================================================= */

function updateRace(){

    if(
        !raceStarted ||
        raceFinished
    )
        return;


    let finishedCount = 0;


    horseObjects.forEach(
        horse=>{

            if(horse.finished){

                finishedCount++;

                return;

            }


            /*
                Base speed
            */

            const base =
                .24;


            /*
                Random fluctuation
            */

            const fluctuation =
                Math.sin(
                    performance.now() * .002 +
                    horse.phase
                ) * .025;


            /*
                HOKI

                speed tetap random
                tetapi tidak terlalu
                ekstrem.
            */

            horse.speed =
                base *
                horse.luck +
                fluctuation;


            /*
                Sedikit variasi
                supaya posisi hidup.
            */

            horse.speed +=
                random(
                    -.018,
                    .018
                );


            horse.speed =
                THREE.MathUtils.clamp(
                    horse.speed,
                    .13,
                    .34
                );


            horse.distance +=
                horse.speed;


            /*
                Maximum race distance
            */

            const maxDistance =
                TRACK_LENGTH - 70;


            if(
                horse.distance >=
                maxDistance
            ){

                horse.distance =
                    maxDistance;

                horse.finished =
                    true;

                horse.finishTime =
                    performance.now();

                if(!winner){

                    winner = horse;

                }

                finishedCount++;

            }


            /*
                Position
            */

            horse.group.position.x =
                -TRACK_LENGTH/2 +
                25 +
                horse.distance;


            /*
                Horse animation
            */

            horse.phase +=
                horse.speed * .7;


            const swing =
                Math.sin(
                    horse.phase * 5
                ) * .45;


            horse.legs.forEach(
                (leg,index)=>{

                    leg.rotation.z =
                        index % 2 === 0
                        ? swing
                        : -swing;

                }
            );


            /*
                Body bob
            */

            horse.group.position.y =
                Math.abs(
                    Math.sin(
                        horse.phase * 2.5
                    )
                ) * .08;

        }
    );


    updateLeaderboard();


    if(
        finishedCount >=
        horseObjects.length
    ){

        finishRace();

    }
}


/* =========================================================
   LEADERBOARD
========================================================= */

function updateLeaderboard(){

    const sorted =
        [...horseObjects]
        .sort(
            (a,b)=>
                b.distance -
                a.distance
        );


    const container =
        document.getElementById(
            "positions"
        );


    container.innerHTML = "";


    sorted.forEach(
        (horse,index)=>{

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "position";


            const rank =
                document.createElement(
                    "div"
                );

            rank.className =
                "rank";

            rank.textContent =
                index + 1;


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "name";

            name.textContent =
                horse.name;


            const distance =
                document.createElement(
                    "div"
                );

            distance.className =
                "distance";

            distance.textContent =
                Math.floor(
                    horse.distance
                ) + "m";


            row.appendChild(rank);
            row.appendChild(name);
            row.appendChild(distance);

            container.appendChild(row);

        }
    );
}


/* =========================================================
   FINISH
========================================================= */

function finishRace(){

    if(raceFinished)
        return;

    raceFinished = true;


    if(!winner){

        winner =
            [...horseObjects]
            .sort(
                (a,b)=>
                    b.distance -
                    a.distance
            )[0];

    }


    document
        .getElementById("raceStatus")
        .textContent =
        "FINISH";


    document
        .getElementById("winnerName")
        .textContent =
        winner.name;


    document
        .getElementById("winnerText")
        .textContent =
        "🏆 Pemenang balapan!";


    document
        .getElementById("finishPanel")
        .classList
        .add("show");

}


/* =========================================================
   RESTART
========================================================= */

document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        ()=>{

            document
                .getElementById("finishPanel")
                .classList
                .remove("show");

            winner = null;

            raceStarted = false;
            raceFinished = false;

            /*
                Randomize ulang hoki
            */

            horseObjects.forEach(
                horse=>{

                    horse.distance = 0;

                    horse.finished = false;

                    horse.group.position.x =
                        -TRACK_LENGTH/2 + 25;

                    horse.luck =
                        random(.86,1.14);

                }
            );


            updateLeaderboard();

            startRace();

        }
    );


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    if(!horseObjects.length)
        return;


    const sorted =
        [...horseObjects]
        .sort(
            (a,b)=>
                b.distance -
                a.distance
        );


    const leader =
        sorted[0];


    const targetX =
        leader.group.position.x;


    /*
        Camera mengikuti
        pemimpin tetapi
        tetap jauh dari arena.
    */

    const desiredX =
        THREE.MathUtils.clamp(
            targetX - 90,
            -TRACK_LENGTH/2 - 50,
            TRACK_LENGTH/2 + 80
        );


    camera.position.x +=
        (
            desiredX -
            camera.position.x
        ) * .035;


    camera.position.y +=
        (
            105 -
            camera.position.y
        ) * .035;


    camera.position.z +=
        (
            135 -
            camera.position.z
        ) * .035;


    const lookX =
        targetX + 35;


    const target =
        new THREE.Vector3(
            lookX,
            0,
            0
        );


    camera.lookAt(target);

}


/* =========================================================
   LOADING
========================================================= */

function updateLoading(
    percent,
    text
){

    const p =
        THREE.MathUtils.clamp(
            percent,
            0,
            100
        );


    document
        .getElementById(
            "loadingProgress"
        )
        .style.width =
        p + "%";


    document
        .getElementById(
            "loadingText"
        )
        .textContent =
        text;
}


/* =========================================================
   PREPARE GAME
========================================================= */

async function prepareGame(){

    updateLoading(
        5,
        "Menyiapkan arena..."
    );


    /*
        Load assets satu per satu.

        IMPORTANT:
        Kalau satu GLB error,
        game TIDAK berhenti.
    */

    await loadTrees();


    await loadRocks();


    updateLoading(
        82,
        "Menata lingkungan..."
    );


    /*
        Buat environment
        hanya kalau asset
        tersedia.
    */

    createEnvironment();


    updateLoading(
        90,
        "Menyiapkan kuda..."
    );


    createHorses();


    updateLoading(
        97,
        "Menyiapkan balapan..."
    );


    updateLeaderboard();


    /*
        Beri waktu browser
        menyelesaikan rendering.
    */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                500
            )
    );


    updateLoading(
        100,
        "Arena siap!"
    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                400
            )
    );


    document
        .getElementById(
            "loading"
        )
        .classList
        .add("hide");


    /*
        Start race
    */

    startRace();

}


/* =========================================================
   ANIMATION LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    updateRace();

    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );

    }
);


/* =========================================================
   START
========================================================= */

prepareGame()
.catch(
    error=>{

        console.error(
            "Game initialization error:",
            error
        );


        /*
            Bahkan jika terjadi
            error yang tidak terduga,
            loading tidak akan
            permanen stuck.
        */

        updateLoading(
            100,
            "Arena siap"
        );


        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "loading"
                    )
                    .classList
                    .add("hide");


                if(
                    horseObjects.length === 0
                ){

                    createHorses();

                }


                updateLeaderboard();

                startRace();

            },
            600
        );

    }
);

</script>
