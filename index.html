<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horse Racing 3D — V13</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#9bc7a0;
}

body{
    position:relative;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* =========================
   TOP TITLE
========================= */

#titleBox{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    padding:16px 20px;
    text-align:center;

    background:rgba(25,35,30,.68);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;

    color:white;
    z-index:20;

    box-shadow:
        0 10px 30px rgba(0,0,0,.22);
}

#titleBox h1{
    font-size:20px;
    letter-spacing:4px;
    font-weight:800;
}

#titleBox p{
    margin-top:6px;
    font-size:11px;
    opacity:.7;
    letter-spacing:1px;
}

/* =========================
   LIVE POSITION
========================= */

#positionPanel{
    position:fixed;
    top:20px;
    right:18px;

    width:225px;
    padding:14px;

    background:rgba(25,35,30,.68);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;

    color:white;
    z-index:20;

    box-shadow:
        0 10px 30px rgba(0,0,0,.2);
}

.panelTitle{
    font-size:14px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:10px;
}

.positionRow{
    height:29px;
    display:flex;
    align-items:center;

    padding:0 8px;
    margin-bottom:3px;

    border-radius:7px;

    font-size:11px;
    color:#e9eee9;
}

.positionRow:nth-child(2){
    background:rgba(255,255,255,.12);
}

.positionNumber{
    width:25px;
    font-weight:800;
}

.positionName{
    flex:1;
    font-weight:600;
}

.positionDistance{
    font-size:10px;
    opacity:.7;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle at center,
            #a7cfa9 0%,
            #719477 100%
        );

    z-index:100;
    color:white;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#loading.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loadingHorse{
    font-size:52px;
    margin-bottom:15px;
    animation:horseRun .8s infinite alternate ease-in-out;
}

@keyframes horseRun{
    from{
        transform:translateX(-8px);
    }

    to{
        transform:translateX(8px);
    }
}

#loadingText{
    font-size:14px;
    letter-spacing:1px;
    margin-bottom:12px;
}

.progressOuter{
    width:250px;
    height:7px;

    background:rgba(255,255,255,.22);
    border-radius:20px;
    overflow:hidden;
}

#progressBar{
    width:8%;
    height:100%;

    background:white;
    border-radius:20px;

    transition:width .25s ease;
}

#assetStatus{
    margin-top:8px;
    font-size:10px;
    opacity:.7;
}

/* =========================
   START BUTTON
========================= */

#startButton{
    position:fixed;
    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    padding:13px 30px;

    border:none;
    border-radius:30px;

    background:rgba(25,35,30,.82);
    color:white;

    font-weight:800;
    letter-spacing:1px;

    cursor:pointer;
    z-index:30;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

    transition:.2s;
}

#startButton:hover{
    transform:translateX(-50%) scale(1.05);
    background:#263a2d;
}

#startButton:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   COUNTDOWN
========================= */

#countdown{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;

    z-index:40;

    color:white;
    font-size:100px;
    font-weight:900;

    text-shadow:
        0 8px 30px rgba(0,0,0,.4);

    opacity:0;
}

#countdown.show{
    animation:countAnim .8s ease;
}

@keyframes countAnim{
    0%{
        opacity:0;
        transform:scale(.5);
    }

    30%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.4);
    }
}

/* =========================
   FINISH
========================= */

#finishScreen{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.38);
    backdrop-filter:blur(5px);

    opacity:0;
    visibility:hidden;

    z-index:80;

    transition:.4s;
}

#finishScreen.show{
    opacity:1;
    visibility:visible;
}

.finishCard{
    width:min(380px,90vw);

    padding:28px;

    text-align:center;

    background:rgba(25,35,30,.9);
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;

    color:white;

    box-shadow:
        0 20px 70px rgba(0,0,0,.4);
}

.finishCard .trophy{
    font-size:55px;
}

.finishCard h2{
    margin-top:8px;
    font-size:25px;
    letter-spacing:2px;
}

.finishCard p{
    margin-top:8px;
    opacity:.7;
}

#winnerName{
    margin-top:15px;
    font-size:27px;
    font-weight:900;
}

#restartButton{
    margin-top:20px;

    padding:12px 25px;

    border:0;
    border-radius:25px;

    background:white;
    color:#25352b;

    font-weight:800;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #titleBox{
        top:12px;
        width:250px;
        padding:12px;
    }

    #titleBox h1{
        font-size:15px;
        letter-spacing:2px;
    }

    #positionPanel{
        top:12px;
        right:10px;
        width:185px;
        padding:10px;
    }

    .positionRow{
        height:25px;
        font-size:10px;
    }

    #startButton{
        bottom:15px;
    }

    #countdown{
        font-size:75px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- LOADING -->
<div id="loading">

    <div class="loadingHorse">🏇</div>

    <div id="loadingText">
        Menyiapkan Arena...
    </div>

    <div class="progressOuter">
        <div id="progressBar"></div>
    </div>

    <div id="assetStatus">
        Arena sedang disiapkan...
    </div>

</div>

<!-- TITLE -->
<div id="titleBox">
    <h1>🏇 HORSE RACING</h1>
    <p id="raceStatus">READY</p>
</div>

<!-- LIVE POSITION -->
<div id="positionPanel">

    <div class="panelTitle">
        🏆 LIVE POSITION
    </div>

    <div id="positionList"></div>

</div>

<!-- COUNTDOWN -->
<div id="countdown"></div>

<!-- START -->
<button id="startButton" disabled>
    MULAI BALAPAN
</button>

<!-- FINISH -->
<div id="finishScreen">

    <div class="finishCard">

        <div class="trophy">
            🏆
        </div>

        <h2>RACE FINISHED</h2>

        <p>Pemenang balapan</p>

        <div id="winnerName">
            -
        </div>

        <button id="restartButton">
            BALAP LAGI
        </button>

    </div>

</div>

<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   CONFIG
========================================================= */

const TRACK_LENGTH = 600;

const START_X = -270;

const FINISH_X = 270;

const TRACK_WIDTH = 34;

const TREE_PATH = "./assets/trees/";


/* =========================================================
   ASSET LIST
========================================================= */

const TREE_FILES = [

    "quaternius_cc0-common-tree-846.glb",
    "quaternius_cc0-common-tree-838.glb",
    "quaternius_cc0-common-tree-837.glb",
    "quaternius_cc0-common-tree-839.glb",
    "quaternius_cc0-common-tree-835.glb"

];

const ROCK_FILES = [

    "quaternius_cc0-mossy-rock-1304.glb",
    "quaternius_cc0-mossy-rock-1303.glb",
    "quaternius_cc0-mossy-rock-1309.glb",
    "quaternius_cc0-mossy-rock-1308.glb"

];


/* =========================================================
   HORSES
========================================================= */

const HORSE_NAMES = [

    "Shadow",
    "Golden Flash",
    "Blaze",
    "Lightning",
    "Thunder",
    "Black Storm",
    "Wild Runner",
    "Red Fury"

];

const HORSE_COLORS = [

    0x111111,
    0xd19a26,
    0x8c3f20,
    0x8d8d8d,
    0x49342a,
    0x171717,
    0x70412a,
    0x8d2d19

];


/* =========================================================
   GLOBAL
========================================================= */

let scene;
let camera;
let renderer;
let controls;

let clock;

let horses = [];

let treeTemplates = [];
let rockTemplates = [];

let treeGroup;
let rockGroup;

let raceStarted = false;
let raceFinished = false;

let assetsLoaded = 0;

const totalAssets =
    TREE_FILES.length +
    ROCK_FILES.length;


/* =========================================================
   DOM
========================================================= */

const loading =
    document.getElementById("loading");

const progressBar =
    document.getElementById("progressBar");

const loadingText =
    document.getElementById("loadingText");

const assetStatus =
    document.getElementById("assetStatus");

const startButton =
    document.getElementById("startButton");

const countdown =
    document.getElementById("countdown");

const raceStatus =
    document.getElementById("raceStatus");

const positionList =
    document.getElementById("positionList");

const finishScreen =
    document.getElementById("finishScreen");

const winnerName =
    document.getElementById("winnerName");

const restartButton =
    document.getElementById("restartButton");


/* =========================================================
   HELPERS
========================================================= */

function random(min,max){

    return Math.random() * (max-min) + min;

}

function randomInt(min,max){

    return Math.floor(
        Math.random()*(max-min+1)+min
    );

}

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(percent){

    percent =
        clamp(percent,0,100);

    progressBar.style.width =
        percent + "%";

}


/* =========================================================
   SCENE
========================================================= */

function createScene(){

    scene =
        new THREE.Scene();

    /*
       TIDAK ADA GUNUNG.
       Background hanya langit.
    */

    scene.background =
        new THREE.Color(0x9bc9df);

    scene.fog =
        new THREE.Fog(
            0x9bc9df,
            180,
            700
        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            55,
            window.innerWidth /
            window.innerHeight,
            .1,
            1500
        );

    camera.position.set(
        -320,
        45,
        65
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:"high-performance"
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.7
        )
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.1;

    document
        .getElementById("game")
        .appendChild(renderer.domElement);


    /* LIGHT */

    const hemi =
        new THREE.HemisphereLight(
            0xdff5ff,
            0x6b7c55,
            2.1
        );

    scene.add(hemi);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        -100,
        180,
        80
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    sun.shadow.camera.left = -400;
    sun.shadow.camera.right = 400;
    sun.shadow.camera.top = 250;
    sun.shadow.camera.bottom = -250;

    scene.add(sun);


    /* CONTROLS */

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.enablePan = false;

    controls.minDistance = 35;
    controls.maxDistance = 180;

    controls.maxPolarAngle =
        Math.PI * .46;

}


/* =========================================================
   GROUND
========================================================= */

function createGround(){

    const groundGeo =
        new THREE.PlaneGeometry(
            1200,
            700
        );

    const groundMat =
        new THREE.MeshStandardMaterial({
            color:0x91c981,
            roughness:1
        });

    const ground =
        new THREE.Mesh(
            groundGeo,
            groundMat
        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.position.y =
        -0.05;

    ground.receiveShadow = true;

    scene.add(ground);

}


/* =========================================================
   TRACK
========================================================= */

function createTrack(){

    /* MAIN TRACK */

    const trackGeo =
        new THREE.BoxGeometry(
            TRACK_LENGTH,
            .35,
            TRACK_WIDTH
        );

    const trackMat =
        new THREE.MeshStandardMaterial({
            color:0xc99a72,
            roughness:.95
        });

    const track =
        new THREE.Mesh(
            trackGeo,
            trackMat
        );

    track.position.set(
        0,
        .12,
        0
    );

    track.receiveShadow = true;

    scene.add(track);


    /* TRACK LANES */

    for(let i=-3;i<=3;i++){

        const lineGeo =
            new THREE.BoxGeometry(
                TRACK_LENGTH,
                .015,
                .055
            );

        const lineMat =
            new THREE.MeshBasicMaterial({
                color:0xffffff,
                transparent:true,
                opacity:.18
            });

        const line =
            new THREE.Mesh(
                lineGeo,
                lineMat
            );

        line.position.set(
            0,
            .31,
            i * 4.2
        );

        scene.add(line);

    }


    /* SIDE GRASS */

    createGrassSide(
        TRACK_LENGTH,
        -26
    );

    createGrassSide(
        TRACK_LENGTH,
        26
    );


    /* FENCES */

    createFence(-20);

    createFence(20);


    /* START */

    createStartLine();


    /* FINISH */

    createFinishLine();

}


function createGrassSide(length,z){

    const geo =
        new THREE.BoxGeometry(
            length,
            .2,
            16
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:0x8fc77f,
            roughness:1
        });

    const mesh =
        new THREE.Mesh(
            geo,
            mat
        );

    mesh.position.set(
        0,
        .05,
        z
    );

    mesh.receiveShadow = true;

    scene.add(mesh);

}


function createFence(z){

    const group =
        new THREE.Group();

    for(
        let x=START_X;
        x<=FINISH_X;
        x+=12
    ){

        const postGeo =
            new THREE.CylinderGeometry(
                .08,
                .08,
                2.2,
                8
            );

        const postMat =
            new THREE.MeshStandardMaterial({
                color:0xf4f4f4
            });

        const post =
            new THREE.Mesh(
                postGeo,
                postMat
            );

        post.position.set(
            x,
            1.1,
            z
        );

        post.castShadow = true;

        group.add(post);


        for(const y of [.65,1.35]){

            const railGeo =
                new THREE.BoxGeometry(
                    12,
                    .07,
                    .07
                );

            const rail =
                new THREE.Mesh(
                    railGeo,
                    postMat
                );

            rail.position.set(
                x+6,
                y,
                z
            );

            group.add(rail);

        }

    }

    scene.add(group);

}


/* =========================================================
   START / FINISH
========================================================= */

function createStartLine(){

    const geo =
        new THREE.BoxGeometry(
            .6,
            .03,
            TRACK_WIDTH
        );

    const mat =
        new THREE.MeshBasicMaterial({
            color:0xffffff
        });

    const line =
        new THREE.Mesh(
            geo,
            mat
        );

    line.position.set(
        START_X,
        .34,
        0
    );

    scene.add(line);

}


function createFinishLine(){

    const group =
        new THREE.Group();


    for(
        let z=-TRACK_WIDTH/2;
        z<TRACK_WIDTH/2;
        z+=2
    ){

        const geo =
            new THREE.BoxGeometry(
                1,
                .04,
                2
            );

        const mat =
            new THREE.MeshBasicMaterial({
                color:
                    Math.round(z/2)%2===0
                    ? 0xffffff
                    : 0x111111
            });

        const tile =
            new THREE.Mesh(
                geo,
                mat
            );

        tile.position.set(
            FINISH_X,
            .35,
            z
        );

        group.add(tile);

    }


    /* FINISH POLES */

    const poleMat =
        new THREE.MeshStandardMaterial({
            color:0xffffff
        });

    for(const z of [-18,18]){

        const poleGeo =
            new THREE.CylinderGeometry(
                .12,
                .12,
                8,
                8
            );

        const pole =
            new THREE.Mesh(
                poleGeo,
                poleMat
            );

        pole.position.set(
            FINISH_X,
            4,
            z
        );

        pole.castShadow = true;

        group.add(pole);

    }


    /* FINISH BANNER */

    const bannerGeo =
        new THREE.BoxGeometry(
            .2,
            2.5,
            36
        );

    const bannerMat =
        new THREE.MeshStandardMaterial({
            color:0x202820
        });

    const banner =
        new THREE.Mesh(
            bannerGeo,
            bannerMat
        );

    banner.position.set(
        FINISH_X,
        7,
        0
    );

    group.add(banner);


    scene.add(group);

}


/* =========================================================
   HORSE
========================================================= */

function createHorse(color){

    const horse =
        new THREE.Group();


    const material =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.65
        });


    /* BODY */

    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .65,
                1.8,
                6,
                10
            ),
            material
        );

    body.rotation.z =
        Math.PI / 2;

    body.position.y =
        1.8;

    body.castShadow = true;

    horse.add(body);


    /* NECK */

    const neck =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35,
                .5,
                1.35,
                8
            ),
            material
        );

    neck.rotation.z =
        -.35;

    neck.position.set(
        1.05,
        2.4,
        0
    );

    neck.castShadow = true;

    horse.add(neck);


    /* HEAD */

    const head =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .85,
                .5,
                .45
            ),
            material
        );

    head.position.set(
        1.7,
        2.85,
        0
    );

    head.castShadow = true;

    horse.add(head);


    /* SNOUT */

    const snout =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .55,
                .3,
                .35
            ),
            material
        );

    snout.position.set(
        2.2,
        2.72,
        0
    );

    snout.castShadow = true;

    horse.add(snout);


    /* EARS */

    for(const z of [-.18,.18]){

        const ear =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    .13,
                    .45,
                    6
                ),
                material
            );

        ear.position.set(
            1.55,
            3.25,
            z
        );

        ear.rotation.x =
            z > 0 ? -.2 : .2;

        horse.add(ear);

    }


    /* LEGS */

    const legs = [];

    const legPositions = [

        [-.75,.0,-.32],
        [-.75,.0,.32],
        [.65,.0,-.32],
        [.65,.0,.32]

    ];


    for(const p of legPositions){

        const leg =
            new THREE.Group();

        leg.position.set(
            p[0],
            1.35,
            p[2]
        );


        const upper =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .12,
                    .14,
                    1.15,
                    7
                ),
                material
            );

        upper.position.y =
            -.45;

        upper.castShadow = true;

        leg.add(upper);


        const hoofMat =
            new THREE.MeshStandardMaterial({
                color:0x181818
            });

        const hoof =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .25,
                    .18,
                    .28
                ),
                hoofMat
            );

        hoof.position.set(
            0,
            -1.05,
            0
        );

        hoof.castShadow = true;

        leg.add(hoof);


        horse.add(leg);

        legs.push(leg);

    }


    /* TAIL */

    const tail =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .18,
                1.25,
                7
            ),
            material
        );

    tail.rotation.z =
        -Math.PI/2;

    tail.position.set(
        -1.45,
        2,
        0
    );

    tail.castShadow = true;

    horse.add(tail);


    horse.userData.legs = legs;
    horse.userData.tail = tail;

    horse.userData.phase =
        random(0,Math.PI*2);

    return horse;

}


/* =========================================================
   CREATE HORSES
========================================================= */

function createHorses(){

    horses = [];


    for(let i=0;i<8;i++){

        const horse =
            createHorse(
                HORSE_COLORS[i]
            );


        horse.position.set(
            START_X,
            .5,
            (i-3.5)*3.8
        );


        /*
           HOKI / RANDOM SPEED

           Setiap balapan menghasilkan
           kemampuan berbeda.
        */

        horse.userData.baseSpeed =
            random(.065,.095);

        horse.userData.hype =
            random(.85,1.2);

        horse.userData.progress =
            0;

        horse.userData.finished =
            false;

        horse.userData.rank =
            0;

        horse.userData.name =
            HORSE_NAMES[i];

        horse.userData.index =
            i;


        scene.add(horse);

        horses.push(horse);

    }

}


/* =========================================================
   LOAD GLB
========================================================= */

const gltfLoader =
    new GLTFLoader();


function loadGLB(
    file,
    type
){

    return new Promise(
        resolve => {

            const url =
                TREE_PATH + file;


            gltfLoader.load(

                url,

                gltf => {

                    const model =
                        gltf.scene;


                    model.traverse(
                        child => {

                            if(child.isMesh){

                                child.castShadow = true;

                                child.receiveShadow = true;

                                if(child.material){

                                    child.material.side =
                                        THREE.FrontSide;

                                }

                            }

                        }
                    );


                    if(type === "tree"){

                        normalizeAsset(
                            model,
                            8
                        );

                        treeTemplates.push(
                            model
                        );

                    }else{

                        normalizeAsset(
                            model,
                            3
                        );

                        rockTemplates.push(
                            model
                        );

                    }


                    assetsLoaded++;

                    updateAssetProgress();

                    resolve(true);

                },

                undefined,

                error => {

                    console.warn(
                        "GLB gagal:",
                        file,
                        error
                    );

                    /*
                       JANGAN BIARKAN SATU GLB
                       MENGHENTIKAN GAME.
                    */

                    assetsLoaded++;

                    updateAssetProgress();

                    resolve(false);

                }

            );

        }
    );

}


/* =========================================================
   NORMALIZE ASSET
========================================================= */

function normalizeAsset(
    object,
    targetHeight
){

    const box =
        new THREE.Box3()
            .setFromObject(object);

    const size =
        new THREE.Vector3();

    box.getSize(size);


    if(size.y <= 0){
        return;
    }


    const scale =
        targetHeight / size.y;

    object.scale.setScalar(
        scale
    );


    const newBox =
        new THREE.Box3()
            .setFromObject(object);

    const center =
        new THREE.Vector3();

    newBox.getCenter(center);


    object.position.x -= center.x;

    object.position.z -= center.z;

    object.position.y -= newBox.min.y;

}


/* =========================================================
   ASSET PROGRESS
========================================================= */

function updateAssetProgress(){

    const percent =
        45 +
        (
            assetsLoaded /
            totalAssets
        ) * 50;

    updateProgress(percent);


    assetStatus.textContent =
        `Aset 3D: ${assetsLoaded}/${totalAssets}`;

}


/* =========================================================
   LOAD ALL ASSETS
========================================================= */

async function loadEnvironmentAssets(){

    /*
       Pohon dan batu dimuat satu per satu.

       Arena sudah berjalan,
       jadi proses ini TIDAK mengunci game.
    */

    for(const file of TREE_FILES){

        await loadGLB(
            file,
            "tree"
        );

    }


    for(const file of ROCK_FILES){

        await loadGLB(
            file,
            "rock"
        );

    }


    /*
       Setelah aset yang berhasil dimuat
       tersedia, kita spawn.
    */

    spawnEnvironment();


    updateProgress(100);

    loadingText.textContent =
        "Arena Siap!";

    assetStatus.textContent =
        `${treeTemplates.length} pohon • ${rockTemplates.length} batu`;


    setTimeout(() => {

        loading.classList.add(
            "hidden"
        );

    },500);

}


/* =========================================================
   CLONE MODEL
========================================================= */

function cloneModel(
    original
){

    const clone =
        original.clone(true);


    clone.traverse(
        child => {

            if(child.isMesh){

                child.castShadow = true;

                child.receiveShadow = true;

            }

        }
    );


    return clone;

}


/* =========================================================
   SPAWN TREES
========================================================= */

function spawnEnvironment(){

    if(treeGroup){

        scene.remove(treeGroup);

    }

    if(rockGroup){

        scene.remove(rockGroup);

    }


    treeGroup =
        new THREE.Group();

    rockGroup =
        new THREE.Group();


    /*
       POHON
       Hanya di luar pagar.
    */

    if(treeTemplates.length){

        for(
            let x=START_X+5;
            x<FINISH_X-5;
            x+=random(12,22)
        ){

            const template =
                treeTemplates[
                    randomInt(
                        0,
                        treeTemplates.length-1
                    )
                ];


            const tree =
                cloneModel(template);


            const side =
                Math.random()<.5
                ? -1
                : 1;


            const z =
                side *
                random(
                    30,
                    48
                );


            const scale =
                random(.75,1.3);

            tree.scale.multiplyScalar(
                scale
            );


            tree.rotation.y =
                random(
                    0,
                    Math.PI*2
                );


            tree.position.set(
                x,
                0,
                z
            );


            treeGroup.add(tree);

        }

    }


    /*
       BATU
    */

    if(rockTemplates.length){

        for(
            let x=START_X+10;
            x<FINISH_X-10;
            x+=random(18,32)
        ){

            const template =
                rockTemplates[
                    randomInt(
                        0,
                        rockTemplates.length-1
                    )
                ];


            const rock =
                cloneModel(template);


            const side =
                Math.random()<.5
                ? -1
                : 1;


            rock.position.set(

                x + random(-5,5),

                0,

                side *
                random(27,39)

            );


            const scale =
                random(.65,1.25);

            rock.scale.multiplyScalar(
                scale
            );


            rock.rotation.y =
                random(
                    0,
                    Math.PI*2
                );


            rockGroup.add(rock);

        }

    }


    scene.add(treeGroup);

    scene.add(rockGroup);

}


/* =========================================================
   START COUNTDOWN
========================================================= */

function showCountdown(
    value
){

    countdown.textContent =
        value;

    countdown.classList.remove(
        "show"
    );

    void countdown.offsetWidth;

    countdown.classList.add(
        "show"
    );

}


/* =========================================================
   START RACE
========================================================= */

async function startRace(){

    if(raceStarted){
        return;
    }


    raceStarted = true;

    startButton.disabled = true;

    raceStatus.textContent =
        "READY";


    showCountdown("3");

    await wait(850);

    showCountdown("2");

    await wait(850);

    showCountdown("1");

    await wait(850);

    showCountdown("GO!");

    raceStatus.textContent =
        "RACING";

    raceStarted = true;

}


/* =========================================================
   WAIT
========================================================= */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   UPDATE HORSES
========================================================= */

function updateRace(delta){

    if(
        !raceStarted ||
        raceFinished
    ){
        return;
    }


    for(const horse of horses){

        if(
            horse.userData.finished
        ){
            continue;
        }


        /*
           SPEED RANDOM / HOKI
        */

        let speed =
            horse.userData.baseSpeed *
            horse.userData.hype;


        /*
           RANDOM MOMENTUM
           supaya tidak monoton.
        */

        speed *=
            0.96 +
            Math.random()*.08;


        /*
           Sedikit akselerasi
           berdasarkan progress.
        */

        if(
            horse.userData.progress < .2
        ){

            speed *= .92;

        }


        horse.position.x +=
            speed *
            delta *
            60;


        horse.userData.progress =
            (
                horse.position.x -
                START_X
            ) /
            (
                FINISH_X -
                START_X
            );


        /*
           ANIMASI KAKI
        */

        const legs =
            horse.userData.legs;

        const phase =
            performance.now()*.015 +
            horse.userData.phase;


        legs.forEach(
            (leg,index) => {

                leg.rotation.z =
                    Math.sin(
                        phase +
                        index*Math.PI
                    )*.45;

            }
        );


        /*
           BODY BOUNCE
        */

        horse.position.y =
            .5 +
            Math.abs(
                Math.sin(
                    phase*2
                )
            )*.07;


        /*
           FINISH
        */

        if(
            horse.position.x >=
            FINISH_X
        ){

            horse.position.x =
                FINISH_X;

            horse.userData.finished =
                true;

        }

    }


    /*
       CEK SEMUA SELESAI
    */

    const finishedCount =
        horses.filter(
            h => h.userData.finished
        ).length;


    if(
        finishedCount ===
        horses.length
    ){

        finishRace();

    }

}


/* =========================================================
   SORT POSITION
========================================================= */

function updatePositions(){

    const sorted =
        [...horses].sort(
            (a,b) =>
                b.position.x -
                a.position.x
        );


    sorted.forEach(
        (horse,index) => {

            horse.userData.rank =
                index+1;

        }
    );


    positionList.innerHTML =
        "";


    sorted.forEach(
        (horse,index) => {

            const distance =
                clamp(
                    (
                        horse.position.x -
                        START_X
                    ),
                    0,
                    FINISH_X-START_X
                );


            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "positionRow";


            row.innerHTML = `

                <div class="positionNumber">
                    ${index+1}
                </div>

                <div class="positionName">
                    ${horse.userData.name}
                </div>

                <div class="positionDistance">
                    ${Math.round(distance)}m
                </div>

            `;


            positionList.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   FINISH RACE
========================================================= */

function finishRace(){

    if(raceFinished){
        return;
    }


    raceFinished = true;

    raceStatus.textContent =
        "FINISH";


    const sorted =
        [...horses].sort(
            (a,b) =>
                b.position.x -
                a.position.x
        );


    const winner =
        sorted[0];


    winnerName.textContent =
        "🏇 " +
        winner.userData.name;


    finishScreen.classList.add(
        "show"
    );

}


/* =========================================================
   RESTART
========================================================= */

function restartRace(){

    finishScreen.classList.remove(
        "show"
    );


    raceStarted = false;

    raceFinished = false;


    horses.forEach(
        (horse,index) => {

            horse.position.x =
                START_X;

            horse.position.z =
                (index-3.5)*3.8;

            horse.userData.progress =
                0;

            horse.userData.finished =
                false;

            /*
               HOKI BARU SETIAP RACE
            */

            horse.userData.baseSpeed =
                random(.065,.095);

            horse.userData.hype =
                random(.85,1.2);

        }
    );


    raceStatus.textContent =
        "READY";


    startButton.disabled =
        false;

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    if(!horses.length){
        return;
    }


    /*
       Ambil kuda terdepan.
    */

    const leader =
        [...horses].sort(
            (a,b) =>
                b.position.x -
                a.position.x
        )[0];


    if(
        raceStarted &&
        !raceFinished
    ){

        const targetX =
            leader.position.x;


        camera.position.x +=
            (
                targetX -
                45 -
                camera.position.x
            ) * .035;


        camera.position.z +=
            (
                48 -
                camera.position.z
            ) * .025;


        camera.position.y +=
            (
                35 -
                camera.position.y
            ) * .025;


        controls.target.x +=
            (
                targetX -
                controls.target.x
            ) * .04;


        controls.target.y +=
            (
                1 -
                controls.target.y
            ) * .04;


        controls.target.z +=
            (
                0 -
                controls.target.z
            ) * .04;

    }

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    updateRace(delta);

    updatePositions();

    updateCamera();

    controls.update();

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   BUTTONS
========================================================= */

startButton.addEventListener(
    "click",
    startRace
);

restartButton.addEventListener(
    "click",
    restartRace
);


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

    clock =
        new THREE.Clock();


    /* SCENE */

    createScene();

    updateProgress(10);


    /* GROUND */

    createGround();

    updateProgress(20);


    /* TRACK */

    createTrack();

    updateProgress(30);


    /* HORSES */

    createHorses();

    updateProgress(45);


    /*
       GAME SUDAH SIAP.

       Jangan menunggu GLB.
    */

    startButton.disabled =
        false;

    loadingText.textContent =
        "Arena Siap";

    assetStatus.textContent =
        "Memuat pohon & batu di background...";


    /*
       Hilangkan loading sekarang.
    */

    setTimeout(() => {

        loading.classList.add(
            "hidden"
        );

    },300);


    /*
       LOAD GLB DI BACKGROUND

       Ini tidak memblokir game.
    */

    loadEnvironmentAssets();


    /*
       RENDER LOOP
    */

    animate();

}


/* =========================================================
   RUN
========================================================= */

init();

</script>
