<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Horse Racing 3D — V11</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#071009;
}

canvas{
    display:block;
}


/* =========================================================
   LOADING
========================================================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:white;

    background:
        radial-gradient(
            circle at center,
            #294b34 0%,
            #071009 75%
        );

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loading-title{
    font-size:clamp(32px,6vw,64px);
    font-weight:900;
    letter-spacing:6px;
}

.loading-subtitle{
    margin-top:12px;
    color:rgba(255,255,255,.65);
}

.loading-bar{
    width:min(350px,75vw);
    height:7px;
    margin-top:25px;
    overflow:hidden;
    border-radius:20px;
    background:rgba(255,255,255,.12);
}

#loading-progress{
    width:0%;
    height:100%;
    background:white;
    transition:width .2s ease;
}

.loading-percent{
    margin-top:10px;
    font-size:12px;
    color:rgba(255,255,255,.5);
}


/* =========================================================
   SETUP
========================================================= */

#setupPanel{
    position:fixed;
    inset:0;
    z-index:9000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(42,78,52,.96),
            rgba(4,10,6,.98)
        );

    overflow:auto;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#setupPanel.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.setup-box{
    width:min(900px,94vw);
    max-height:94vh;
    overflow:auto;

    padding:28px;

    color:white;

    border-radius:25px;

    border:1px solid rgba(255,255,255,.15);

    background:
        linear-gradient(
            145deg,
            rgba(30,45,33,.96),
            rgba(5,12,7,.98)
        );

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);

    backdrop-filter:blur(20px);
}

.setup-title{
    text-align:center;
    font-size:28px;
    font-weight:1000;
    letter-spacing:3px;
}

.setup-subtitle{
    text-align:center;
    margin-top:7px;
    color:rgba(255,255,255,.55);
    font-size:12px;
}

.horse-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:25px;
}

.horse-card{
    padding:14px;

    border-radius:15px;

    background:rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.08);

    transition:.2s;
}

.horse-card:hover{
    background:rgba(255,255,255,.1);
    transform:translateY(-2px);
}

.horse-number{
    font-size:10px;
    color:rgba(255,255,255,.45);
    margin-bottom:8px;
}

.horse-preview{
    width:100%;
    height:8px;
    border-radius:20px;
    margin-bottom:10px;
}

.horse-input{
    width:100%;

    padding:9px 10px;

    border:1px solid rgba(255,255,255,.1);

    outline:none;

    border-radius:9px;

    background:rgba(0,0,0,.25);

    color:white;

    font-size:12px;
}

.horse-input:focus{
    border-color:rgba(255,255,255,.45);
}

.color-select{
    width:100%;
    margin-top:7px;

    padding:7px;

    border:1px solid rgba(255,255,255,.1);

    border-radius:8px;

    background:#152218;

    color:white;

    font-size:11px;
}

#startRaceButton{
    width:100%;

    margin-top:20px;

    padding:14px;

    border:0;

    border-radius:13px;

    background:white;

    color:#101510;

    font-size:14px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

#startRaceButton:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 30px
        rgba(255,255,255,.15);
}


/* =========================================================
   COUNTDOWN
========================================================= */

#countdown{
    position:fixed;
    inset:0;

    z-index:500;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;

    opacity:0;

    color:white;

    font-size:clamp(90px,20vw,220px);

    font-weight:1000;

    text-shadow:
        0 10px 50px rgba(0,0,0,.8);

    transition:.15s;
}

#countdown.show{
    opacity:1;
}


/* =========================================================
   HUD
========================================================= */

#topHud{
    position:fixed;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:100;

    min-width:320px;

    padding:13px 22px;

    color:white;
    text-align:center;

    border-radius:16px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(0,0,0,.38);

    backdrop-filter:blur(15px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);
}

.race-title{
    font-size:16px;
    font-weight:900;
    letter-spacing:3px;
}

.race-status{
    margin-top:5px;
    font-size:11px;
    color:rgba(255,255,255,.6);
}


/* =========================================================
   LEADERBOARD
========================================================= */

#leaderboard{
    position:fixed;

    top:18px;
    right:18px;

    z-index:100;

    width:225px;

    padding:14px;

    color:white;

    border-radius:16px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(0,0,0,.42);

    backdrop-filter:blur(15px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);
}

.lb-title{
    margin-bottom:10px;

    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
}

.lb-row{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:7px;

    margin-top:3px;

    border-radius:7px;

    font-size:11px;

    color:rgba(255,255,255,.7);

    transition:.2s;
}

.lb-row.leading{
    color:white;

    background:
        rgba(255,255,255,.13);
}

.lb-left{
    display:flex;
    align-items:center;
    gap:7px;

    min-width:0;
}

.lb-number{
    width:18px;
    text-align:center;
    font-weight:bold;
}

.lb-player{
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    max-width:120px;
}

.lb-distance{
    color:rgba(255,255,255,.5);
    white-space:nowrap;
}


/* =========================================================
   EVENT
========================================================= */

#eventText{
    position:fixed;

    left:50%;
    top:24%;

    transform:translate(-50%,-50%);

    z-index:200;

    pointer-events:none;

    color:white;

    font-size:clamp(16px,3vw,28px);

    font-weight:1000;

    letter-spacing:2px;

    text-shadow:
        0 4px 20px rgba(0,0,0,.9);

    opacity:0;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

#eventText.show{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1.05);
}


/* =========================================================
   START PANEL
========================================================= */

#startPanel{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    z-index:100;

    padding:12px 20px;

    color:white;

    font-size:12px;

    border-radius:50px;

    background:
        rgba(0,0,0,.42);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:blur(12px);

    transition:.4s;
}

#startPanel.hidden{
    opacity:0;

    transform:
        translateX(-50%)
        translateY(20px);
}


/* =========================================================
   FINISH
========================================================= */

#finishPanel{
    position:fixed;

    inset:0;

    z-index:800;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    visibility:hidden;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:blur(8px);

    transition:.5s;
}

#finishPanel.show{
    opacity:1;
    visibility:visible;
}

.finish-box{
    width:min(450px,90vw);

    max-height:90vh;

    overflow:auto;

    padding:30px;

    color:white;
    text-align:center;

    border-radius:25px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        linear-gradient(
            145deg,
            rgba(30,45,33,.97),
            rgba(5,12,7,.97)
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.6);
}

.finish-trophy{
    font-size:55px;
}

.finish-title{
    margin-top:8px;

    font-size:28px;

    font-weight:1000;
}

.finish-subtitle{
    margin-top:6px;

    font-size:12px;

    color:rgba(255,255,255,.5);
}

.final-list{
    margin-top:20px;
    text-align:left;
}

.final-row{
    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:10px 12px;

    margin-top:5px;

    border-radius:9px;

    background:
        rgba(255,255,255,.06);

    font-size:13px;
}

.final-row.first{
    background:
        rgba(255,255,255,.15);

    font-weight:900;
}

.final-speed{
    color:rgba(255,255,255,.45);
    font-size:10px;
}

#againButton{
    width:100%;

    margin-top:22px;

    padding:13px;

    border:0;

    border-radius:12px;

    background:white;

    color:#101510;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

#againButton:hover{
    transform:translateY(-2px);
}


/* =========================================================
   CINEMATIC
========================================================= */

#cinematicVignette{
    position:fixed;
    inset:0;

    z-index:20;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.24) 100%
        );

    box-shadow:
        inset 0 0 90px
        rgba(0,0,0,.22);
}

#raceFlash{
    position:fixed;

    inset:0;

    z-index:25;

    pointer-events:none;

    opacity:0;

    background:
        rgba(255,255,255,.28);

    transition:
        opacity .12s ease;
}

#raceVignette{
    position:fixed;

    inset:0;

    z-index:50;

    pointer-events:none;

    box-shadow:
        inset 0 0 140px
        rgba(0,0,0,.35);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .setup-box{
        padding:18px;
    }

    .horse-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .setup-title{
        font-size:21px;
    }

    #topHud{
        top:10px;

        min-width:220px;

        padding:9px 14px;
    }

    .race-title{
        font-size:12px;
    }

    #leaderboard{
        top:70px;
        right:10px;

        width:175px;

        padding:10px;
    }

    .lb-row{
        font-size:9px;
    }

    .lb-player{
        max-width:90px;
    }

    #startPanel{
        bottom:12px;
        font-size:10px;
    }

}


/* =========================================================
   ERROR
========================================================= */

#errorBox{
    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10000;

    width:min(500px,90vw);

    padding:25px;

    display:none;

    color:white;
    text-align:center;

    border-radius:20px;

    background:
        rgba(60,10,10,.95);

    border:
        1px solid
        rgba(255,100,100,.3);
}

#errorBox.show{
    display:block;
}

#errorBox h2{
    margin-bottom:10px;
}

#errorBox p{
    font-size:12px;
    line-height:1.7;
    color:rgba(255,255,255,.7);
}

</style>

<script type="module">

import * as THREE
from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    FBXLoader
} from "three/addons/loaders/FBXLoader.js";

import {
    clone as cloneSkeleton
} from "three/addons/utils/SkeletonUtils.js";


/* =========================================================
   CONFIG
========================================================= */

const HORSE_FILE =
    "./quaternius_cc0-white-horse-1081(1).glb";

const HORSE_COUNT = 8;

const LANE_SPACING = 2.6;

const START_Z = 20;

const FINISH_Z = -280;


/* =========================================================
   TREE ASSETS
========================================================= */

const TREE_PATH =
    "./assets/trees/";

const TREE_FILES = [

    "Birch_2.fbx",
    "Birch_6.fbx",
    "Pine_1.fbx",
    "Pine_3.fbx",
    "Tree_1.fbx",
    "Tree_3.fbx",
    "Tree_5.fbx",
    "Tree_7.fbx"

];


/* =========================================================
   TREE COLOR VARIANTS
========================================================= */

const TREE_COLORS = [

    0x245c2a,
    0x327a38,
    0x4f8f42,
    0x6b9d45,
    0x3d6f2f,
    0x789b4b,
    0x2b5428,
    0x587d36

];


/* =========================================================
   TREE SCALE
========================================================= */

const TREE_MIN_SCALE = .75;

const TREE_MAX_SCALE = 1.45;

const TREE_COUNT = 95;


/* =========================================================
   HORSE COLORS
========================================================= */

const HORSE_COLORS = [

    {
        name:"Chestnut",
        color:0x7b3f22
    },

    {
        name:"Black",
        color:0x171717
    },

    {
        name:"Dark Brown",
        color:0x3b2115
    },

    {
        name:"White",
        color:0xe8e8e8
    },

    {
        name:"Golden",
        color:0xb67b27
    },

    {
        name:"Grey",
        color:0x777777
    },

    {
        name:"Red Brown",
        color:0x8f4528
    },

    {
        name:"Dark Grey",
        color:0x363636
    }

];


/* =========================================================
   HORSE NAMES
========================================================= */

const defaultNames = [

    "Thunder",
    "Black Storm",
    "Lightning",
    "Red Fury",
    "Golden Flash",
    "Shadow",
    "Blaze",
    "Wild Runner"

];


/* =========================================================
   GLOBAL
========================================================= */

let scene;

let camera;

let renderer;

let clock;

let horses = [];

let treeModels = [];

let raceStarted = false;

let raceFinished = false;

let countdownRunning = false;

let finishOrder = [];

let dustMesh;

let dustParticles = [];

let cameraTarget =
    new THREE.Vector3();

let cameraLook =
    new THREE.Vector3();

let cameraShake = 0;

let eventTimer = null;


/* =========================================================
   DOM
========================================================= */

const loading =
    document.getElementById("loading");

const progress =
    document.getElementById("loading-progress");

const loadingPercent =
    document.querySelector(".loading-percent");

const setupPanel =
    document.getElementById("setupPanel");

const horseGrid =
    document.getElementById("horseGrid");

const startRaceButton =
    document.getElementById("startRaceButton");

const countdown =
    document.getElementById("countdown");

const raceStatus =
    document.getElementById("raceStatus");

const leaderRows =
    document.getElementById("leaderRows");

const startPanel =
    document.getElementById("startPanel");

const finishPanel =
    document.getElementById("finishPanel");

const finalList =
    document.getElementById("finalList");

const againButton =
    document.getElementById("againButton");

const raceFlash =
    document.getElementById("raceFlash");

const eventText =
    document.getElementById("eventText");

const errorBox =
    document.getElementById("errorBox");

const errorMessage =
    document.getElementById("errorMessage");


/* =========================================================
   ERROR HANDLER
========================================================= */

function showError(message){

    errorMessage.textContent =
        message;

    errorBox.classList.add(
        "show"
    );

}


/* =========================================================
   SETUP MENU
========================================================= */

function createSetupMenu(){

    horseGrid.innerHTML = "";

    for(
        let i = 0;
        i < HORSE_COUNT;
        i++
    ){

        const card =
            document.createElement("div");

        card.className =
            "horse-card";

        const color =
            HORSE_COLORS[i];

        const hex =
            color.color
                .toString(16)
                .padStart(6,"0");

        card.innerHTML = `

            <div class="horse-number">
                HORSE ${i + 1}
            </div>

            <div
                class="horse-preview"
                id="preview-${i}"
                style="
                    background:#${hex}
                "
            ></div>

            <input
                class="horse-input"
                id="horse-name-${i}"
                value="${defaultNames[i]}"
                maxlength="18"
                placeholder="Nama kuda"
            >

            <select
                class="color-select"
                id="horse-color-${i}"
            >

                ${HORSE_COLORS.map(
                    (c,index) => `

                        <option
                            value="${index}"
                            ${index === i
                                ? "selected"
                                : ""}
                        >
                            ${c.name}
                        </option>

                    `
                ).join("")}

            </select>

        `;

        horseGrid.appendChild(
            card
        );


        const colorSelect =
            card.querySelector(
                ".color-select"
            );


        colorSelect.addEventListener(
            "change",
            function(){

                const selected =
                    HORSE_COLORS[
                        Number(this.value)
                    ];

                const selectedHex =
                    selected.color
                        .toString(16)
                        .padStart(6,"0");

                card.querySelector(
                    ".horse-preview"
                ).style.background =
                    "#" +
                    selectedHex;

            }
        );

    }

}


/* =========================================================
   READ SETTINGS
========================================================= */

function getHorseSettings(){

    const settings = [];

    for(
        let i = 0;
        i < HORSE_COUNT;
        i++
    ){

        const nameInput =
            document.getElementById(
                `horse-name-${i}`
            );

        const colorSelect =
            document.getElementById(
                `horse-color-${i}`
            );

        let name =
            nameInput.value.trim();

        if(!name){

            name =
                `Horse ${i + 1}`;

        }

        const colorIndex =
            Number(
                colorSelect.value
            );

        settings.push({

            name:name,

            colorIndex:colorIndex,

            color:
                HORSE_COLORS[
                    colorIndex
                ].color

        });

    }

    return settings;

}


/* =========================================================
   INIT
========================================================= */

function init(){

    clock =
        new THREE.Clock();


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x8bc7e8
        );


    camera =
        new THREE.PerspectiveCamera(

            55,

            window.innerWidth /
            window.innerHeight,

            .1,

            1000

        );


    camera.position.set(
        32,
        19,
        18
    );


    renderer =

/* =========================================================
   TREE MATERIAL VARIATION
========================================================= */

function randomizeTreeMaterials(
    tree,
    variantIndex
){

    const baseColor =
        TREE_COLORS[
            variantIndex %
            TREE_COLORS.length
        ];


    tree.traverse(
        object => {

            if(
                !object.isMesh
            ){

                return;

            }


            object.castShadow =
                true;

            object.receiveShadow =
                true;


            if(
                !object.material
            ){

                return;

            }


            const materials =
                Array.isArray(
                    object.material
                )
                ? object.material
                : [object.material];


            const newMaterials =
                materials.map(
                    material => {

                        const clone =
                            material.clone();


                        if(
                            clone.color
                        ){

                            const color =
                                new THREE.Color(
                                    baseColor
                                );


                            const variation =
                                THREE.MathUtils.randFloat(
                                    .78,
                                    1.18
                                );


                            color.multiplyScalar(
                                variation
                            );


                            clone.color.copy(
                                color
                            );

                        }


                        if(
                            clone.roughness !==
                            undefined
                        ){

                            clone.roughness =
                                .9;

                        }


                        return clone;

                    }
                );


            object.material =
                Array.isArray(
                    object.material
                )
                ? newMaterials
                : newMaterials[0];

        }
    );

}


/* =========================================================
   LOAD TREE ASSETS
========================================================= */

function loadTreeAssets(){

    const loader =
        new FBXLoader();


    TREE_FILES.forEach(
        (file,index) => {

            loader.load(

                TREE_PATH + file,

                object => {

                    object.traverse(
                        child => {

                            if(
                                child.isMesh
                            ){

                                child.castShadow =
                                    true;

                                child.receiveShadow =
                                    true;

                            }

                        }
                    );


                    treeModels.push({

                        object:object,

                        file:file,

                        index:index

                    });


                    if(
                        treeModels.length ===
                        TREE_FILES.length
                    ){

                        createRandomTrees();

                    }

                },

                undefined,

                error => {

                    console.warn(
                        "Tree FBX gagal:",
                        file,
                        error
                    );

                }

            );

        }
    );

}


/* =========================================================
   CREATE RANDOM TREES
========================================================= */

function createRandomTrees(){

    if(
        treeModels.length === 0
    ){

        console.warn(
            "Tidak ada tree FBX yang berhasil dimuat."
        );

        return;

    }


    for(
        let i = 0;
        i < TREE_COUNT;
        i++
    ){

        const asset =
            treeModels[
                Math.floor(
                    Math.random() *
                    treeModels.length
                )
            ];


        const tree =
            asset.object.clone(
                true
            );


        const side =
            Math.random() < .5
            ? -1
            : 1;


        const x =
            side *
            THREE.MathUtils.randFloat(
                18,
                43
            );


        const z =
            THREE.MathUtils.randFloat(
                -320,
                45
            );


        const scale =
            THREE.MathUtils.randFloat(
                TREE_MIN_SCALE,
                TREE_MAX_SCALE
            );


        tree.scale.setScalar(
            scale
        );


        tree.position.set(
            x,
            0,
            z
        );


        tree.rotation.y =
            Math.random() *
            Math.PI *
            2;


        const colorVariant =
            Math.floor(
                Math.random() *
                TREE_COLORS.length
            );


        randomizeTreeMaterials(
            tree,
            colorVariant
        );


        scene.add(tree);

    }

}

/* =========================================================
   DUST
========================================================= */

function createDustSystem(){

    const geometry =
        new THREE.SphereGeometry(
            .16,
            6,
            6
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:0xd8b58a,

            transparent:true,

            opacity:.5,

            depthWrite:false

        });


    dustMesh =
        new THREE.InstancedMesh(
            geometry,
            material,
            180
        );


    dustMesh.instanceMatrix.setUsage(
        THREE.DynamicDrawUsage
    );


    scene.add(
        dustMesh
    );


    const dummy =
        new THREE.Object3D();


    for(
        let i = 0;
        i < 180;
        i++
    ){

        dustParticles.push({

            active:false,

            x:0,

            y:-100,

            z:0,

            vx:0,

            vy:0,

            vz:0,

            life:0,

            maxLife:1,

            scale:1

        });


        dummy.position.set(
            0,
            -100,
            0
        );


        dummy.scale.setScalar(
            0
        );


        dummy.updateMatrix();


        dustMesh.setMatrixAt(
            i,
            dummy.matrix
        );

    }


    dustMesh.instanceMatrix.needsUpdate =
        true;

}


function spawnDust(horse){

    const p =
        dustParticles.find(
            x => !x.active
        );


    if(!p) return;


    p.active = true;


    p.x =
        horse.model.position.x +
        (Math.random() - .5) *
        .55;


    p.y =
        .08 +
        Math.random() * .2;


    p.z =
        horse.model.position.z +
        1 +
        Math.random() * .7;


    p.vx =
        (Math.random() - .5) *
        .9;


    p.vy =
        .25 +
        Math.random() *
        .55;


    p.vz =
        .8 +
        Math.random() *
        1.5;


    p.life = 0;


    p.maxLife =
        .45 +
        Math.random() *
        .55;


    p.scale =
        .55 +
        Math.random() *
        .8;

}


function updateDust(delta){

    if(!dustMesh) return;


    const dummy =
        new THREE.Object3D();


    for(
        let i = 0;
        i < dustParticles.length;
        i++
    ){

        const p =
            dustParticles[i];


        if(p.active){

            p.life += delta;


            p.x +=
                p.vx * delta;


            p.y +=
                p.vy * delta;


            p.z +=
                p.vz * delta;


            p.vy -=
                1.15 * delta;


            if(
                p.life >=
                p.maxLife
            ){

                p.active =
                    false;

            }

        }


        if(p.active){

            const t =
                p.life /
                p.maxLife;


            dummy.position.set(
                p.x,
                p.y,
                p.z
            );


            dummy.scale.setScalar(

                Math.max(
                    .001,
                    p.scale *
                    (1 - t)
                )

            );

        }
        else{

            dummy.position.set(
                0,
                -100,
                0
            );


            dummy.scale.setScalar(
                0
            );

        }


        dummy.updateMatrix();


        dustMesh.setMatrixAt(
            i,
            dummy.matrix
        );

    }


    dustMesh.instanceMatrix.needsUpdate =
        true;

}

/* =========================================================
   CREATE HORSES
========================================================= */

function createHorses(gltf){

    horses = [];


    let gallop =
        gltf.animations.find(

            animation =>
                animation.name
                    .toLowerCase()
                    .trim() ===
                "gallop"

        );


    if(!gallop){

        gallop =
            gltf.animations.find(

                animation =>
                    animation.name
                        .toLowerCase()
                        .includes(
                            "gallop"
                        )

            );

    }


    for(
        let i = 0;
        i < HORSE_COUNT;
        i++
    ){

        const horse =
            cloneSkeleton(
                gltf.scene
            );


        scene.add(
            horse
        );


        horse.scale.set(
            1,
            1,
            1
        );


        horse.updateMatrixWorld(
            true
        );


        let box =
            new THREE.Box3();


        box.setFromObject(
            horse
        );


        const size =
            new THREE.Vector3();


        box.getSize(
            size
        );


        const TARGET_HEIGHT =
            3.55;


        if(
            size.y > .001
        ){

            const scale =
                TARGET_HEIGHT /
                size.y;


            horse.scale.set(
                scale,
                scale,
                scale
            );

        }


        horse.updateMatrixWorld(
            true
        );


        box =
            new THREE.Box3();


        box.setFromObject(
            horse
        );


        const x =
            (
                i - 3.5
            ) *
            LANE_SPACING;


        const y =
            -box.min.y;


        horse.position.set(
            x,
            y,
            START_Z
        );


        horse.rotation.y =
            Math.PI;


        horse.traverse(
            object => {

                if(
                    object.isMesh
                ){

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;

                    object.frustumCulled =
                        false;

                }

            }
        );


        const mixer =
            new THREE.AnimationMixer(
                horse
            );


        let action = null;


        if(gallop){

            action =
                mixer.clipAction(
                    gallop
                );


            action.setLoop(
                THREE.LoopRepeat,
                Infinity
            );

        }


        horses.push({

            id:i,

            name:
                defaultNames[i],

            color:
                HORSE_COLORS[i].color,

            model:horse,

            mixer:mixer,

            action:action,

            baseSpeed:9,

            currentSpeed:9,

            distance:0,

            baseX:x,

            baseY:y,

            bobPhase:
                Math.random() *
                Math.PI * 2,

            dustTimer:
                Math.random() * .08,

            finished:false,

            finishTime:null,

            variation:
                Math.random() *
                Math.PI * 2,

            stamina:100,

            boost:0,

            boostCooldown:0,

            lastPosition:i,

            overtakeCooldown:0,

            raceBias:
                Math.random(),

            colorApplied:false

        });

    }


    updateLeaderboard();

}


/* =========================================================
   APPLY HORSE COLOR
========================================================= */

function applyHorseColor(
    horseData
){

    horseData.model.traverse(

        object => {

            if(
                !object.isMesh
            ){

                return;

            }


            if(
                !object.material
            ){

                return;

            }


            const materials =
                Array.isArray(
                    object.material
                )
                ? object.material
                : [object.material];


            const cloned =
                materials.map(
                    material => {

                        const newMaterial =
                            material.clone();


                        if(
                            newMaterial.color
                        ){

                            newMaterial.color.set(
                                horseData.color
                            );

                        }


                        if(
                            newMaterial.roughness !==
                            undefined
                        ){

                            newMaterial.roughness =
                                .82;

                        }


                        return newMaterial;

                    }
                );


            object.material =
                Array.isArray(
                    object.material
                )
                ? cloned
                : cloned[0];

        }

    );


    horseData.colorApplied =
        true;

}

/* =========================================================
   COUNTDOWN
========================================================= */

function startCountdown(){

    if(
        countdownRunning
    ){

        return;

    }


    countdownRunning =
        true;


    raceStarted =
        false;


    raceFinished =
        false;


    finishOrder = [];


    randomizeRaceStats();


    horses.forEach(
        horse => {

            horse.finished =
                false;


            horse.distance =
                0;


            horse.finishTime =
                null;


            horse.model.position.z =
                START_Z;


            horse.model.position.x =
                horse.baseX;


            horse.stamina =
                THREE.MathUtils.randFloat(
                    82,
                    100
                );


            horse.boost =
                0;


            horse.currentSpeed =
                horse.baseSpeed;


            if(horse.action){

                horse.action.stop();

            }

        }
    );


    updateLeaderboard();


    raceStatus.textContent =
        "GET READY";


    let number = 3;


    countdown.classList.add(
        "show"
    );


    countdown.textContent =
        number;


    const timer =
        setInterval(

            function(){

                number--;


                if(number > 0){

                    countdown.textContent =
                        number;

                }
                else{

                    countdown.textContent =
                        "GO!";


                    raceFlash.style.opacity =
                        "1";


                    setTimeout(
                        () => {

                            raceFlash.style.opacity =
                                "0";

                        },
                        120
                    );


                    raceStarted =
                        true;


                    countdownRunning =
                        false;


                    raceStatus.textContent =
                        "RACING";


                    startPanel.classList.add(
                        "hidden"
                    );


                    horses.forEach(
                        horse => {

                            if(
                                horse.action
                            ){

                                horse.action
                                    .reset()
                                    .play();

                            }

                        }
                    );


                    setTimeout(
                        () => {

                            countdown.classList.remove(
                                "show"
                            );

                        },
                        700
                    );


                    clearInterval(
                        timer
                    );

                }

            },

            1000

        );

}

   SORT
========================================================= */

function getSortedHorses(){

    return [...horses].sort(

        (a,b) => {

            return (
                a.model.position.z -
                b.model.position.z
            );

        }

    );

}


/* =========================================================
   RIVALRY
========================================================= */

function updateRivalry(
    horse,
    sorted
){

    const position =
        sorted.indexOf(
            horse
        );


    if(
        position <= 0
    ){

        return;

    }


    const horseAhead =
        sorted[
            position - 1
        ];


    if(!horseAhead){

        return;

    }


    const gap =
        horse.model.position.z -
        horseAhead.model.position.z;


    if(
        gap > 0 &&
        gap < 7 &&
        horse.stamina > 18 &&
        horse.overtakeCooldown <= 0
    ){

        const chance =
            .018 +
            horse.raceBias *
            .025;


        if(
            Math.random() <
            chance
        ){

            horse.boost =
                THREE.MathUtils.randFloat(
                    1.0,
                    2.1
                );


            horse.stamina -=
                THREE.MathUtils.randFloat(
                    4,
                    9
                );


            horse.overtakeCooldown =
                1.5 +
                Math.random() * 2;


            showRaceEvent(
                `${horse.name} MENYUSUL!`
            );

        }

    }


    if(
        position >= 3 &&
        gap < 18 &&
        horse.stamina > 30
    ){

        if(
            Math.random() <
            .008
        ){

            horse.boost =
                Math.max(
                    horse.boost,
                    1
                );

        }

    }

}


/* =========================================================
   UPDATE HORSES
========================================================= */

function updateHorses(
    delta,
    elapsed
){

    if(
        !raceStarted ||
        raceFinished
    ){

        return;

    }


    const sorted =
        getSortedHorses();


    horses.forEach(
        horse => {

            if(horse.mixer){

                horse.mixer.update(
                    delta
                );

            }


            if(horse.finished){

                return;

            }


            horse.overtakeCooldown -=
                delta;


            horse.boostCooldown -=
                delta;


            updateRivalry(
                horse,
                sorted
            );


            const rhythm =
                Math.sin(
                    elapsed * .72 +
                    horse.variation
                ) * .16;


            const micro =
                Math.sin(
                    elapsed * 1.7 +
                    horse.variation * 1.9
                ) * .06;


            const surge =
                Math.sin(
                    elapsed * .21 +
                    horse.variation * 2.4
                ) * .08;


            horse.stamina =
                Math.min(
                    100,
                    horse.stamina +
                    delta * .55
                );


            if(
                horse.boost > 0
            ){

                horse.boost -=
                    delta;

            }


            const staminaFactor =
                THREE.MathUtils.clamp(

                    .84 +
                    horse.stamina /
                    100 *
                    .16,

                    .84,
                    1

                );


            let boostPower = 0;


            if(
                horse.boost > 0
            ){

                boostPower =
                    1 +
                    Math.random() * .12;

            }


            horse.currentSpeed =

                (
                    horse.baseSpeed +
                    rhythm +
                    micro +
                    surge +
                    boostPower
                ) *
                staminaFactor;


            if(
                horse.boostCooldown <= 0 &&
                horse.stamina > 55
            ){

                if(
                    Math.random() <
                    .0035
                ){

                    horse.boost =
                        THREE.MathUtils.randFloat(
                            .5,
                            1.25
                        );


                    horse.stamina -=
                        THREE.MathUtils.randFloat(
                            2,
                            5
                        );


                    horse.boostCooldown =
                        THREE.MathUtils.randFloat(
                            2,
                            5
                        );

                }

            }


            const movement =
                horse.currentSpeed *
                delta;


            horse.model.position.z -=
                movement;


            horse.distance +=
                movement;


            const phase =
                elapsed *
                (
                    7.2 +
                    horse.currentSpeed *
                    .12
                ) +
                horse.bobPhase;


            const gallopBob =
                Math.sin(
                    phase
                ) * .045;


            const lateral =
                Math.sin(
                    phase * .5
                ) * .025;


            horse.model.position.y =
                horse.baseY +
                gallopBob;


            horse.model.position.x =
                horse.baseX +
                lateral;


            horse.model.rotation.z =
                Math.sin(
                    phase * .5
                ) * .008;


            horse.model.rotation.x =
                Math.sin(
                    phase
                ) * .006;


            if(horse.action){

                horse.action.setEffectiveTimeScale(

                    THREE.MathUtils.clamp(

                        .84 +
                        horse.currentSpeed /
                        10 * .31,

                        .84,
                        1.3

                    )

                );

            }


            horse.dustTimer -=
                delta;


            const dustInterval =
                THREE.MathUtils.clamp(

                    .095 -
                    (
                        horse.currentSpeed -
                        9
                    ) * .008,

                    .055,
                    .095

                );


            if(
                horse.dustTimer <= 0
            ){

                spawnDust(
                    horse
                );


                if(
                    Math.random() > .32
                ){

                    spawnDust(
                        horse
                    );

                }


                horse.dustTimer =
                    dustInterval +
                    Math.random() * .045;

            }


            if(
                horse.model.position.z <=
                FINISH_Z
            ){

                horse.finished =
                    true;


                horse.finishTime =
                    elapsed;


                finishOrder.push(
                    horse
                );


                if(horse.action){

                    horse.action.stop();

                }


                showRaceEvent(
                    `${horse.name} FINISH!`
                );

            }

        }
    );


    updateDust(
        delta
    );


    updateLeaderboard();


    if(
        finishOrder.length ===
        HORSE_COUNT
    ){

        finishRace();

    }

}


/* =========================================================
   LEADERBOARD
========================================================= */

function updateLeaderboard(){

    if(
        horses.length === 0
    ){

        return;

    }


    const sorted =
        getSortedHorses();


    leaderRows.innerHTML =
        "";


    sorted.forEach(
        (horse,index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "lb-row";


            if(
                index === 0
            ){

                row.classList.add(
                    "leading"
                );

            }


            const displayName =
                horse.name ||
                `Horse ${horse.id + 1}`;


            row.innerHTML = `

                <div class="lb-left">

                    <div class="lb-number">
                        ${index + 1}
                    </div>

                    <div class="lb-player">
                        ${escapeHTML(
                            displayName
                        )}
                    </div>

                </div>

                <div class="lb-distance">
                    ${Math.round(
                        horse.distance
                    )}m
                </div>

            `;


            leaderRows.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   EVENT
========================================================= */

function showRaceEvent(text){

    eventText.textContent =
        text;


    eventText.classList.add(
        "show"
    );


    clearTimeout(
        eventTimer
    );


    eventTimer =
        setTimeout(
            () => {

                eventText.classList.remove(
                    "show"
                );

            },
            900
        );

}


/* =========================================================
   FINISH
========================================================= */

function finishRace(){

    raceFinished =
        true;


    raceStarted =
        false;


    raceStatus.textContent =
        "FINISH";


    finalList.innerHTML =
        "";


    const finalOrder =
        [...finishOrder];


    if(
        finalOrder.length <
        HORSE_COUNT
    ){

        horses

            .filter(
                horse =>
                    !finalOrder.includes(
                        horse
                    )
            )

            .sort(
                (a,b) =>
                    a.model.position.z -
                    b.model.position.z
            )

            .forEach(
                horse =>
                    finalOrder.push(
                        horse
                    )
            );

    }


    finalOrder.forEach(
        (horse,index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "final-row";


            if(
                index === 0
            ){

                row.classList.add(
                    "first"
                );

            }


            const displayName =
                horse.name ||
                `Horse ${horse.id + 1}`;


            row.innerHTML = `

                <span>

                    ${
                        index === 0
                        ? "🏆 "
                        : ""
                    }

                    ${index + 1}.
                    ${escapeHTML(
                        displayName
                    )}

                </span>

                <span class="final-speed">

                    ${horse.baseSpeed.toFixed(2)}
                    m/s

                </span>

            `;


            finalList.appendChild(
                row
            );

        }
    );


    setTimeout(
        function(){

            finishPanel.classList.add(
                "show"
            );

        },
        1000
    );

}


/* =========================================================
   RESTART
========================================================= */

function restartRace(){

    finishPanel.classList.remove(
        "show"
    );


    horses.forEach(
        (horse,index) => {

            const x =
                (
                    index -
                    3.5
                ) *
                LANE_SPACING;


            horse.model.position.set(

                x,

                horse.baseY,

                START_Z

            );


            horse.model.rotation.y =
                Math.PI;


            horse.distance =
                0;


            horse.baseX =
                x;


            horse.dustTimer =
                .02;


            horse.finished =
                false;


            horse.finishTime =
                null;


            horse.stamina =
                100;


            horse.boost =
                0;


            horse.boostCooldown =
                0;


            horse.overtakeCooldown =
                0;


            if(horse.action){

                horse.action.stop();

            }

        }
    );


    finishOrder = [];


    raceStarted =
        false;


    raceFinished =
        false;


    countdownRunning =
        false;


    raceStatus.textContent =
        "GET READY";


    startPanel.classList.remove(
        "hidden"
    );


    updateLeaderboard();


    setTimeout(
        function(){

            startCountdown();

        },
        400
    );

}


/* =========================================================
   CINEMATIC SIDE-TOP CAMERA
========================================================= */

function updateCamera(){

    if(
        horses.length === 0
    ){

        return;

    }


    const activeHorses =
        horses.filter(
            horse =>
                !horse.finished
        );


    const group =
        activeHorses.length
        ? activeHorses
        : horses;


    let averageX = 0;

    let averageZ = 0;


    group.forEach(
        horse => {

            averageX +=
                horse.model.position.x;


            averageZ +=
                horse.model.position.z;

        }
    );


    averageX /=
        group.length;


    averageZ /=
        group.length;


    const raceProgress =
        THREE.MathUtils.clamp(

            (
                START_Z -
                averageZ
            ) /
            (
                START_Z -
                FINISH_Z
            ),

            0,
            1

        );


    /*
     * SIDE-TOP CINEMATIC
     *
     * Kamera tetap berada di samping
     * dan sedikit di atas arena.
     *
     * Tidak mengikuti dari belakang.
     */

    const side =
        31;


    const height =
        THREE.MathUtils.lerp(
            18,
            14,
            raceProgress
        );


    const forward =
        THREE.MathUtils.lerp(
            5,
            8,
            raceProgress
        );


    const cinematicSway =
        Math.sin(
            clock.elapsedTime * .25
        ) * .8;


    cameraTarget.set(

        averageX +
        side +
        cinematicSway,

        height,

        averageZ +
        forward

    );


    camera.position.lerp(

        cameraTarget,

        .055

    );


    cameraLook.set(

        averageX,

        1.5,

        averageZ - 3

    );


    camera.lookAt(
        cameraLook
    );


    cameraShake =
        THREE.MathUtils.lerp(

            cameraShake,

            raceStarted
            ? .025
            : 0,

            .06

        );


    camera.position.x +=
        Math.sin(
            clock.elapsedTime * 18
        ) *
        cameraShake;


    camera.position.y +=
        Math.cos(
            clock.elapsedTime * 15
        ) *
        cameraShake *
        .5;


    const targetFov =
        THREE.MathUtils.lerp(
            53,
            59,
            raceProgress
        );


    camera.fov +=
        (
            targetFov -
            camera.fov
        ) * .035;


    camera.updateProjectionMatrix();

}


/* =========================================================
   RESIZE
========================================================= */

function onResize(){

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            clock.getDelta(),

            .05

        );


    const elapsed =
        clock.elapsedTime;


    updateHorses(
        delta,
        elapsed
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   START
========================================================= */

init();

</script>
