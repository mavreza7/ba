<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horse Racing 3D V9</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#071009;
}

canvas{
    display:block;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:radial-gradient(circle,#294b34 0%,#071009 75%);
    transition:.5s;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loading-title{
    font-size:clamp(32px,6vw,64px);
    font-weight:900;
    letter-spacing:6px;
}

.loading-subtitle{
    margin-top:12px;
    color:rgba(255,255,255,.65);
}

.loading-bar{
    width:min(350px,75vw);
    height:7px;
    margin-top:25px;
    overflow:hidden;
    border-radius:20px;
    background:rgba(255,255,255,.12);
}

#loading-progress{
    width:0%;
    height:100%;
    background:white;
    transition:.2s;
}

.loading-percent{
    margin-top:10px;
    font-size:12px;
    color:rgba(255,255,255,.5);
}

/* =========================
   MENU
========================= */

#menu{
    position:fixed;
    inset:0;
    z-index:2000;
    overflow:auto;
    padding:30px 15px;
    color:white;
    background:
        radial-gradient(circle at top,#315b3e,#071009 65%);
}

.menu-inner{
    width:min(950px,100%);
    margin:auto;
}

.menu-title{
    text-align:center;
    font-size:clamp(28px,5vw,48px);
    font-weight:1000;
    letter-spacing:4px;
}

.menu-subtitle{
    margin-top:8px;
    text-align:center;
    color:rgba(255,255,255,.55);
    font-size:13px;
}

.horse-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:30px;
}

.horse-card{
    padding:15px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(15px);
}

.horse-number{
    font-size:11px;
    color:rgba(255,255,255,.45);
    margin-bottom:8px;
}

.horse-preview{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

.horse-card input{
    width:100%;
    padding:9px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:9px;
    outline:none;
    color:white;
    background:rgba(255,255,255,.08);
}

.horse-card input::placeholder{
    color:rgba(255,255,255,.4);
}

.color-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:9px;
    font-size:10px;
    color:rgba(255,255,255,.5);
}

.color-row input{
    width:42px;
    height:28px;
    padding:0;
    border:0;
    background:none;
    cursor:pointer;
}

.start-race{
    display:block;
    width:min(450px,100%);
    margin:25px auto 0;
    padding:15px;
    border:0;
    border-radius:14px;
    cursor:pointer;
    font-size:14px;
    font-weight:900;
    color:#101510;
    background:white;
    transition:.25s;
}

.start-race:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

/* =========================
   COUNTDOWN
========================= */

#countdown{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    color:white;
    font-size:clamp(90px,20vw,220px);
    font-weight:1000;
    text-shadow:0 10px 50px rgba(0,0,0,.8);
}

#countdown.show{
    opacity:1;
}

/* =========================
   HUD
========================= */

#topHud{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    min-width:320px;
    padding:13px 22px;
    color:white;
    text-align:center;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.38);
    backdrop-filter:blur(15px);
}

.race-title{
    font-size:16px;
    font-weight:900;
    letter-spacing:3px;
}

.race-status{
    margin-top:5px;
    font-size:11px;
    color:rgba(255,255,255,.6);
}

/* =========================
   LEADERBOARD
========================= */

#leaderboard{
    position:fixed;
    top:18px;
    right:18px;
    z-index:100;
    width:225px;
    padding:14px;
    color:white;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(15px);
}

.lb-title{
    margin-bottom:10px;
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
}

.lb-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px;
    margin-top:3px;
    border-radius:7px;
    font-size:11px;
    color:rgba(255,255,255,.7);
    transition:.2s;
}

.lb-row.leading{
    color:white;
    background:rgba(255,255,255,.13);
}

.lb-left{
    display:flex;
    align-items:center;
    gap:7px;
}

.lb-number{
    width:18px;
    text-align:center;
    font-weight:bold;
}

.lb-player{
    font-weight:600;
}

.lb-distance{
    color:rgba(255,255,255,.5);
}

/* =========================
   START
========================= */

#startPanel{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:100;
    padding:12px 20px;
    color:white;
    font-size:12px;
    border-radius:50px;
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    transition:.4s;
}

#startPanel.hidden{
    opacity:0;
    transform:translateX(-50%) translateY(20px);
}

/* =========================
   FINISH
========================= */

#finishPanel{
    position:fixed;
    inset:0;
    z-index:800;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);
    transition:.5s;
}

#finishPanel.show{
    opacity:1;
    visibility:visible;
}

.finish-box{
    width:min(430px,90vw);
    padding:30px;
    color:white;
    text-align:center;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.15);
    background:linear-gradient(145deg,rgba(30,45,33,.97),rgba(5,12,7,.97));
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.finish-trophy{
    font-size:55px;
}

.finish-title{
    margin-top:8px;
    font-size:28px;
    font-weight:1000;
}

.finish-subtitle{
    margin-top:6px;
    font-size:12px;
    color:rgba(255,255,255,.5);
}

.final-list{
    margin-top:20px;
    text-align:left;
}

.final-row{
    display:flex;
    justify-content:space-between;
    padding:9px 12px;
    margin-top:5px;
    border-radius:9px;
    background:rgba(255,255,255,.06);
    font-size:13px;
}

.final-row.first{
    background:rgba(255,255,255,.15);
}

#againButton{
    width:100%;
    margin-top:22px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:white;
    color:#101510;
    font-weight:900;
    cursor:pointer;
}

/* =========================
   EFFECT
========================= */

#cinematicVignette{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    background:radial-gradient(
        ellipse at center,
        transparent 42%,
        rgba(0,0,0,.28) 100%
    );
}

#raceFlash{
    position:fixed;
    inset:0;
    z-index:25;
    pointer-events:none;
    opacity:0;
    background:rgba(255,255,255,.28);
    transition:.12s;
}

#raceVignette{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    box-shadow:inset 0 0 140px rgba(0,0,0,.35);
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    .horse-grid{
        grid-template-columns:repeat(2,1fr);
    }

    #topHud{
        top:10px;
        min-width:220px;
        padding:9px 14px;
    }

    .race-title{
        font-size:12px;
    }

    #leaderboard{
        top:65px;
        right:10px;
        width:175px;
        padding:10px;
    }

    .lb-row{
        font-size:9px;
    }

    #startPanel{
        bottom:12px;
        font-size:10px;
    }
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="cinematicVignette"></div>
<div id="raceFlash"></div>
<div id="raceVignette"></div>

<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="menu-inner">

        <div class="menu-title">
            🏇 HORSE RACING
        </div>

        <div class="menu-subtitle">
            Pilih nama dan warna setiap kuda
        </div>

        <div class="horse-grid" id="horseGrid"></div>

        <button class="start-race" id="startRace">
            🏁 START RACE
        </button>

    </div>

</div>

<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="loading-title">
        HORSE RACING
    </div>

    <div class="loading-subtitle">
        Preparing horses...
    </div>

    <div class="loading-bar">
        <div id="loading-progress"></div>
    </div>

    <div class="loading-percent">
        0%
    </div>

</div>

<!-- =========================
     COUNTDOWN
========================= -->

<div id="countdown">
    3
</div>

<!-- =========================
     HUD
========================= -->

<div id="topHud">

    <div class="race-title">
        🏇 HORSE RACING
    </div>

    <div class="race-status" id="raceStatus">
        Preparing race...
    </div>

</div>

<!-- =========================
     LEADERBOARD
========================= -->

<div id="leaderboard">

    <div class="lb-title">
        🏆 LIVE POSITION
    </div>

    <div id="leaderRows"></div>

</div>

<div id="startPanel">
    8 HORSES • RANDOM RACE
</div>

<!-- =========================
     FINISH
========================= -->

<div id="finishPanel">

    <div class="finish-box">

        <div class="finish-trophy">
            🏆
        </div>

        <div class="finish-title">
            RACE FINISHED
        </div>

        <div class="finish-subtitle">
            Final Result
        </div>

        <div class="final-list" id="finalList"></div>

        <button id="againButton">
            🔄 RACE AGAIN
        </button>

    </div>

</div>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    clone as cloneSkeleton
} from "three/addons/utils/SkeletonUtils.js";


/* =====================================================
   CONFIG
===================================================== */

const HORSE_FILE =
    "./quaternius_cc0-white-horse-1081(1).glb";

const HORSE_COUNT = 8;

const LANE_SPACING = 2.6;

const START_Z = 20;

const FINISH_Z = -280;


/* =====================================================
   GLOBAL
===================================================== */

let scene;
let camera;
let renderer;
let clock;

let horses = [];

let raceStarted = false;
let raceFinished = false;
let countdownRunning = false;

let finishOrder = [];

let dustMesh;
let dustParticles = [];

let cameraTarget =
    new THREE.Vector3();

let cameraLook =
    new THREE.Vector3();


/* =====================================================
   DOM
===================================================== */

const menu =
    document.getElementById("menu");

const horseGrid =
    document.getElementById("horseGrid");

const startRace =
    document.getElementById("startRace");

const loading =
    document.getElementById("loading");

const progress =
    document.getElementById("loading-progress");

const loadingPercent =
    document.querySelector(".loading-percent");

const countdown =
    document.getElementById("countdown");

const raceStatus =
    document.getElementById("raceStatus");

const leaderRows =
    document.getElementById("leaderRows");

const startPanel =
    document.getElementById("startPanel");

const finishPanel =
    document.getElementById("finishPanel");

const finalList =
    document.getElementById("finalList");

const againButton =
    document.getElementById("againButton");

const raceFlash =
    document.getElementById("raceFlash");


/* =====================================================
   PLAYER CONFIG
===================================================== */

const horseSettings = [];

const defaultColors = [
    "#8B4513",
    "#111111",
    "#F5F5F5",
    "#654321",
    "#C0392B",
    "#D4A017",
    "#5B2C6F",
    "#1F618D"
];

for(let i=0;i<HORSE_COUNT;i++){

    horseSettings.push({

        name:
            "Horse " + (i + 1),

        color:
            defaultColors[i]

    });

}


/* =====================================================
   CREATE MENU
===================================================== */

function createMenu(){

    horseGrid.innerHTML = "";

    horseSettings.forEach((horse,index)=>{

        const card =
            document.createElement("div");

        card.className =
            "horse-card";

        card.innerHTML = `

            <div class="horse-number">
                HORSE ${index + 1}
            </div>

            <div class="horse-preview">
                🐎
            </div>

            <input
                type="text"
                maxlength="18"
                value="${horse.name}"
                placeholder="Nama kuda"
                data-index="${index}"
                class="horse-name"
            >

            <div class="color-row">

                <span>
                    WARNA
                </span>

                <input
                    type="color"
                    value="${horse.color}"
                    data-index="${index}"
                    class="horse-color"
                >

            </div>

        `;

        horseGrid.appendChild(card);

    });


    document
        .querySelectorAll(".horse-name")
        .forEach(input=>{

            input.addEventListener(
                "input",
                e=>{

                    const i =
                        Number(
                            e.target.dataset.index
                        );

                    horseSettings[i].name =
                        e.target.value ||
                        "Horse " + (i + 1);

                }
            );

        });


    document
        .querySelectorAll(".horse-color")
        .forEach(input=>{

            input.addEventListener(
                "input",
                e=>{

                    const i =
                        Number(
                            e.target.dataset.index
                        );

                    horseSettings[i].color =
                        e.target.value;

                }
            );

        });

}


/* =====================================================
   INIT
===================================================== */

function init(){

    clock =
        new THREE.Clock();

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x8bc7e8
        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            55,
            window.innerWidth /
            window.innerHeight,
            .1,
            1000
        );


    /*
       INITIAL CAMERA:

       SAMPING + ATAS

       BUKAN DI BELAKANG
    */

    camera.position.set(
        24,
        18,
        12
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled =
        true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.1;

    document.body.appendChild(
        renderer.domElement
    );


    createLights();

    createWorld();

    createDustSystem();

    loadHorse();


    window.addEventListener(
        "resize",
        onResize
    );


    startRace.addEventListener(
        "click",
        startGame
    );


    againButton.addEventListener(
        "click",
        restartRace
    );


    animate();

}


/* =====================================================
   LIGHT
===================================================== */

function createLights(){

    const hemi =
        new THREE.HemisphereLight(
            0xffffff,
            0x36553a,
            2.5
        );

    scene.add(hemi);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3.5
        );

    sun.position.set(
        -40,
        60,
        30
    );

    sun.castShadow =
        true;

    sun.shadow.mapSize.width =
        2048;

    sun.shadow.mapSize.height =
        2048;

    sun.shadow.camera.left =
        -100;

    sun.shadow.camera.right =
        100;

    sun.shadow.camera.top =
        100;

    sun.shadow.camera.bottom =
        -100;

    scene.add(sun);

}


/* =====================================================
   WORLD
===================================================== */

function createWorld(){

    const grass =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                650
            ),

            new THREE.MeshStandardMaterial({

                color:0x4c9f50,

                roughness:1

            })

        );

    grass.rotation.x =
        -Math.PI / 2;

    grass.receiveShadow =
        true;

    scene.add(grass);


    const track =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                25,
                650
            ),

            new THREE.MeshStandardMaterial({

                color:0x956c51,

                roughness:.95

            })

        );

    track.rotation.x =
        -Math.PI / 2;

    track.position.y =
        .02;

    track.receiveShadow =
        true;

    scene.add(track);


    for(
        let i=-4;
        i<=4;
        i++
    ){

        const line =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    .035,
                    650
                ),

                new THREE.MeshBasicMaterial({

                    color:0xffffff,

                    transparent:true,

                    opacity:.25

                })

            );

        line.rotation.x =
            -Math.PI / 2;

        line.position.set(
            i * LANE_SPACING,
            .045,
            0
        );

        scene.add(line);

    }


    createFence(-14);

    createFence(14);

    createStartLine();

    createFinishLine();

    createFinishArch();

    createTrees();

    createMountains();

}


/* =====================================================
   FENCE
===================================================== */

function createFence(x){

    for(
        let z=-320;
        z<=50;
        z+=5
    ){

        const post =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .18,
                    1.35,
                    .18
                ),

                new THREE.MeshStandardMaterial({
                    color:0xffffff
                })

            );

        post.position.set(
            x,
            .68,
            z
        );

        post.castShadow =
            true;

        scene.add(post);


        const rail =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .12,
                    .12,
                    5
                ),

                new THREE.MeshStandardMaterial({
                    color:0xffffff
                })

            );

        rail.position.set(
            x,
            .95,
            z + 2.5
        );

        scene.add(rail);

    }

}


/* =====================================================
   START / FINISH
===================================================== */

function createStartLine(){

    const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                25,
                .06,
                1
            ),

            new THREE.MeshStandardMaterial({
                color:0xffffff
            })

        );

    line.position.set(
        0,
        .06,
        START_Z
    );

    scene.add(line);

}


function createFinishLine(){

    const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                25,
                .07,
                1.4
            ),

            new THREE.MeshStandardMaterial({
                color:0xffffff
            })

        );

    line.position.set(
        0,
        .07,
        FINISH_Z
    );

    scene.add(line);

}


function createFinishArch(){

    const material =
        new THREE.MeshStandardMaterial({
            color:0xffffff
        });


    const left =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .4,
                7,
                .4
            ),

            material

        );

    left.position.set(
        -10,
        3.5,
        FINISH_Z
    );

    scene.add(left);


    const right =
        left.clone();

    right.position.x =
        10;

    scene.add(right);


    const top =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                20,
                .45,
                .45
            ),

            material

        );

    top.position.set(
        0,
        7,
        FINISH_Z
    );

    scene.add(top);

}


/* =====================================================
   TREES
===================================================== */

function createTrees(){

    for(let i=0;i<80;i++){

        const side =
            Math.random() < .5
            ? -1
            : 1;

        const x =
            side *
            (
                18 +
                Math.random() * 25
            );

        const z =
            -320 +
            Math.random() * 380;

        createTree(x,z);

    }

}


function createTree(x,z){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .22,
                .35,
                2.8,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x60452e
            })

        );

    trunk.position.set(
        x,
        1.4,
        z
    );

    trunk.castShadow =
        true;

    scene.add(trunk);


    const crown =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.7,
                10,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0x22652f
            })

        );

    crown.position.set(
        x,
        3.4,
        z
    );

    crown.castShadow =
        true;

    scene.add(crown);

}


/* =====================================================
   MOUNTAINS
===================================================== */

function createMountains(){

    for(let i=0;i<14;i++){

        const mountain =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    10 + Math.random()*10,
                    18 + Math.random()*12,
                    4
                ),

                new THREE.MeshStandardMaterial({
                    color:0x668568,
                    roughness:1
                })

            );

        mountain.position.set(
            -120 + i*18,
            8,
            -280
        );

        mountain.rotation.y =
            Math.random();

        scene.add(mountain);

    }

}


/* =====================================================
   DUST
===================================================== */

function createDustSystem(){

    const geometry =
        new THREE.SphereGeometry(
            .16,
            6,
            6
        );

    const material =
        new THREE.MeshBasicMaterial({

            color:0xd8b58a,

            transparent:true,

            opacity:.5,

            depthWrite:false

        });


    dustMesh =
        new THREE.InstancedMesh(
            geometry,
            material,
            180
        );

    dustMesh.instanceMatrix.setUsage(
        THREE.DynamicDrawUsage
    );

    scene.add(dustMesh);


    const dummy =
        new THREE.Object3D();


    for(let i=0;i<180;i++){

        dustParticles.push({

            active:false,

            x:0,
            y:-100,
            z:0,

            vx:0,
            vy:0,
            vz:0,

            life:0,
            maxLife:1,

            scale:1

        });


        dummy.position.set(
            0,
            -100,
            0
        );

        dummy.scale.setScalar(0);

        dummy.updateMatrix();

        dustMesh.setMatrixAt(
            i,
            dummy.matrix
        );

    }

    dustMesh.instanceMatrix.needsUpdate =
        true;

}


function spawnDust(horse){

    const p =
        dustParticles.find(
            x=>!x.active
        );

    if(!p)return;


    p.active =
        true;

    p.x =
        horse.model.position.x +
        (Math.random()-.5)*.55;

    p.y =
        .08 +
        Math.random()*.2;

    p.z =
        horse.model.position.z +
        1 +
        Math.random()*.7;

    p.vx =
        (Math.random()-.5)*.9;

    p.vy =
        .25 +
        Math.random()*.55;

    p.vz =
        .8 +
        Math.random()*1.5;

    p.life =
        0;

    p.maxLife =
        .45 +
        Math.random()*.55;

    p.scale =
        .55 +
        Math.random()*.8;

}


function updateDust(delta){

    if(!dustMesh)return;

    const dummy =
        new THREE.Object3D();


    for(let i=0;i<dustParticles.length;i++){

        const p =
            dustParticles[i];


        if(p.active){

            p.life += delta;

            p.x += p.vx * delta;

            p.y += p.vy * delta;

            p.z += p.vz * delta;

            p.vy -=
                1.15 * delta;


            if(
                p.life >=
                p.maxLife
            ){

                p.active =
                    false;

            }

        }


        if(p.active){

            const t =
                p.life /
                p.maxLife;

            dummy.position.set(
                p.x,
                p.y,
                p.z
            );

            dummy.scale.setScalar(
                Math.max(
                    .001,
                    p.scale*(1-t)
                )
            );

        }
        else{

            dummy.position.set(
                0,
                -100,
                0
            );

            dummy.scale.setScalar(0);

        }


        dummy.updateMatrix();

        dustMesh.setMatrixAt(
            i,
            dummy.matrix
        );

    }


    dustMesh.instanceMatrix.needsUpdate =
        true;

}


/* =====================================================
   LOAD HORSE
===================================================== */

function loadHorse(){

    const loader =
        new GLTFLoader();


    loader.load(

        HORSE_FILE,

        gltf=>{

            progress.style.width =
                "100%";

            loadingPercent.textContent =
                "100%";


            createHorses(gltf);


            setTimeout(()=>{

                loading.classList.add(
                    "hide"
                );

            },500);

        },


        xhr=>{

            if(xhr.total){

                const percent =
                    xhr.loaded /
                    xhr.total *
                    100;

                progress.style.width =
                    percent + "%";

                loadingPercent.textContent =
                    Math.round(percent) +
                    "%";

            }

        },


        error=>{

            console.error(error);

            document.querySelector(
                ".loading-title"
            ).textContent =
                "GLB ERROR";

            document.querySelector(
                ".loading-subtitle"
            ).textContent =
                "File GLB tidak dapat dimuat";

            loadingPercent.textContent =
                "ERROR";

        }

    );

}


/* =====================================================
   CREATE HORSES
===================================================== */

function createHorses(gltf){

    horses = [];


    let gallop =
        gltf.animations.find(
            animation =>
                animation.name
                .toLowerCase()
                .trim() ===
                "gallop"
        );


    if(!gallop){

        gallop =
            gltf.animations.find(
                animation =>
                    animation.name
                    .toLowerCase()
                    .includes("gallop")
            );

    }


    for(
        let i=0;
        i<HORSE_COUNT;
        i++
    ){

        const horse =
            cloneSkeleton(
                gltf.scene
            );


        scene.add(horse);


        horse.scale.set(
            1,
            1,
            1
        );


        horse.updateMatrixWorld(true);


        let box =
            new THREE.Box3();

        box.setFromObject(horse);


        const size =
            new THREE.Vector3();

        box.getSize(size);


        const TARGET_HEIGHT =
            3.55;


        if(size.y > .001){

            const scale =
                TARGET_HEIGHT /
                size.y;

            horse.scale.set(
                scale,
                scale,
                scale
            );

        }


        horse.updateMatrixWorld(true);


        box =
            new THREE.Box3();

        box.setFromObject(horse);


        const x =
            (
                i -
                3.5
            ) *
            LANE_SPACING;


        const y =
            -box.min.y;


        horse.position.set(
            x,
            y,
            START_Z
        );


        /*
           KUDA MENGHADAP
           KE ARAH FINISH
        */

        horse.rotation.y =
            Math.PI;


        horse.traverse(object=>{

            if(object.isMesh){

                object.castShadow =
                    true;

                object.receiveShadow =
                    true;

                object.frustumCulled =
                    false;

            }

        });


        /* =============================================
           ANIMATION
        ============================================= */

        const mixer =
            new THREE.AnimationMixer(
                horse
            );


        let action = null;


        if(gallop){

            action =
                mixer.clipAction(
                    gallop
                );

            action.setLoop(
                THREE.LoopRepeat,
                Infinity
            );

        }


        /* =============================================
           RANDOM RACE PERSONALITY
        ============================================= */

        const baseSpeed =
            8.5 +
            Math.random()*1.8;


        const stamina =
            .75 +
            Math.random()*.25;


        const aggression =
            .65 +
            Math.random()*.35;


        const boostPower =
            .65 +
            Math.random()*.55;


        horses.push({

            id:i,

            player:
                horseSettings[i].name,

            color:
                horseSettings[i].color,

            model:horse,

            mixer:mixer,

            action:action,

            baseSpeed:baseSpeed,

            currentSpeed:baseSpeed,

            stamina:stamina,

            maxStamina:stamina,

            aggression:aggression,

            boostPower:boostPower,

            distance:0,

            baseX:x,

            baseY:y,

            bobPhase:
                Math.random() *
                Math.PI *
                2,

            variation:
                Math.random() *
                Math.PI *
                2,

            boostTimer:0,

            boostCooldown:
                2 +
                Math.random()*3,

            rivalryTimer:
                Math.random()*2,

            finished:false,

            finishTime:null

        });

    }


    updateHorseColors();

    updateLeaderboard();

}


/* =====================================================
   HORSE COLORS
===================================================== */

function updateHorseColors(){

    horses.forEach((horse,index)=>{

        const color =
            new THREE.Color(
                horseSettings[index].color
            );

        horse.color =
            horseSettings[index].color;

        horse.model.traverse(
            object=>{

                if(
                    object.isMesh &&
                    object.material
                ){

                    if(
                        object.material.map
                    ){

                        /*
                           Jika model memiliki
                           texture asli, kita
                           beri tint.
                        */

                        object.material =
                            object.material.clone();

                        object.material.color
                            .set(color);

                    }
                    else{

                        object.material =
                            object.material.clone();

                        object.material.color
                            .set(color);

                    }

                }

            }
        );

    });

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    menu.style.display =
        "none";

    startCountdown();

}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown(){

    if(countdownRunning)
        return;


    countdownRunning =
        true;

    raceStarted =
        false;

    raceFinished =
        false;

    finishOrder = [];


    raceStatus.textContent =
        "GET READY";


    let number = 3;


    countdown.classList.add(
        "show"
    );

    countdown.textContent =
        number;


    const timer =
        setInterval(()=>{

            number--;


            if(number > 0){

                countdown.textContent =
                    number;

            }
            else{

                countdown.textContent =
                    "GO!";


                raceFlash.style.opacity =
                    "1";


                setTimeout(()=>{

                    raceFlash.style.opacity =
                        "0";

                },120);


                raceStarted =
                    true;

                countdownRunning =
                    false;


                raceStatus.textContent =
                    "RACING";


                startPanel.classList.add(
                    "hidden"
                );


                horses.forEach(horse=>{

                    if(horse.action){

                        horse.action
                            .reset()
                            .play();

                    }

                });


                setTimeout(()=>{

                    countdown.classList.remove(
                        "show"
                    );

                },700);


                clearInterval(timer);

            }

        },1000);

}


/* =====================================================
   UPDATE HORSES
===================================================== */

function updateHorses(delta,elapsed){

    if(
        !raceStarted ||
        raceFinished
    )
        return;


    horses.forEach(horse=>{

        if(horse.mixer)
            horse.mixer.update(delta);


        if(horse.finished)
            return;


        /* =============================================
           BASE SPEED VARIATION
        ============================================= */

        const naturalVariation =
            Math.sin(
                elapsed*.72 +
                horse.variation
            ) * .16;


        const microVariation =
            Math.sin(
                elapsed*1.7 +
                horse.variation*1.9
            ) * .08;


        /*
           RANDOM MOMENTUM
        */

        const randomWave =
            Math.sin(
                elapsed*.27 +
                horse.variation*3
            ) * .14;


        /* =============================================
           RIVALRY
        ============================================= */

        let nearestRival = null;

        let nearestDistance =
            Infinity;


        horses.forEach(other=>{

            if(
                other === horse ||
                other.finished
            )
                return;


            const distance =
                Math.abs(
                    other.distance -
                    horse.distance
                );


            if(
                distance <
                nearestDistance
            ){

                nearestDistance =
                    distance;

                nearestRival =
                    other;

            }

        });


        let rivalryBoost = 0;


        if(
            nearestRival &&
            nearestDistance < 18
        ){

            /*
               Kuda yang berdekatan
               menjadi lebih agresif.
            */

            rivalryBoost =
                horse.aggression *
                .28;

        }


        /* =============================================
           OVERTAKE
        ============================================= */

        let overtakeBoost = 0;


        if(
            nearestRival &&
            nearestRival.distance >
            horse.distance &&
            nearestDistance < 12
        ){

            overtakeBoost =
                horse.aggression *
                .32;

        }


        /* =============================================
           STAMINA
        ============================================= */

        let staminaFactor =
            horse.stamina /
            horse.maxStamina;


        /*
           Jika stamina turun,
           speed sedikit berkurang.
        */

        if(
            staminaFactor < .35
        ){

            staminaFactor =
                .82 +
                staminaFactor*.35;

        }
        else{

            staminaFactor =
                1;

        }


        /* =============================================
           BOOST
        ============================================= */

        horse.boostCooldown -=
            delta;


        let boost = 0;


        /*
           BOOST RANDOM
           terutama ketika tertinggal
           atau mendekati rival.
        */

        if(
            horse.boostCooldown <= 0
        ){

            const behindRival =
                nearestRival &&
                nearestRival.distance >
                horse.distance;


            const chance =
                behindRival
                ? .028
                : .012;


            if(
                Math.random() <
                chance
            ){

                horse.boostTimer =
                    .7 +
                    Math.random()*.8;

                horse.boostCooldown =
                    3 +
                    Math.random()*5;

            }

        }


        if(
            horse.boostTimer > 0
        ){

            horse.boostTimer -=
                delta;

            boost =
                horse.boostPower *
                .95;

            horse.stamina -=
                delta *
                .12;

        }
        else{

            /*
               Regenerasi stamina
            */

            horse.stamina +=
                delta *
                .025;

        }


        horse.stamina =
            THREE.MathUtils.clamp(
                horse.stamina,
                0,
                horse.maxStamina
            );


        /* =============================================
           FINAL SPEED
        ============================================= */

        let speed =
            horse.baseSpeed;

        speed +=
            naturalVariation;

        speed +=
            microVariation;

        speed +=
            randomWave;

        speed +=
            rivalryBoost;

        speed +=
            overtakeBoost;

        speed +=
            boost;


        speed *=
            staminaFactor;


        /*
           Sedikit randomness real-time
           supaya hasil tidak selalu sama.
        */

        speed +=
            (
                Math.random()-.5
            )*.035;


        horse.currentSpeed =
            speed;


        /* =============================================
           MOVEMENT
        ============================================= */

        const movement =
            speed * delta;


        horse.model.position.z -=
            movement;


        horse.distance +=
            movement;


        /* =============================================
           GALLOP MOTION
        ============================================= */

        const phase =
            elapsed *
            (
                7.2 +
                speed*.12
            ) +
            horse.bobPhase;


        horse.model.position.y =
            horse.baseY +
            Math.sin(phase)*.045;


        horse.model.position.x =
            horse.baseX +
            Math.sin(phase*.5)*.025;


        horse.model.rotation.z =
            Math.sin(phase*.5)*.008;


        horse.model.rotation.x =
            Math.sin(phase)*.006;


        if(horse.action){

            horse.action.setEffectiveTimeScale(

                THREE.MathUtils.clamp(
                    .84 +
                    speed/10*.31,
                    .84,
                    1.25
                )

            );

        }


        /* =============================================
           DUST
        ============================================= */

        horse.dustTimer =
            (horse.dustTimer || 0) -
            delta;


        if(
            horse.dustTimer <= 0
        ){

            spawnDust(horse);


            if(
                Math.random() > .32
            ){

                spawnDust(horse);

            }


            horse.dustTimer =
                .065 +
                Math.random()*.045;

        }


        /* =============================================
           FINISH
        ============================================= */

        if(
            horse.model.position.z <=
            FINISH_Z
        ){

            horse.finished =
                true;

            horse.finishTime =
                elapsed;

            finishOrder.push(
                horse
            );


            if(horse.action){

                horse.action.stop();

            }

        }

    });


    updateDust(delta);

    updateLeaderboard();


    if(
        finishOrder.length ===
        HORSE_COUNT
    ){

        finishRace();

    }

}


/* =====================================================
   LEADERBOARD
===================================================== */

function updateLeaderboard(){

    if(!horses.length)
        return;


    const sorted =
        [...horses].sort(
            (a,b)=>
                b.distance -
                a.distance
        );


    leaderRows.innerHTML =
        "";


    sorted.forEach(
        (horse,index)=>{

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "lb-row";


            if(index === 0){

                row.classList.add(
                    "leading"
                );

            }


            let status = "";


            if(
                horse.boostTimer > 0
            ){

                status =
                    " ⚡";

            }


            row.innerHTML = `

                <div class="lb-left">

                    <div class="lb-number">
                        ${index+1}
                    </div>

                    <div class="lb-player">
                        ${horse.player}
                        ${status}
                    </div>

                </div>

                <div class="lb-distance">
                    ${Math.round(
                        horse.distance
                    )}m
                </div>

            `;


            leaderRows.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   FINISH
===================================================== */

function finishRace(){

    raceFinished =
        true;

    raceStarted =
        false;


    raceStatus.textContent =
        "FINISH";


    finalList.innerHTML =
        "";


    finishOrder.forEach(
        (horse,index)=>{

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "final-row";


            if(index === 0){

                row.classList.add(
                    "first"
                );

            }


            row.innerHTML = `

                <span>
                    ${index+1}.
                    ${horse.player}
                </span>

                <span>
                    ${
                        index === 0
                        ? "🏆"
                        : ""
                    }
                </span>

            `;


            finalList.appendChild(
                row
            );

        }
    );


    setTimeout(()=>{

        finishPanel.classList.add(
            "show"
        );

    },1000);

}


/* =====================================================
   RESTART
===================================================== */

function restartRace(){

    finishPanel.classList.remove(
        "show"
    );


    /*
       GENERATE SPEED BARU
       SETIAP RACE
    */

    horses.forEach(
        (horse,index)=>{

            const x =
                (
                    index -
                    3.5
                ) *
                LANE_SPACING;


            horse.model.position.x =
                x;

            horse.model.position.z =
                START_Z;


            horse.baseX =
                x;


            horse.distance =
                0;


            horse.finished =
                false;


            horse.finishTime =
                null;


            /*
               SPEED BARU
            */

            horse.baseSpeed =
                8.5 +
                Math.random()*1.8;


            horse.currentSpeed =
                horse.baseSpeed;


            /*
               STAMINA BARU
            */

            horse.maxStamina =
                .75 +
                Math.random()*.25;

            horse.stamina =
                horse.maxStamina;


            /*
               PERSONALITY BARU
            */

            horse.aggression =
                .65 +
                Math.random()*.35;


            horse.boostPower =
                .65 +
                Math.random()*.55;


            horse.boostTimer =
                0;


            horse.boostCooldown =
                2 +
                Math.random()*3;


            if(horse.action){

                horse.action.stop();

            }

        }
    );


    finishOrder = [];


    raceStarted =
        false;

    raceFinished =
        false;

    countdownRunning =
        false;


    raceStatus.textContent =
        "GET READY";


    startPanel.classList.remove(
        "hidden"
    );


    updateLeaderboard();


    setTimeout(()=>{

        startCountdown();

    },400);

}


/* =====================================================
   CINEMATIC SIDE-TOP CAMERA
===================================================== */

function updateCamera(){

    if(!horses.length)
        return;


    /*
       CARI ROMBONGAN KUDA
    */

    let centerX = 0;

    let centerZ = 0;

    let count = 0;


    horses.forEach(horse=>{

        centerX +=
            horse.model.position.x;

        centerZ +=
            horse.model.position.z;

        count++;

    });


    if(count){

        centerX /= count;

        centerZ /= count;

    }


    /*
       =================================================
       CAMERA SAMPING-ATAS
       =================================================

       Kamera TIDAK berada di belakang.
       Kamera berada di kanan lintasan.

       X = samping
       Y = tinggi
       Z = sedikit mengikuti posisi race
    */


    const raceProgress =
        THREE.MathUtils.clamp(

            (
                START_Z -
                centerZ
            ) /
            (
                START_Z -
                FINISH_Z
            ),

            0,
            1

        );


    /*
       Semakin dekat finish,
       kamera sedikit turun.
    */

    const cameraHeight =
        THREE.MathUtils.lerp(
            18,
            14,
            raceProgress
        );


    /*
       Jarak samping kamera.
    */

    const sideDistance =
        THREE.MathUtils.lerp(
            25,
            20,
            raceProgress
        );


    /*
       Kamera sedikit bergerak
       ke depan-belakang untuk
       efek cinematic.
    */

    const cinematicSway =
        Math.sin(
            clock.elapsedTime*.25
        ) * 2;


    /*
       POSISI UTAMA KAMERA

       X positif =
       sisi kanan lintasan

       Z mengikuti rombongan,
       bukan berada di belakang.
    */

    cameraTarget.set(

        sideDistance,

        cameraHeight,

        centerZ +
        cinematicSway

    );


    /*
       Jika rombongan bergeser
       ke kiri/kanan, kamera
       ikut sedikit.
    */

    cameraTarget.x +=
        centerX*.15;


    /*
       Gerakan kamera smooth.
    */

    camera.position.lerp(
        cameraTarget,
        .045
    );


    /*
       TITIK YANG DILIHAT

       BUKAN ke belakang.

       Kamera melihat ke
       tengah rombongan.
    */

    cameraLook.set(

        centerX,

        1.8,

        centerZ - 2

    );


    camera.lookAt(
        cameraLook
    );


    /*
       Dynamic FOV
    */

    const targetFov =
        THREE.MathUtils.lerp(
            53,
            59,
            raceProgress
        );


    camera.fov +=
        (
            targetFov -
            camera.fov
        ) * .035;


    camera.updateProjectionMatrix();

}


/* =====================================================
   RESIZE
===================================================== */

function onResize(){

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    const elapsed =
        clock.elapsedTime;


    updateHorses(
        delta,
        elapsed
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   START
===================================================== */

createMenu();

init();

</script>
